<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>花蓮高商 3D 校園</title>
<style>
:root{
  --bg:#dfe8ee; --panel:rgba(255,255,255,.94); --ink:#1d2a33; --sub:#4b5b66;
  --line:rgba(0,0,0,.12); --accent:#1f6feb; --btn:#ffffff; --btnInk:#1d2a33;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1b232b; --panel:rgba(28,36,44,.94); --ink:#eef3f6; --sub:#a9b6bf;
    --line:rgba(255,255,255,.16); --accent:#5aa2ff; --btn:#26313b; --btnInk:#eef3f6;
  }
}
:root[data-theme="dark"]{
  --bg:#1b232b; --panel:rgba(28,36,44,.94); --ink:#eef3f6; --sub:#a9b6bf;
  --line:rgba(255,255,255,.16); --accent:#5aa2ff; --btn:#26313b; --btnInk:#eef3f6;
}
html,body{position:fixed;inset:0;margin:0;overflow:hidden;background:var(--bg);
  font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;font-weight:600;color:var(--ink)}
#app{position:absolute;inset:0;touch-action:none}
header,.bar,#info,#hint,#load{z-index:10}
canvas{display:block;touch-action:none}
header{position:absolute;left:12px;top:12px;right:12px;display:flex;gap:8px;align-items:center;pointer-events:none;flex-wrap:wrap}
header h1{margin:0;font-size:17px;font-weight:800;background:var(--panel);padding:8px 12px;border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.15);pointer-events:auto}
.bar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));
  display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:calc(100% - 24px);max-width:640px}
.bar button{flex:1 1 auto;min-width:72px;padding:10px 10px;border:1px solid var(--line);border-radius:10px;
  background:var(--btn);color:var(--btnInk);font:inherit;font-size:14px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.bar button.on{background:var(--accent);color:#fff;border-color:transparent}
#info{position:absolute;left:12px;right:12px;bottom:calc(70px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;
  background:var(--panel);border-radius:12px;padding:14px 16px;box-shadow:0 4px 16px rgba(0,0,0,.2);display:none}
#info h2{margin:0 0 6px;font-size:17px;font-weight:800}
#info p{margin:0;color:var(--sub);font-size:15px;line-height:1.6}
#info .x{position:absolute;right:8px;top:6px;border:0;background:none;font-size:22px;color:var(--sub);padding:4px 8px}
#hint{position:absolute;right:12px;top:58px;background:var(--panel);padding:6px 10px;border-radius:8px;font-size:13px;color:var(--sub)}
#load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--sub);pointer-events:none}
.lbl{font-size:12px;font-weight:800;color:#1d2a33;background:rgba(255,255,255,.88);padding:2px 6px;border-radius:6px;
  white-space:nowrap;pointer-events:none;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.pin{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:900;color:#fff;border:3px solid #ffe14d;cursor:pointer;pointer-events:auto;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.hideLbl .lbl{display:none} .hidePin .pin{display:none}
</style>
</head>
<body>
<div id="app"></div>
<div id="load">模型載入中…</div>
<script>
(function(){
  var el = document.getElementById('load');
  var shown = false;
  window.__stage = '下載 3D 程式庫';
  function show(msg, soft){ if (!document.getElementById('load') || (soft && shown)) return; shown = true;
    el.style.cssText += ';pointer-events:auto;padding:24px;text-align:center;line-height:1.7;font-size:15px;white-space:pre-wrap';
    el.textContent = msg + '\n卡在步驟：' + window.__stage + '\n\n請截圖這個畫面給老師。\n' + navigator.userAgent; }
  window.addEventListener('error', function(e){ show('載入失敗：' + (e.message || (e.target && e.target.src) || '未知錯誤')); }, true);
  window.addEventListener('unhandledrejection', function(e){ show('載入失敗：' + (e.reason && e.reason.message || e.reason)); });
  setTimeout(function(){ show('載入逾時（超過 20 秒）。', true); }, 20000);
})();
</script>
<header><h1>國立花蓮高商・3D 校園模型</h1></header>
<div id="hint">單指旋轉・雙指縮放／平移</div>
<div id="info"><button class="x" aria-label="關閉">×</button><h2></h2><p></p></div>
<div class="bar">
  <button id="bReset">預設視角</button>
  <button id="bTop">俯視</button>
  <button id="bLbl" class="on">建築名稱</button>
  <button id="bPin" class="on">安全點位</button>
</div>

<script type="module">
import * as THREE from './lib/three.module.js';
import { OrbitControls } from './lib/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from './lib/CSS2DRenderer.js';
import { mergeGeometries } from './lib/BufferGeometryUtils.js';
window.__stage = '建立校園模型';

/* 座標系：Google 衛星圖轉正 38.3° 後量測，單位公尺。
   x 向右（往操場、活動中心）、z 向下（往泗水園、資訊館）；中山路在左（x≈-18）、商校街在上。
   方位與學校〈校園安全地圖〉一致。外觀依 Google 地圖使用者照片與街景精修。 */
const FLOOR = 3.6;
let ledTex = null;   // 行政大樓跑馬燈貼圖（每格位移做捲動）
const app = document.getElementById('app');
const scene = new THREE.Scene();
const BG = new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#dfe8ee');
scene.background = BG; scene.fog = new THREE.Fog(BG, 450, 900);

const MOBILE = matchMedia('(pointer: coarse)').matches;
/* 畫質等級：0 完整（陰影）、1 省電（無陰影）、2 精簡（貼圖減半、解析度 1）、3 極簡（無外牆貼圖）
   手機從 1 開始；3D 畫面被系統收回時自動降一級重新載入，成功的等級記在本次瀏覽。網址加 ?q=0~3 可指定。 */
const QNAME = ['完整', '省電', '精簡', '極簡'];
let QL = MOBILE ? 1 : 0;
try { const q = new URLSearchParams(location.search).get('q') ?? sessionStorage.getItem('campus3d-q'); if (q !== null && q !== '') QL = Math.max(0, Math.min(3, +q)); } catch (e) {}
const TEXSCALE = QL >= 2 ? .5 : 1;
const renderer = new THREE.WebGLRenderer({ antialias: QL === 0 });
let GPU = '未知';
try { const gl = renderer.getContext(), d = gl.getExtension('WEBGL_debug_renderer_info'); if (d) GPU = gl.getParameter(d.UNMASKED_RENDERER_WEBGL); } catch (e) {}
renderer.setPixelRatio(Math.min(devicePixelRatio, [2, 1.5, 1, 1][QL]));
renderer.shadowMap.enabled = QL === 0; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);
const labelRenderer = new CSS2DRenderer();
labelRenderer.domElement.style.cssText = 'position:absolute;inset:0;pointer-events:none';
app.appendChild(labelRenderer.domElement);

const camera = new THREE.PerspectiveCamera(45, 1, 1, 3000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 8; controls.maxDistance = 650; controls.screenSpacePanning = true;
controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
const CENTER = new THREE.Vector3(125, 0, 85);
function viewDefault(){ camera.position.set(125, 200, 320); controls.target.copy(CENTER); }
function viewTop(){ camera.position.set(125, 380, 86); controls.target.copy(CENTER); }
viewDefault();

scene.add(new THREE.HemisphereLight(0xffffff, 0x8a9a7a, 1.0));
const sun = new THREE.DirectionalLight(0xfff6e8, 1.7);
sun.position.set(-120, 220, 60); sun.target.position.copy(CENTER);
sun.castShadow = QL === 0; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0005;
Object.assign(sun.shadow.camera, { left: -200, right: 200, top: 200, bottom: -200, near: 10, far: 600 });
scene.add(sun, sun.target);

// ================= 材質工具 =================
const lam = (c, o = {}) => new THREE.MeshLambertMaterial({ color: c, ...o });
function canvasTex(w, h, draw){
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  let src = c;
  if (TEXSCALE < 1){ src = document.createElement('canvas'); src.width = Math.max(8, Math.round(w * TEXSCALE)); src.height = Math.max(8, Math.round(h * TEXSCALE));
    src.getContext('2d').drawImage(c, 0, 0, src.width, src.height); }
  const t = new THREE.CanvasTexture(src); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = QL >= 2 ? 1 : 4; return t;
}
function textTex(text, { w = 1024, h = 128, color = '#c9a54a', bg = null, font = 'bold 84px "DFKai-SB","BiauKai","Kaiti TC","Noto Serif TC",serif', spacing = 0 } = {}){
  return canvasTex(w, h, (g) => {
    if (bg){ g.fillStyle = bg; g.fillRect(0, 0, w, h); }
    g.font = font; g.fillStyle = color; g.textBaseline = 'middle'; g.textAlign = 'center';
    if (spacing){
      const chars = [...text], step = (w - 40) / chars.length;
      chars.forEach((ch, i) => g.fillText(ch, 20 + step * (i + .5), h / 2));
    } else g.fillText(text, w / 2, h / 2);
  });
}
function textPlane(tex, w, h){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshLambertMaterial({ map: tex, transparent: true }));
  return m;
}
// 立面貼圖：依實際長度與樓層數畫出每一格窗
const facadeCache = new Map();
function facade(len, floors, o){
  const bay = o.bay || 4, nb = Math.max(1, Math.round(len / bay)), cw = 48, ch = 48;
  if (QL >= 3) return lam(o.wall);
  const key = nb + '|' + floors + '|' + JSON.stringify(o);
  if (facadeCache.has(key)) return facadeCache.get(key);
  const tex = canvasTex(Math.min(4096, nb * cw), floors * ch, (g, W, H) => {
    const bw = W / nb;
    g.fillStyle = o.wall; g.fillRect(0, 0, W, H);
    for (let f = 0; f < floors; f++){
      const y = f * ch, ground = f === floors - 1;
      if (o.band){ g.fillStyle = o.band; g.fillRect(0, y + ch - 9, W, 9); }
      for (let i = 0; i < nb; i++){
        const x = i * bw;
        if (o.pil){ g.fillStyle = o.pil; g.fillRect(x, y, 3, ch); }
        const t = ground && o.ground ? o.ground : o.win;
        if (t === 'louver'){
          g.fillStyle = '#f4f2ec'; g.fillRect(x + bw * .15, y + 9, bw * .7, 26);
          g.strokeStyle = '#a9aaa6'; g.lineWidth = 1;
          for (let k = 12; k < 35; k += 3){ g.beginPath(); g.moveTo(x + bw * .15, y + k); g.lineTo(x + bw * .85, y + k); g.stroke(); }
        } else if (t === 'teal'){
          g.fillStyle = '#2f7f86'; g.fillRect(x + bw * .12, y + 8, bw * .76, 28);
          g.fillStyle = '#9ec7d0'; g.fillRect(x + bw * .16, y + 11, bw * .32, 22); g.fillRect(x + bw * .52, y + 11, bw * .32, 22);
        } else if (t === 'glass'){
          g.fillStyle = o.frame || '#d8d8d2'; g.fillRect(x + bw * .1, y + 8, bw * .8, 28);
          g.fillStyle = '#4c5d68'; g.fillRect(x + bw * .14, y + 11, bw * .34, 22); g.fillRect(x + bw * .52, y + 11, bw * .34, 22);
        } else if (t === 'band'){
          g.fillStyle = '#3f5260'; g.fillRect(x, y + 12, bw, 20);
          g.fillStyle = '#d8d8d2'; g.fillRect(x + bw / 2 - 1, y + 12, 2, 20);
        } else if (t === 'slot'){
          g.fillStyle = '#3e4c56'; g.fillRect(x + bw * .42, y + 6, bw * .16, 36);
        } else if (t === 'shutter'){
          g.fillStyle = '#9aa4aa'; g.fillRect(x + bw * .1, y + 10, bw * .8, ch - 10);
          g.strokeStyle = '#7d878d';
          for (let k = y + 12; k < y + ch; k += 3){ g.beginPath(); g.moveTo(x + bw * .1, k); g.lineTo(x + bw * .9, k); g.stroke(); }
        } else if (t === 'door'){
          g.fillStyle = '#4c5d68'; g.fillRect(x + bw * .2, y + 10, bw * .6, ch - 10);
        } else if (t === 'round'){
          g.fillStyle = '#3e4c56'; g.beginPath(); g.arc(x + bw / 2, y + ch / 2, 10, 0, Math.PI * 2); g.fill();
          g.strokeStyle = '#f0ede6'; g.lineWidth = 3; g.stroke();
        }
      }
    }
  });
  const m = new THREE.MeshLambertMaterial({ map: tex }); facadeCache.set(key, m); return m;
}
const solarTex = (() => { const t = canvasTex(64, 64, (g) => {
  g.fillStyle = '#1d2c55'; g.fillRect(0, 0, 64, 64); g.strokeStyle = '#8193c0'; g.lineWidth = 2;
  for (let i = 0; i <= 64; i += 16){ g.beginPath(); g.moveTo(i, 0); g.lineTo(i, 64); g.stroke(); }
  g.beginPath(); g.moveTo(0, 32); g.lineTo(64, 32); g.stroke(); }); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t; })();
function solarMat(w, d){ if (QL >= 3) return lam(0x24356a); const t = solarTex.clone(); t.needsUpdate = true; t.repeat.set(w / 5, d / 5); return new THREE.MeshLambertMaterial({ map: t }); }
const brickTex = (() => { const t = canvasTex(64, 64, (g) => {
  g.fillStyle = '#9a5444'; g.fillRect(0, 0, 64, 64); g.strokeStyle = '#7d3f33'; g.lineWidth = 2;
  for (let y = 0; y < 64; y += 8){ g.beginPath(); g.moveTo(0, y); g.lineTo(64, y); g.stroke();
    for (let x = (y / 8) % 2 ? 0 : 8; x < 64; x += 16){ g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + 8); g.stroke(); } } });
  t.wrapS = t.wrapT = THREE.RepeatWrapping; return t; })();
function pavingMat(color, line){
  const t = canvasTex(64, 64, (g) => { g.fillStyle = color; g.fillRect(0, 0, 64, 64); g.strokeStyle = line; g.lineWidth = 1;
    for (let i = 0; i < 64; i += 8){ g.beginPath(); g.moveTo(i, 0); g.lineTo(i, 64); g.stroke(); g.beginPath(); g.moveTo(0, i); g.lineTo(64, i); g.stroke(); } });
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(.25, .25); return new THREE.MeshLambertMaterial({ map: t });
}
const M = {
  grass: lam(0x86b36a), ground: lam(0xc9c3b6), road: lam(0x5d6166), track: lam(0xc8553d), field: lam(0x6fa556),
  court: lam(0x3567c9), courtG: lam(0x3f8f87), water: lam(0x2d4f63), wallPink: lam(0xc9a39a), roofGray: lam(0x9aa3a8),
  white: lam(0xf2f0ea), concrete: lam(0xc4c4bf), trunk: lam(0x6b4f35), leaf: lam(0x3f7a3a), leaf2: lam(0x568f3e),
  palmLeaf: lam(0x4f8a3c, { side: THREE.DoubleSide }), line: new THREE.LineBasicMaterial({ color: 0xffffff }),
  brick: new THREE.MeshLambertMaterial({ map: brickTex }), wood: lam(0x7a4b2e), darkRoof: lam(0x4a3528),
  red: lam(0xc8322b), gold: lam(0xc9a54a), glass: lam(0x4c5d68), fence: new THREE.MeshLambertMaterial({ color: 0x2f6b46, transparent: true, opacity: .45, side: THREE.DoubleSide }),
  brickPave: pavingMat('#b0695a', '#8e5245'), stonePave: pavingMat('#9d9e9a', '#7e807c')
};

// ================= 幾何工具 =================
const labels = [];
function addLabel(text, x, y, z){
  const d = document.createElement('div'); d.className = 'lbl'; d.textContent = text;
  const o = new CSS2DObject(d); o.position.set(x, y, z); scene.add(o); labels.push(o); return o;
}
function box(w, h, d, mat, x = 0, y = 0, z = 0, parent = scene){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y + h / 2, z); m.castShadow = m.receiveShadow = true; parent.add(m); return m;
}
function flat(pts, mat, y = .02){
  const s = new THREE.Shape(pts.map(([x, z]) => new THREE.Vector2(x, -z)));
  const m = new THREE.Mesh(new THREE.ShapeGeometry(s), mat); m.rotation.x = -Math.PI / 2; m.position.y = y; m.receiveShadow = true; scene.add(m);
  // ShapeGeometry 的 UV 是公尺座標，鋪面貼圖可直接重複
  return m;
}
function rect(x0, z0, x1, z1, mat, y = .03){ return flat([[x0, z0], [x1, z0], [x1, z1], [x0, z1]], mat, y); }
function group(x, z, rotDeg = 0){ const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = -THREE.MathUtils.degToRad(rotDeg); scene.add(g); return g; }

/* 通用教室大樓：
   w×d（本地 x、z），floors，faces：各面立面設定 {n,s,e,w}（n=-z, s=+z, e=+x, w=-x），
   corridor：{side, depth, col, rail, railMat} 開放走廊（柱列＋樓板＋欄杆），
   roof：'solar'|'gray'，stairs：屋頂樓梯間 [[x,z,w,d,h]] */
function building(g, o){
  const H = (o.h ?? o.floors * FLOOR);
  let { w, d } = o, cx = 0, cz = 0;
  const C = o.corridor;
  if (C){ // 走廊那一側把主量體內縮
    if (C.side === 'e'){ w -= C.depth; cx -= C.depth / 2; }
    if (C.side === 'w'){ w -= C.depth; cx += C.depth / 2; }
    if (C.side === 's'){ d -= C.depth; cz -= C.depth / 2; }
    if (C.side === 'n'){ d -= C.depth; cz += C.depth / 2; }
  }
  const F = o.faces, def = F.all;
  const mat = (k, len) => facade(len, o.floors, F[k] || def);
  const core = new THREE.Mesh(new THREE.BoxGeometry(w, H, d),
    [mat('e', d), mat('w', d), M.roofGray, M.roofGray, mat('s', w), mat('n', w)]);
  core.position.set(cx, H / 2, cz); core.castShadow = core.receiveShadow = true; g.add(core);
  // 屋頂板＋女兒牆＋太陽能板
  const W = o.w, D = o.d;
  box(W + .4, .35, D + .4, M.concrete, 0, H, 0, g);
  const pm = o.parapet || M.white;
  box(W + .4, 1, .3, pm, 0, H + .35, -D / 2 - .05, g); box(W + .4, 1, .3, pm, 0, H + .35, D / 2 + .05, g);
  box(.3, 1, D + .4, pm, -W / 2 - .05, H + .35, 0, g); box(.3, 1, D + .4, pm, W / 2 + .05, H + .35, 0, g);
  if (o.roof === 'solar'){
    const sp = new THREE.Mesh(new THREE.PlaneGeometry(W - 1.6, D - 1.6), solarMat(W, D));
    sp.rotation.x = -Math.PI / 2; sp.position.y = H + 1.1; sp.receiveShadow = true; g.add(sp);
  }
  (o.stairs || []).forEach(([x, z, sw, sd, sh]) => box(sw, sh, sd, o.stairMat || M.white, x, H + .35, z, g));
  // 開放走廊
  if (C){
    const along = (C.side === 'e' || C.side === 'w') ? 'z' : 'x', L = along === 'z' ? D : W;
    const sgn = (C.side === 'e' || C.side === 's') ? 1 : -1;
    const outer = (along === 'z' ? W : D) / 2 * sgn, mid = outer - sgn * C.depth / 2;
    const colM = lam(C.col), railM = C.railMat || lam(C.rail);
    const P = (a, b) => along === 'z' ? [b, a] : [a, b];
    for (let a = -L / 2 + .3; a <= L / 2 - .2; a += C.bay || 4){
      const [x, z] = P(a, outer - sgn * .3); box(.5, H, .5, colM, x, 0, z, g);
    }
    for (let f = 1; f < o.floors; f++){
      const y = f * FLOOR;
      const [sx, sz] = P(0, mid), [lx, lz] = along === 'z' ? [C.depth, L] : [L, C.depth];
      box(lx, .3, lz, M.concrete, sx, y - .15, sz, g);
      const [rx, rz] = P(0, outer - sgn * .1), [rw, rd] = along === 'z' ? [.2, L] : [L, .2];
      box(rw, 1.05, rd, railM, rx, y + .15, rz, g);
    }
  }
  return H;
}

// ---------- 樹 ----------
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const leafGeo = new THREE.IcosahedronGeometry(1, 1), trunkGeo = new THREE.CylinderGeometry(.22, .32, 1, 6);
function tree(x, z, s = 1){
  const g = group(x, z);
  const t = new THREE.Mesh(trunkGeo, M.trunk); t.scale.set(s, 3 * s, s); t.position.y = 1.5 * s; g.add(t);
  for (let k = 0; k < 3; k++){
    const c = new THREE.Mesh(leafGeo, rnd() < .5 ? M.leaf : M.leaf2);
    const r = (1.6 + rnd() * .9) * s; c.scale.set(r, r * .85, r);
    c.position.set((rnd() - .5) * 1.6 * s, (3.8 + rnd() * 1.4) * s, (rnd() - .5) * 1.6 * s); c.castShadow = true; g.add(c);

function slice(g, start, count){
  const out = new THREE.BufferGeometry();
  for (const k of ['position', 'normal', 'uv']){
    const a = g.attributes[k];
    out.setAttribute(k, new THREE.BufferAttribute(a.array.slice(start * a.itemSize, (start + count) * a.itemSize), a.itemSize));
  }
  return out;
}
const buckets = new Map(), olds = [];
scene.traverse(m => {
  if (!m.isMesh || m === base) return;
  olds.push(m);
  const g = prep(m.geometry); g.applyMatrix4(m.matrixWorld);
  const parts = Array.isArray(m.material)
    ? (g.groups.length ? g.groups : [{ start: 0, count: g.attributes.position.count, materialIndex: 0 }]).map(gr => [slice(g, gr.start, gr.count), m.material[gr.materialIndex]])
    : [[g, m.material]];
  for (const [pg, mt0] of parts){
    if (!pg.attributes.position.count) continue;
    const mt = canonical(mt0), key = mt.uuid + (m.castShadow ? 'C' : '') + (m.receiveShadow ? 'R' : '');
    if (!buckets.has(key)) buckets.set(key, { mt, cast: m.castShadow, recv: m.receiveShadow, list: [] });
    buckets.get(key).list.push(pg);
  }
});
olds.forEach(m => m.parent.remove(m));
for (const { mt, cast, recv, list } of buckets.values()){
  const merged = new THREE.Mesh(mergeGeometries(list, false), mt);
  merged.castShadow = cast; merged.receiveShadow = recv; merged.matrixAutoUpdate = false;
  scene.add(merged);
}
console.log(`[合併] 物件 ${olds.length} 個、繪製 ${drawBefore} 次 → ${buckets.size} 次`);

const ray = new THREE.Ray(), tmp = new THREE.Vector3(), hit = new THREE.Vector3();
let frame = 0;
function updateLabels(){
  labels.forEach(o => {
    o.getWorldPosition(tmp); const dist = tmp.distanceTo(camera.position);
    ray.set(camera.position, tmp.clone().sub(camera.position).normalize());
    const blocked = occBoxes.some(b => !b.containsPoint(tmp) && ray.intersectBox(b, hit) && hit.distanceTo(camera.position) < dist - 3);
    o.element.style.visibility = blocked ? 'hidden' : 'visible';
  });
}

// 繪圖階段出錯或 3D 畫面被系統收回時，顯示訊息而不是靜默空白
function fail(msg){
  let el = document.getElementById('gfxerr');
  if (!el){ el = document.createElement('div'); el.id = 'gfxerr';
    el.style.cssText = 'position:absolute;left:12px;right:12px;top:64px;z-index:20;background:var(--panel);padding:14px;border-radius:10px;font-size:14px;line-height:1.6;white-space:pre-wrap';
    document.body.appendChild(el); }
  el.textContent = msg + '\n畫質等級：' + QL + ' ' + QNAME[QL] + '\n繪圖晶片：' + GPU + '\n' + navigator.userAgent + '\n請截圖給老師。';
}
renderer.domElement.addEventListener('webglcontextlost', (e) => {
  e.preventDefault();
  if (QL < 3){ try { sessionStorage.setItem('campus3d-q', QL + 1); } catch (er) {}
    const u = new URL(location.href); u.searchParams.delete('q'); location.replace(u); return; }
  fail('3D 畫面被系統收回（可能是繪圖記憶體不足），已降到最低畫質仍無法顯示。');
});
// 繪圖晶片編譯陰影效果失敗時：自動關閉陰影再試，而不是整個空白
let shadowFallback = false;
renderer.debug.onShaderError = (gl, program, vs, fs) => {
  console.error('[著色器錯誤]', gl.getProgramInfoLog(program), gl.getShaderInfoLog(vs), gl.getShaderInfoLog(fs));
  if (!shadowFallback){ shadowFallback = true; renderer.shadowMap.enabled = false;
    scene.traverse(m => { if (m.material) [].concat(m.material).forEach(x => x.needsUpdate = true); }); }
};
let failed = false, first = true;
window.__stage = '第一次繪製';
renderer.setAnimationLoop(() => {
  if (failed) return;
  try {
    if (++frame % 12 === 0) updateLabels();
    if (ledTex) ledTex.offset.x = (performance.now() / 1000 * .12) % 1;   // 依時間捲動，幀率高低都等速
    if (fly){ fly.t = Math.min(1, fly.t + .035); const k = 1 - Math.pow(1 - fly.t, 3);
      controls.target.lerpVectors(fly.ft, fly.tt, k); camera.position.lerpVectors(fly.fp, fly.tp, k); if (fly.t >= 1) fly = null; }
    controls.update(); renderer.render(scene, camera); labelRenderer.render(scene, camera);
    if (first){ first = false; const l = document.getElementById('load'); if (l) l.remove(); window.__stage = '完成';
      try { sessionStorage.setItem('campus3d-q', QL); } catch (er) {}
      document.querySelector('header').insertAdjacentHTML('beforeend', `<span style="background:var(--panel);padding:6px 10px;border-radius:8px;font-size:12px;color:var(--sub);pointer-events:auto">畫質：${QNAME[QL]}</span>`); }
  } catch (err){ failed = true; fail('繪圖錯誤：' + err.message); }
});
</script>
