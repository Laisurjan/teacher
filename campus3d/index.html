<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>花蓮高商 3D 校園</title>
<style>
:root{
  --bg:#dfe8ee; --panel:rgba(255,255,255,.94); --ink:#1d2a33; --sub:#4b5b66;
  --line:rgba(0,0,0,.12); --accent:#1f6feb; --btn:#ffffff; --btnInk:#1d2a33;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1b232b; --panel:rgba(28,36,44,.94); --ink:#eef3f6; --sub:#a9b6bf;
    --line:rgba(255,255,255,.16); --accent:#5aa2ff; --btn:#26313b; --btnInk:#eef3f6;
  }
}
:root[data-theme="dark"]{
  --bg:#1b232b; --panel:rgba(28,36,44,.94); --ink:#eef3f6; --sub:#a9b6bf;
  --line:rgba(255,255,255,.16); --accent:#5aa2ff; --btn:#26313b; --btnInk:#eef3f6;
}
html,body{position:fixed;inset:0;margin:0;overflow:hidden;background:var(--bg);
  font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;font-weight:600;color:var(--ink)}
#app{position:absolute;inset:0;touch-action:none}
header,.bar,#info,#hint,#load{z-index:10}
canvas{display:block;touch-action:none}
header{position:absolute;left:12px;top:12px;right:12px;display:flex;gap:8px;align-items:center;pointer-events:none;flex-wrap:wrap}
header h1{margin:0;font-size:17px;font-weight:800;background:var(--panel);padding:8px 12px;border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.15);pointer-events:auto}
.bar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));
  display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:calc(100% - 24px);max-width:640px}
.bar button{flex:1 1 auto;min-width:72px;padding:10px 10px;border:1px solid var(--line);border-radius:10px;
  background:var(--btn);color:var(--btnInk);font:inherit;font-size:14px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.bar button.on{background:var(--accent);color:#fff;border-color:transparent}
#info{position:absolute;left:12px;right:12px;bottom:calc(70px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;
  background:var(--panel);border-radius:12px;padding:14px 16px;box-shadow:0 4px 16px rgba(0,0,0,.2);display:none}
#info h2{margin:0 0 6px;font-size:17px;font-weight:800}
#info p{margin:0;color:var(--sub);font-size:15px;line-height:1.6}
#info .x{position:absolute;right:8px;top:6px;border:0;background:none;font-size:22px;color:var(--sub);padding:4px 8px}
#hint{position:absolute;right:12px;top:58px;background:var(--panel);padding:6px 10px;border-radius:8px;font-size:13px;color:var(--sub)}
#load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--sub);pointer-events:none}
.lbl{font-size:12px;font-weight:800;color:#1d2a33;background:rgba(255,255,255,.88);padding:2px 6px;border-radius:6px;
  white-space:nowrap;pointer-events:none;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.pin{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:900;color:#fff;border:3px solid #ffe14d;cursor:pointer;pointer-events:auto;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.hideLbl .lbl{display:none} .hidePin .pin{display:none}
/* ===== 開場動畫：線條勾勒 → 校園安全地圖 → 3D ===== */
header,.bar,#hint{transition:opacity .9s ease}
.introOn header,.introOn .bar,.introOn #hint{opacity:0;pointer-events:none}
.lbl{transition:opacity .9s ease} .pin{transition:opacity .7s ease}
.introOn .lbl,.introOn:not(.introPins) .pin{opacity:0}
.introOn #load{z-index:31;align-items:flex-end;padding-bottom:20vh;color:#6f9fbd;font-size:13px;letter-spacing:.3em}
#intro{position:absolute;inset:0;z-index:30;display:none;background:#06101b;color:#d8ecf7;transition:background .8s ease}
.introOn #intro,#intro.keep{display:block}
#intro.enter{animation:itFade .5s ease both}
@keyframes itFade{from{opacity:0}}
#intro canvas{position:absolute;inset:0;width:100%;height:100%;transition:opacity .8s ease}
#intro.fade,#intro.clear{background:transparent;pointer-events:none}
#intro.fade canvas,#intro.fade .it-map{opacity:0}
.it-title{position:absolute;left:16px;right:16px;top:50%;transform:translateY(-50%);text-align:center;pointer-events:none;transition:opacity .9s ease,transform 1.2s ease}
.it-title small{display:block;font-size:clamp(9px,1.2vw,12px);letter-spacing:.42em;padding-left:.42em;color:#7fb8d8;font-weight:700;animation:itUp 1.2s .2s cubic-bezier(.2,.7,.2,1) both}
.it-title b{display:block;font-size:clamp(34px,7.4vw,78px);font-weight:900;letter-spacing:.2em;padding-left:.2em;margin:.28em 0 .32em;color:#eef9ff;
  text-shadow:0 0 28px rgba(110,200,255,.6),0 0 2px rgba(255,255,255,.8);animation:itUp 1.4s cubic-bezier(.2,.7,.2,1) both}
.it-title i{display:block;height:1px;width:min(420px,70%);margin:0 auto .9em;background:linear-gradient(90deg,transparent,#8fe3ff,transparent);
  transform-origin:center;animation:itLine 1.6s .3s cubic-bezier(.2,.7,.2,1) both}
.it-title span{font-size:clamp(13px,1.9vw,19px);letter-spacing:.55em;padding-left:.55em;color:#a9dcf5;animation:itUp 1.2s .45s cubic-bezier(.2,.7,.2,1) both}
.it-title.out{opacity:0;transform:translateY(-50%) scale(1.08)}
@keyframes itUp{from{opacity:0;transform:translateY(14px) scale(.96)}}
@keyframes itLine{from{transform:scaleX(0);opacity:0}}
.it-map{position:absolute;left:max(16px,env(safe-area-inset-left));top:16px;color:#3d2373;pointer-events:none;opacity:0;transform:translateY(-8px);
  transition:opacity .8s ease,transform .8s ease;background:rgba(255,255,255,.82);padding:10px 14px 10px;border-radius:12px;box-shadow:0 4px 18px rgba(61,35,115,.15)}
.it-map.in{opacity:1;transform:none}
.it-map b{display:block;font-size:clamp(18px,2.6vw,26px);font-weight:900;letter-spacing:.12em}
.it-map ul{list-style:none;margin:6px 0 0;padding:0;display:flex;gap:4px 12px;flex-wrap:wrap;font-size:13px;font-weight:700}
.it-map li{display:flex;align-items:center;gap:5px}
.it-map li i{width:12px;height:12px;border-radius:50%;border:2px solid #ffe14d;display:inline-block}
.it-foot{position:absolute;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:8px 14px;
  justify-content:center;align-items:center;pointer-events:auto;transition:opacity .6s ease}
#intro.done .it-foot{opacity:0;pointer-events:none}
.it-steps{display:flex;gap:6px;margin:0;padding:6px;list-style:none;background:rgba(6,16,27,.62);border-radius:999px;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.it-steps li{position:relative;padding:6px 12px;font-size:13px;font-weight:700;letter-spacing:.12em;color:#cfe6f3;opacity:.45;transition:opacity .5s;overflow:hidden;border-radius:999px}
.it-steps li::before{content:attr(data-n);margin-right:6px;font-size:11px;color:#8fe3ff}
.it-steps li::after{content:"";position:absolute;left:12px;right:12px;bottom:3px;height:2px;background:#8fe3ff;transform-origin:left;transform:scaleX(var(--p,0))}
.it-steps li.on{opacity:1}
.it-ctrl{display:flex;gap:8px;align-items:center;background:rgba(6,16,27,.62);border-radius:999px;padding:4px 6px 4px 14px;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);font-size:13px;color:#cfe6f3}
.it-ctrl label{display:flex;gap:6px;align-items:center;cursor:pointer;padding:6px 0}
.it-ctrl input{width:16px;height:16px;accent-color:#8fe3ff;margin:0}
#itSkip{display:none;border:1px solid rgba(143,227,255,.5);background:transparent;color:#eaf7ff;font:inherit;font-size:13px;font-weight:700;
  padding:6px 14px;border-radius:999px;cursor:pointer}
.introSeen #itSkip{display:inline-block}
#bIntro{background:var(--panel);border:0;padding:6px 10px;border-radius:8px;font:inherit;font-size:12px;color:var(--sub);pointer-events:auto;cursor:pointer}
</style>
</head>
<body>
<div id="app"></div>
<div id="intro">
  <canvas></canvas>
  <div class="it-title"><small>NATIONAL HUALIEN COMMERCIAL HIGH SCHOOL</small><b>國立花蓮高商</b><i></i><span>3D 校園安全地圖</span></div>
  <div class="it-map"><b>校園安全地圖</b><ul><li><i style="background:#d7263d"></i>最危險區域</li><li><i style="background:#e0457b"></i>危險區域</li><li><i style="background:#f29bb3"></i>次危險區域</li></ul></div>
  <div class="it-foot">
    <ol class="it-steps"><li data-n="01">線條勾勒</li><li data-n="02">安全地圖</li><li data-n="03">立體校園</li></ol>
    <div class="it-ctrl"><label><input type="checkbox" id="itNext">下次直接進入 3D</label><button id="itSkip">跳過 ›</button></div>
  </div>
</div>
<div id="load">模型載入中…</div>
<script>
/* 開場動畫：第一次造訪一定播放；看過之後才出現「跳過」，勾了「下次直接進入 3D」就不再自動播放。
   網址 ?intro=1 強制播放、?intro=0 不播放（測試用） */
(function(){
  var r = document.documentElement, q = new URLSearchParams(location.search).get('intro'), seen = false, skip = false;
  try { seen = localStorage.getItem('campus3d-introSeen') === '1'; skip = localStorage.getItem('campus3d-skipIntro') === '1'; } catch (e) {}
  var lost = false; try { lost = !!sessionStorage.getItem('campus3d-lost'); } catch (e) {}   // 本次瀏覽曾因記憶體不足降階重載
  if (q === '1' || (q !== '0' && !lost && !(seen && skip))) r.classList.add('introOn');
  if (seen) r.classList.add('introSeen');
})();
(function(){
  var el = document.getElementById('load');
  var shown = false;
  window.__stage = '下載 3D 程式庫';
  function show(msg, soft){ if (!document.getElementById('load') || (soft && shown)) return; shown = true;
    el.style.cssText += ';pointer-events:auto;padding:24px;text-align:center;line-height:1.7;font-size:15px;white-space:pre-wrap';
    el.textContent = msg + '\n卡在步驟：' + window.__stage + '\n\n請截圖這個畫面給老師。\n' + navigator.userAgent; }
  window.addEventListener('error', function(e){ show('載入失敗：' + (e.message || (e.target && e.target.src) || '未知錯誤')); }, true);
  window.addEventListener('unhandledrejection', function(e){ show('載入失敗：' + (e.reason && e.reason.message || e.reason)); });
  setTimeout(function(){ show('載入逾時（超過 20 秒）。', true); }, 20000);
})();
</script>
<header><h1>國立花蓮高商・3D 校園模型</h1></header>
<div id="hint">單指旋轉・雙指縮放／平移</div>
<div id="info"><button class="x" aria-label="關閉">×</button><h2></h2><p></p></div>
<div class="bar">
  <button id="bReset">預設視角</button>
  <button id="bTop">俯視</button>
  <button id="bLbl" class="on">建築名稱</button>
  <button id="bPin" class="on">安全點位</button>
</div>

<script type="module">
import * as THREE from './lib/three.module.js';
import { OrbitControls } from './lib/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from './lib/CSS2DRenderer.js';
import { mergeGeometries } from './lib/BufferGeometryUtils.js';
window.__stage = '建立校園模型';

/* 座標系：Google 衛星圖轉正 38.3° 後量測，單位公尺。
   x 向右（往操場、活動中心）、z 向下（往泗水園、資訊館）；中山路在左（x≈-18）、商校街在上。
   方位與學校〈校園安全地圖〉一致。外觀依 Google 地圖使用者照片與街景精修。 */
const FLOOR = 3.6;
let ledTex = null;   // 行政大樓跑馬燈貼圖（每格位移做捲動）
const app = document.getElementById('app');
const scene = new THREE.Scene();
const BG = new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#dfe8ee');
scene.background = BG; scene.fog = new THREE.Fog(BG, 450, 900);

const MOBILE = matchMedia('(pointer: coarse)').matches || /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)
  || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
/* 畫質等級：0 完整（陰影）、1 省電（無陰影）、2 精簡（貼圖減半、解析度 1）、3 極簡（無外牆貼圖）
   手機從 1 開始；3D 畫面被系統收回時自動降一級重新載入，成功的等級記在本次瀏覽。網址加 ?q=0~3 可指定。 */
const QNAME = ['完整', '省電', '精簡', '極簡'];
let QL = MOBILE ? 1 : 0;
try { const q = new URLSearchParams(location.search).get('q') ?? sessionStorage.getItem('campus3d-q'); if (q !== null && q !== '') QL = Math.max(0, Math.min(3, +q)); } catch (e) {}
const TEXSCALE = QL >= 2 ? .5 : 1;
const renderer = new THREE.WebGLRenderer({ antialias: QL === 0 });
let GPU = '未知';
try { const gl = renderer.getContext(), d = gl.getExtension('WEBGL_debug_renderer_info'); if (d) GPU = gl.getParameter(d.UNMASKED_RENDERER_WEBGL); } catch (e) {}
renderer.setPixelRatio(Math.min(devicePixelRatio, [2, 1.5, 1, 1][QL]));
renderer.shadowMap.enabled = QL === 0; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);
const labelRenderer = new CSS2DRenderer();
labelRenderer.domElement.style.cssText = 'position:absolute;inset:0;pointer-events:none';
app.appendChild(labelRenderer.domElement);

const camera = new THREE.PerspectiveCamera(45, 1, 1, 3000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 8; controls.maxDistance = 650; controls.screenSpacePanning = true;
controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
const CENTER = new THREE.Vector3(125, 0, 85);
function viewDefault(){ camera.position.set(125, 200, 320); controls.target.copy(CENTER); }
function viewTop(){ camera.position.set(125, 380, 86); controls.target.copy(CENTER); }
viewDefault();

scene.add(new THREE.HemisphereLight(0xffffff, 0x8a9a7a, 1.0));
const sun = new THREE.DirectionalLight(0xfff6e8, 1.7);
sun.position.set(-120, 220, 60); sun.target.position.copy(CENTER);
sun.castShadow = QL === 0; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0005;
Object.assign(sun.shadow.camera, { left: -200, right: 200, top: 200, bottom: -200, near: 10, far: 600 });
scene.add(sun, sun.target);

// ================= 材質工具 =================
const lam = (c, o = {}) => new THREE.MeshLambertMaterial({ color: c, ...o });
function canvasTex(w, h, draw){
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  let src = c;
  if (TEXSCALE < 1){ src = document.createElement('canvas'); src.width = Math.max(8, Math.round(w * TEXSCALE)); src.height = Math.max(8, Math.round(h * TEXSCALE));
    src.getContext('2d').drawImage(c, 0, 0, src.width, src.height); }
  const t = new THREE.CanvasTexture(src); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = QL >= 2 ? 1 : 4; return t;
}
function textTex(text, { w = 1024, h = 128, color = '#c9a54a', bg = null, font = 'bold 84px "DFKai-SB","BiauKai","Kaiti TC","Noto Serif TC",serif', spacing = 0 } = {}){
  return canvasTex(w, h, (g) => {
    if (bg){ g.fillStyle = bg; g.fillRect(0, 0, w, h); }
    g.font = font; g.fillStyle = color; g.textBaseline = 'middle'; g.textAlign = 'center';
    if (spacing){
      const chars = [...text], step = (w - 40) / chars.length;
      chars.forEach((ch, i) => g.fillText(ch, 20 + step * (i + .5), h / 2));
    } else g.fillText(text, w / 2, h / 2);
  });
}
function textPlane(tex, w, h){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshLambertMaterial({ map: tex, transparent: true }));
  return m;
}
// 立面貼圖：依實際長度與樓層數畫出每一格窗
const facadeCache = new Map();
function facade(len, floors, o){
  const bay = o.bay || 4, nb = Math.max(1, Math.round(len / bay)), cw = 48, ch = 48;
  if (QL >= 3) return lam(o.wall);
  const key = nb + '|' + floors + '|' + JSON.stringify(o);
  if (facadeCache.has(key)) return facadeCache.get(key);
  const tex = canvasTex(Math.min(4096, nb * cw), floors * ch, (g, W, H) => {
    const bw = W / nb;
    g.fillStyle = o.wall; g.fillRect(0, 0, W, H);
    for (let f = 0; f < floors; f++){
      const y = f * ch, ground = f === floors - 1;
      if (o.band){ g.fillStyle = o.band; g.fillRect(0, y + ch - 9, W, 9); }
      for (let i = 0; i < nb; i++){
        const x = i * bw;
        if (o.pil){ g.fillStyle = o.pil; g.fillRect(x, y, 3, ch); }
        const t = ground && o.ground ? o.ground : o.win;
        if (t === 'louver'){
          g.fillStyle = '#f4f2ec'; g.fillRect(x + bw * .15, y + 9, bw * .7, 26);
          g.strokeStyle = '#a9aaa6'; g.lineWidth = 1;
          for (let k = 12; k < 35; k += 3){ g.beginPath(); g.moveTo(x + bw * .15, y + k); g.lineTo(x + bw * .85, y + k); g.stroke(); }
        } else if (t === 'teal'){
          g.fillStyle = '#2f7f86'; g.fillRect(x + bw * .12, y + 8, bw * .76, 28);
          g.fillStyle = '#9ec7d0'; g.fillRect(x + bw * .16, y + 11, bw * .32, 22); g.fillRect(x + bw * .52, y + 11, bw * .32, 22);
        } else if (t === 'glass'){
          g.fillStyle = o.frame || '#d8d8d2'; g.fillRect(x + bw * .1, y + 8, bw * .8, 28);
          g.fillStyle = '#4c5d68'; g.fillRect(x + bw * .14, y + 11, bw * .34, 22); g.fillRect(x + bw * .52, y + 11, bw * .34, 22);
        } else if (t === 'band'){
          g.fillStyle = '#3f5260'; g.fillRect(x, y + 12, bw, 20);
          g.fillStyle = '#d8d8d2'; g.fillRect(x + bw / 2 - 1, y + 12, 2, 20);
        } else if (t === 'slot'){
          g.fillStyle = '#3e4c56'; g.fillRect(x + bw * .42, y + 6, bw * .16, 36);
        } else if (t === 'shutter'){
          g.fillStyle = '#9aa4aa'; g.fillRect(x + bw * .1, y + 10, bw * .8, ch - 10);
          g.strokeStyle = '#7d878d';
          for (let k = y + 12; k < y + ch; k += 3){ g.beginPath(); g.moveTo(x + bw * .1, k); g.lineTo(x + bw * .9, k); g.stroke(); }
        } else if (t === 'door'){
          g.fillStyle = '#4c5d68'; g.fillRect(x + bw * .2, y + 10, bw * .6, ch - 10);
        } else if (t === 'round'){
          g.fillStyle = '#3e4c56'; g.beginPath(); g.arc(x + bw / 2, y + ch / 2, 10, 0, Math.PI * 2); g.fill();
          g.strokeStyle = '#f0ede6'; g.lineWidth = 3; g.stroke();
        }
      }
    }
  });
  const m = new THREE.MeshLambertMaterial({ map: tex }); facadeCache.set(key, m); return m;
}
const solarTex = (() => { const t = canvasTex(64, 64, (g) => {
  g.fillStyle = '#1d2c55'; g.fillRect(0, 0, 64, 64); g.strokeStyle = '#8193c0'; g.lineWidth = 2;
  for (let i = 0; i <= 64; i += 16){ g.beginPath(); g.moveTo(i, 0); g.lineTo(i, 64); g.stroke(); }
  g.beginPath(); g.moveTo(0, 32); g.lineTo(64, 32); g.stroke(); }); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t; })();
function solarMat(w, d){ if (QL >= 3) return lam(0x24356a); const t = solarTex.clone(); t.needsUpdate = true; t.repeat.set(w / 5, d / 5); return new THREE.MeshLambertMaterial({ map: t }); }
const brickTex = (() => { const t = canvasTex(64, 64, (g) => {
  g.fillStyle = '#9a5444'; g.fillRect(0, 0, 64, 64); g.strokeStyle = '#7d3f33'; g.lineWidth = 2;
  for (let y = 0; y < 64; y += 8){ g.beginPath(); g.moveTo(0, y); g.lineTo(64, y); g.stroke();
    for (let x = (y / 8) % 2 ? 0 : 8; x < 64; x += 16){ g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + 8); g.stroke(); } } });
  t.wrapS = t.wrapT = THREE.RepeatWrapping; return t; })();
function pavingMat(color, line){
  const t = canvasTex(64, 64, (g) => { g.fillStyle = color; g.fillRect(0, 0, 64, 64); g.strokeStyle = line; g.lineWidth = 1;
    for (let i = 0; i < 64; i += 8){ g.beginPath(); g.moveTo(i, 0); g.lineTo(i, 64); g.stroke(); g.beginPath(); g.moveTo(0, i); g.lineTo(64, i); g.stroke(); } });
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(.25, .25); return new THREE.MeshLambertMaterial({ map: t });
}
const M = {

/* 通用教室大樓：
   w×d（本地 x、z），floors，faces：各面立面設定 {n,s,e,w}（n=-z, s=+z, e=+x, w=-x），
   corridor：{side, depth, col, rail, railMat} 開放走廊（柱列＋樓板＋欄杆），
   roof：'solar'|'gray'，stairs：屋頂樓梯間 [[x,z,w,d,h]] */
function building(g, o){
  const H = (o.h ?? o.floors * FLOOR);
  let { w, d } = o, cx = 0, cz = 0;
  const C = o.corridor;
  if (C){ // 走廊那一側把主量體內縮
    if (C.side === 'e'){ w -= C.depth; cx -= C.depth / 2; }
    if (C.side === 'w'){ w -= C.depth; cx += C.depth / 2; }
    if (C.side === 's'){ d -= C.depth; cz -= C.depth / 2; }
    if (C.side === 'n'){ d -= C.depth; cz += C.depth / 2; }
  }
  const F = o.faces, def = F.all;
  const mat = (k, len) => facade(len, o.floors, F[k] || def);
  const core = new THREE.Mesh(new THREE.BoxGeometry(w, H, d),
    [mat('e', d), mat('w', d), M.roofGray, M.roofGray, mat('s', w), mat('n', w)]);
  core.position.set(cx, H / 2, cz); core.castShadow = core.receiveShadow = true; g.add(core);
  // 屋頂板＋女兒牆＋太陽能板
  const W = o.w, D = o.d;
  box(W + .4, .35, D + .4, M.concrete, 0, H, 0, g);
  const pm = o.parapet || M.white;
  box(W + .4, 1, .3, pm, 0, H + .35, -D / 2 - .05, g); box(W + .4, 1, .3, pm, 0, H + .35, D / 2 + .05, g);
  box(.3, 1, D + .4, pm, -W / 2 - .05, H + .35, 0, g); box(.3, 1, D + .4, pm, W / 2 + .05, H + .35, 0, g);
  if (o.roof === 'solar'){
    const sp = new THREE.Mesh(new THREE.PlaneGeometry(W - 1.6, D - 1.6), solarMat(W, D));
    sp.rotation.x = -Math.PI / 2; sp.position.y = H + 1.1; sp.receiveShadow = true; g.add(sp);
  }
  (o.stairs || []).forEach(([x, z, sw, sd, sh]) => box(sw, sh, sd, o.stairMat || M.white, x, H + .35, z, g));
  // 開放走廊
  if (C){
    const along = (C.side === 'e' || C.side === 'w') ? 'z' : 'x', L = along === 'z' ? D : W;
    const sgn = (C.side === 'e' || C.side === 's') ? 1 : -1;
    const outer = (along === 'z' ? W : D) / 2 * sgn, mid = outer - sgn * C.depth / 2;
    const colM = lam(C.col), railM = C.railMat || lam(C.rail);
    const P = (a, b) => along === 'z' ? [b, a] : [a, b];
    for (let a = -L / 2 + .3; a <= L / 2 - .2; a += C.bay || 4){
      const [x, z] = P(a, outer - sgn * .3); box(.5, H, .5, colM, x, 0, z, g);
    }
    for (let f = 1; f < o.floors; f++){
      const y = f * FLOOR;
      const [sx, sz] = P(0, mid), [lx, lz] = along === 'z' ? [C.depth, L] : [L, C.depth];
      box(lx, .3, lz, M.concrete, sx, y - .15, sz, g);
      const [rx, rz] = P(0, outer - sgn * .1), [rw, rd] = along === 'z' ? [.2, L] : [L, .2];
      box(rw, 1.05, rd, railM, rx, y + .15, rz, g);
    }
  }

}

    const r = wid / 2, s = (len - wid) / 2, sh = new THREE.Shape();
    sh.moveTo(-s, -r); sh.lineTo(s, -r); sh.absarc(s, 0, r, -Math.PI / 2, Math.PI / 2, false);

  const fd = new THREE.Mesh(new THREE.ShapeGeometry(stadium(L - 2 * lane, W - 2 * lane), 32), M.field); fd.rotation.x = -Math.PI / 2; fd.position.set(cx, .05, cz); fd.receiveShadow = true; scene.add(fd);
  for (let k = 1; k < 6; k++){
    const p = stadium(L - 2 * lane * k / 6, W - 2 * lane * k / 6).getPoints(40);

})();

    const y0 = -H, y1 = 2 * H, a = wipeX(pos, y0), b = wipeX(pos, y1);
    g.globalCompositeOperation = 'lighter';
    [[46, .07], [16, .18], [3, .9]].forEach(([w, al]) => { g.beginPath(); g.moveTo(a, y0); g.lineTo(b, y1); g.strokeStyle = `rgba(160,230,255,${al})`; g.lineWidth = w * dpr; g.stroke(); });
    g.globalCompositeOperation = 'source-over';
  }
  function pins(t){
    PIN.forEach((p, i) => { const tp = t - T.pin0 - i * .13; if (tp < 0) return;
      const kd = FX ? clamp01(tp / .6) : 1, drop = (1 - bounce(kd)) * 130 * dpr;   // 電腦版：帶光柱從空中落下彈跳
      const [x, y0] = proj(p.p), y = y0 - drop, k = FX ? clamp01(tp / .15) : back(clamp01(tp / .45)), r = 16 * dpr * k;   // 與 3D 點位 .pin 同尺寸（26px＋3px 邊框）
      if (kd < 1){ const gr = g.createLinearGradient(x, y - 220 * dpr, x, y); gr.addColorStop(0, 'rgba(255,240,200,0)'); gr.addColorStop(1, `rgba(255,240,200,${(.85 * (1 - kd)).toFixed(3)})`);
        g.globalCompositeOperation = 'lighter'; g.strokeStyle = gr; g.lineWidth = 5 * dpr; g.beginPath(); g.moveTo(x, y - 220 * dpr); g.lineTo(x, y); g.stroke(); g.globalCompositeOperation = 'source-over'; }
      const rp = (tp % 1.6) / 1.6;
      g.beginPath(); g.arc(x, y, (16 + 26 * rp) * dpr, 0, 7); g.strokeStyle = p.c; g.globalAlpha = .6 * (1 - rp) * clamp01(tp / .3); g.lineWidth = 3 * dpr; g.stroke(); g.globalAlpha = 1;
      g.save(); g.shadowColor = 'rgba(0,0,0,.35)'; g.shadowBlur = 6 * dpr; g.shadowOffsetY = 2 * dpr;
      g.beginPath(); g.arc(x, y, r, 0, 7); g.fillStyle = '#ffe14d'; g.fill(); g.restore();
      g.beginPath(); g.arc(x, y, r * 13 / 16, 0, 7); g.fillStyle = p.c; g.fill();
      g.fillStyle = '#fff'; g.font = `900 ${14 * dpr * k}px "Noto Sans TC","Microsoft JhengHei",sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(p.n, x, y + dpr); });
  }
  function ring(rt){   // ②→③：光環溶解地圖（畫在地面上，跟相機一起投影）
    const R = rt * RING_V - 12; if (R <= 0) return;
    const at = (rr, a) => proj(tmpV.set(-10 + rr * Math.cos(a), 0, 76 + rr * Math.sin(a)));
    const circle = (rr) => { const P = new Path2D(); for (let i = 0; i <= 72; i++){ const [x, y] = at(rr, i / 72 * Math.PI * 2); i ? P.lineTo(x, y) : P.moveTo(x, y); } return P; };
    g.globalCompositeOperation = 'destination-out';
    [[R, .25], [R - 4, .3], [R - 9, .45], [R - 15, 1]].forEach(([rr, a]) => { if (rr > 0){ g.globalAlpha = a; g.fill(circle(rr)); } });
    g.globalAlpha = 1; g.globalCompositeOperation = 'lighter';
    const C = circle(R); [[26, .08], [10, .22], [2.4, .95]].forEach(([w, a]) => { g.strokeStyle = `rgba(150,230,255,${a})`; g.lineWidth = w * dpr; g.stroke(C); });
    g.globalCompositeOperation = 'source-over';
    for (let i = 0; i < 10; i++){ const a = Math.random() * Math.PI * 2, [x, y] = at(R, a), [x2, y2] = at(R + 10, a), d = Math.hypot(x2 - x, y2 - y) || 1, v = (60 + Math.random() * 180) * dpr;
      sparks.push({ x, y, vx: (x2 - x) / d * v, vy: (y2 - y) / d * v - 50 * dpr, life: .35 + Math.random() * .45, age: 0, c: Math.random() < .3 ? '255,226,150' : '160,232,255' }); }
  }
  function sparkle(dt){
    if (!sparks.length) return;
    if (sparks.length > 500) sparks.splice(0, sparks.length - 500);
    g.globalCompositeOperation = 'lighter';
    for (let i = sparks.length - 1; i >= 0; i--){ const q = sparks[i]; q.age += dt; if (q.age > q.life){ sparks.splice(i, 1); continue; }
      q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 60 * dpr * dt; const a = 1 - q.age / q.life;
      g.fillStyle = `rgba(${q.c},${a.toFixed(3)})`; g.beginPath(); g.arc(q.x, q.y, (1 + 2.2 * a) * dpr, 0, 7); g.fill(); }
    g.globalCompositeOperation = 'source-over';
  }
  function draw(t){
    const dt = Math.max(0, Math.min(.05, t - lastT)); lastT = t;
    if (FX && t >= T.hold){ ic.position.copy(camera.position); ic.quaternion.copy(camera.quaternion); ic.updateMatrixWorld(); }
    else introCam(Math.min(1, t / T.cam));
    for (const s of S) s.sp = s.p.map(proj);
    const wq = clamp01((t - T.wipe0) / (T.wipe1 - T.wipe0)), pos = -.12 + 1.3 * ease(wq);
    if (wq < 1){ g.save(); if (wq > 0) half(pos, false); blueprint(t); g.restore(); }
    if (wq > 0){ g.save(); if (wq < 1) half(pos, true); paper(pos); g.restore(); if (wq < 1) scanEdge(pos); }
    pins(t);
    if (FX && wq > 0 && wq < 1) for (let i = 0; i < 7; i++){ const y = Math.random() * H;
      sparks.push({ x: wipeX(pos, y), y, vx: (80 + Math.random() * 260) * dpr, vy: (Math.random() - .5) * 90 * dpr, life: .4 + Math.random() * .5, age: 0, c: '170,235,255' }); }
    if (FX && t >= T.hold) ring(t - T.hold);
    if (FX) sparkle(dt);
  }

  // ---- 流程 ----
  const title = ov.querySelector('.it-title'), mapT = ov.querySelector('.it-map'), steps = [...ov.querySelectorAll('.it-steps li')];
  const chk = document.getElementById('itNext');
  try { chk.checked = localStorage.getItem('campus3d-skipIntro') === '1'; } catch (e) {}
  chk.onchange = () => { try { chk.checked ? localStorage.setItem('campus3d-skipIntro', '1') : localStorage.removeItem('campus3d-skipIntro'); } catch (e) {} };
  function start(replay){
    state = 'run'; t0 = null; last = 0; fly = null; controls.enabled = false; scene.fog.near = 5000; scene.fog.far = 9000; GROW.value = -1; if (renderer.shadowMap.enabled) sun.position.copy(SUN_LOW);
    alloc(); ov.classList.remove('fade', 'clear', 'done', 'keep'); root.classList.remove('introPins'); root.classList.add('introOn');
    handed = false; lastT = 0; sparks.length = 0;
    mapT.classList.remove('in'); title.classList.remove('out');
    if (replay){ ov.classList.remove('enter'); title.querySelectorAll('*').forEach(e => { e.style.animation = 'none'; void e.offsetWidth; e.style.animation = ''; });
      void ov.offsetWidth; ov.classList.add('enter'); }
    g.fillStyle = '#06101b'; g.fillRect(0, 0, W, H);
  }
  function finish(){
    if (state === 'off') return; state = 'off';
    ov.classList.add('keep', 'fade', 'done'); root.classList.remove('introOn', 'introPins'); root.classList.add('introSeen');
    setTimeout(() => { if (state === 'off'){ ov.classList.remove('keep', 'done', 'fade', 'clear', 'enter'); cv.width = cv.height = 1; } }, 700);   // 釋放畫布記憶體（手機最後階段最吃緊）
    scene.fog.near = 450; scene.fog.far = 900; GROW.value = 1e3; sun.position.copy(SUN0); viewDefault(); controls.enabled = true; controls.update();
    try { localStorage.setItem('campus3d-introSeen', '1'); } catch (e) {}
    hintLater();
  }
  document.getElementById('itSkip').onclick = finish;
  function tick(now){
    if (state !== 'run') return;
    if (t0 === null) t0 = now;
    const t = last = window.__introAt ?? (now - t0) / 1000;   // 測試用：設定 window.__introAt＝秒數可凍結在某一刻
    if (t > 2.8) title.classList.add('out');
    if (t > T.wipe0 + .5 && t < T.hold) mapT.classList.add('in');
    const si = t < T.wipe0 ? 0 : t < T.hold ? 1 : 2, sp = [t / T.wipe0, (t - T.wipe0) / (T.hold - T.wipe0), (t - T.hold) / (A0 + AD + BD)];
    steps.forEach((li, i) => { li.classList.toggle('on', i <= si); li.style.setProperty('--p', clamp01(sp[i])); });
    if (t >= T.hold){
      if (!handed){ handed = true; ov.classList.add(FX ? 'clear' : 'fade'); root.classList.add('introPins'); mapT.classList.remove('in'); }
      if (FX && t >= T.hold + 1.3) ov.classList.add('fade');
      // 地圖退場後 3D 只剩地面；鏡頭傾斜到位前樓房開始依拍子長出來
      GROW.value = t - T.hold - GROW0;
      if (flyCam(t - T.hold) && GROW.value >= GROW_END){ finish(); return; }
    }
    if (t < T.hold + (FX ? 2.2 : .9)) draw(t);
  }
  return {
    resize, tick, start: () => start(true),
    prewarm(){ if (state === 'run'){ flyCam(0); GROW.value = 1e3; } },   // 第一幀改用開場交接的俯視角度、全部長好的樣子畫，讓繪圖晶片先備妥，交接那一刻才不會卡
    get drive(){ return state === 'run'; },
    get cover(){ return state === 'run' && (t0 === null || last < T.hold); },
    _init(){ if (root.classList.contains('introOn')) start(false); }
  };
})();
resize(); intro._init();

const ray = new THREE.Ray(), tmp = new THREE.Vector3(), hit = new THREE.Vector3();
let frame = 0;
function updateLabels(){
  labels.forEach(o => {
    o.getWorldPosition(tmp); const dist = tmp.distanceTo(camera.position);
    ray.set(camera.position, tmp.clone().sub(camera.position).normalize());
    const blocked = occBoxes.some(b => !b.containsPoint(tmp) && ray.intersectBox(b, hit) && hit.distanceTo(camera.position) < dist - 3);
    o.element.style.visibility = blocked ? 'hidden' : 'visible';
  });
}

// 繪圖階段出錯或 3D 畫面被系統收回時，顯示訊息而不是靜默空白
function fail(msg){
  let el = document.getElementById('gfxerr');
  if (!el){ el = document.createElement('div'); el.id = 'gfxerr';
    el.style.cssText = 'position:absolute;left:12px;right:12px;top:64px;z-index:40;background:var(--panel);padding:14px;border-radius:10px;font-size:14px;line-height:1.6;white-space:pre-wrap';
    document.body.appendChild(el); }
  el.textContent = msg + '\n畫質等級：' + QL + ' ' + QNAME[QL] + '\n繪圖晶片：' + GPU + '\n' + navigator.userAgent + '\n請截圖給老師。';
}
renderer.domElement.addEventListener('webglcontextlost', (e) => {
  e.preventDefault();
  if (QL < 3){ try { sessionStorage.setItem('campus3d-q', QL + 1); sessionStorage.setItem('campus3d-lost', 'new'); localStorage.setItem('campus3d-introSeen', '1'); } catch (er) {}
    const u = new URL(location.href); u.searchParams.delete('q'); location.replace(u); return; }
  fail('3D 畫面被系統收回（可能是繪圖記憶體不足），已降到最低畫質仍無法顯示。');
});
// 繪圖晶片編譯陰影效果失敗時：自動關閉陰影再試，而不是整個空白
let shadowFallback = false;
renderer.debug.onShaderError = (gl, program, vs, fs) => {
  console.error('[著色器錯誤]', gl.getProgramInfoLog(program), gl.getShaderInfoLog(vs), gl.getShaderInfoLog(fs));
  if (!shadowFallback){ shadowFallback = true; renderer.shadowMap.enabled = false;
    scene.traverse(m => { if (m.material) [].concat(m.material).forEach(x => x.needsUpdate = true); }); }
};
let failed = false, first = true;
window.__stage = '第一次繪製';
renderer.setAnimationLoop(() => {
  if (failed) return;
  try {
    if (++frame % 12 === 0) updateLabels();
    if (ledTex) ledTex.offset.x = (performance.now() / 1000 * .12) % 1;   // 依時間捲動，幀率高低都等速
    if (!first) intro.tick(performance.now());   // 第一幀先把著色器編譯好，開場才開始計時，動畫不會一開始就卡
    if (fly){ fly.t = Math.min(1, fly.t + .035); const k = 1 - Math.pow(1 - fly.t, 3);
      controls.target.lerpVectors(fly.ft, fly.tt, k); camera.position.lerpVectors(fly.fp, fly.tp, k); if (fly.t >= 1) fly = null; }
    if (!intro.drive) controls.update();
    if (first) intro.prewarm();
    if (first || !intro.cover){ renderer.render(scene, camera); labelRenderer.render(scene, camera); }   // 開場線條／地圖蓋滿畫面時不畫 3D
    if (first){ first = false; const l = document.getElementById('load'); if (l) l.remove(); window.__stage = '完成';
      try { sessionStorage.setItem('campus3d-q', QL); } catch (er) {}
      document.querySelector('header').insertAdjacentHTML('beforeend', `<span style="background:var(--panel);padding:6px 10px;border-radius:8px;font-size:12px;color:var(--sub);pointer-events:auto">畫質：${QNAME[QL]}</span><button id="bIntro">▶ 開場動畫</button>`);
      document.getElementById('bIntro').onclick = () => intro.start();
      try { if (sessionStorage.getItem('campus3d-lost') === 'new'){ sessionStorage.setItem('campus3d-lost', 'shown');
        const n = document.createElement('div'); n.textContent = `手機繪圖記憶體不足，已自動降為「${QNAME[QL]}」畫質`;
        n.style.cssText = 'position:absolute;left:50%;top:64px;transform:translateX(-50%);z-index:20;background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:10px;font-size:14px;box-shadow:0 2px 10px rgba(0,0,0,.2);transition:opacity .6s;max-width:calc(100% - 32px);text-align:center';
        document.body.appendChild(n); setTimeout(() => { n.style.opacity = 0; setTimeout(() => n.remove(), 700); }, 5000); } } catch (er) {} }
  } catch (err){ failed = true; fail('繪圖錯誤：' + err.message); }
});
</script>
