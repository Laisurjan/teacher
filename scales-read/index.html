<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>一桿稱仔・讀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{--paper:#f3ead6;--paper2:#e8dcc0;--ink:#2b2118;--ink2:#6b5944;--red:#8e2b1f;--gold:#c9a24a;--ok:#3f6b3a;--bad:#a8382a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#d8d3c5;font-family:"Noto Serif TC",serif;font-weight:600;color:var(--ink);user-select:none;-webkit-user-select:none}
button{font:inherit;cursor:pointer}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 58%,rgba(45,28,12,.38))}
.hide{display:none!important}
mark{background:linear-gradient(transparent 55%,rgba(201,162,74,.6) 55%);color:inherit;padding:0 2px}
#hudL{position:fixed;left:16px;top:14px;background:rgba(32,24,18,.84);color:#f3e7cf;padding:9px 16px 9px 10px;border-radius:4px;display:flex;gap:12px;align-items:center;border:1px solid rgba(201,162,74,.55)}
#seal{width:46px;height:46px;border-radius:50%;background:var(--red);color:#f3e7cf;display:grid;place-items:center;font-size:22px;font-weight:900;border:2px solid var(--gold)}
#hudL small{font-size:12px;color:#c8b48a;display:block}
#hudL b{font-size:16px}
#hp{width:150px;height:8px;background:#4a3a2c;border-radius:4px;overflow:hidden;margin:5px 0 2px}
#hp i{display:block;height:100%;background:linear-gradient(90deg,#b43a28,#d9603c);width:100%;transition:width .4s}
#hpN{font-size:12px;color:#e8d9b8}
#hudR{position:fixed;right:16px;top:14px;background:rgba(32,24,18,.84);color:#f3e7cf;padding:10px 14px;border-radius:4px;border:1px solid rgba(201,162,74,.55);min-width:210px;max-width:320px}
#hudR small{color:var(--gold);font-size:12px;display:flex;align-items:center;gap:6px}
#hudR small:before{content:"";width:7px;height:7px;background:var(--gold);transform:rotate(45deg)}
#taskT{font-size:16px;margin-top:4px;display:flex;align-items:center;gap:10px}
#arrow{width:22px;height:22px;flex:none;transition:transform .1s}
#side{position:fixed;right:16px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px}
#side button{background:rgba(32,24,18,.8);color:#f3e7cf;border:1px solid rgba(201,162,74,.5);border-radius:4px;padding:8px 6px;font-size:13px;writing-mode:vertical-rl;letter-spacing:4px}
#fps{position:fixed;left:16px;bottom:10px;font:12px/1.3 monospace;color:#3b2f22;background:rgba(243,234,214,.75);padding:3px 6px;border-radius:3px}
#prompt{position:fixed;left:50%;bottom:16%;transform:translateX(-50%);background:var(--paper);border:2px solid var(--gold);color:var(--ink);padding:12px 26px;font-size:19px;border-radius:4px;box-shadow:0 6px 24px rgba(0,0,0,.3);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 6px 34px rgba(201,162,74,.9)}}
#dlg{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);width:min(900px,94vw);background:var(--paper);border:1px solid #b9a37a;outline:3px double rgba(142,43,31,.45);outline-offset:-8px;border-radius:3px;padding:20px 30px 26px;display:flex;gap:22px;align-items:flex-start;box-shadow:0 10px 40px rgba(0,0,0,.35);cursor:pointer;min-height:130px}
#dlgPic{width:96px;height:128px;object-fit:cover;border-radius:4px;border:1px solid #b9a37a;flex:none;background:#e8dcc0}
#dlgWho{font-size:15px;color:var(--red);font-weight:900;letter-spacing:2px}
#dlgNarr{font-size:17px;color:var(--ink2);line-height:1.75;margin:4px 0 2px}
#dlgNarr.big{font-size:21px;color:var(--ink)}
#dlgTxt{font-size:23px;line-height:1.75;margin:4px 0 0}
#dlgPost{font-size:17px;color:var(--ink2);line-height:1.75;margin:2px 0 0}
#crisis{margin-top:14px;padding:10px 14px;border:1px solid #b9a37a;background:#fbf6ea;font-size:16px;line-height:1.7}
#dlgNext{position:absolute;right:20px;bottom:8px;font-size:13px;color:var(--ink2);animation:blink 1.2s infinite}
#dlgSrc{position:absolute;left:30px;bottom:8px;font-size:12px;color:#a08e70}
@keyframes blink{50%{opacity:.3}}
#panel{position:fixed;inset:0;display:grid;place-items:center;background:rgba(20,14,8,.45);z-index:5}
#pBox{background:var(--paper);width:min(860px,94vw);max-height:92vh;overflow:auto;border-radius:4px;padding:26px 34px 24px;box-shadow:0 20px 60px rgba(0,0,0,.45);border:1px solid #b9a37a;position:relative}
#pBox .tag{display:inline-block;background:var(--red);color:#f3e7cf;font-size:13px;padding:3px 10px;border-radius:2px;letter-spacing:2px}
#pBox h3{font-size:22px;line-height:1.6;margin:12px 0 14px}
#pBox .src{background:var(--paper2);border-left:4px solid var(--gold);padding:10px 16px;font-size:18px;line-height:1.8;margin:0 0 14px}
#pBox p.note{font-size:17px;line-height:1.8}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:#fbf6ea;border:1px solid #b9a37a;border-radius:4px;padding:12px 14px;font-size:18px;text-align:left;color:var(--ink);line-height:1.5}
.opt:hover:not(:disabled){border-color:var(--red);background:#fff}
.opt.ok{background:#dfe9d4;border-color:var(--ok);color:var(--ok)}
.opt.bad{background:#f2d9d2;border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.opt.on{outline:3px solid var(--gold);background:#fff7df}
.opt:disabled{cursor:default}
.hint{min-height:28px;font-size:17px;line-height:1.7;margin:14px 0 0;color:var(--bad)}
.hint.ex{color:var(--ok)}
.hint.info{color:var(--ink2)}
.go{text-align:right;margin-top:10px;display:flex;gap:10px;justify-content:flex-end}
.btn{background:var(--red);color:#f3e7cf;border:1px solid var(--gold);border-radius:3px;padding:10px 26px;font-size:18px}
.btn.alt{background:#fbf6ea;color:var(--ink);border-color:#b9a37a}
#scv{width:100%;height:auto;display:block;background:linear-gradient(#efe4cb,#e6d8b9);border-radius:4px;touch-action:none;cursor:grab}
.pool{display:flex;flex-wrap:wrap;gap:10px;min-height:52px;padding:10px;border:1px dashed #b9a37a;border-radius:4px;margin-bottom:14px}
.chip{background:#fff;border:1px solid #b9a37a;border-radius:3px;padding:8px 16px;font-size:19px;color:var(--ink);text-align:left;line-height:1.45}
.chip.sel{outline:3px solid var(--gold);background:#fff7df}
.chip.bad{border-color:var(--bad);background:#f2d9d2}
.chip.ok{border-color:var(--ok);background:#dfe9d4}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bin{border:2px solid #b9a37a;border-radius:4px;padding:10px;min-height:150px;background:#fbf6ea;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;cursor:pointer}
.bin .who{width:100%;display:flex;align-items:center;gap:10px;font-size:18px;color:var(--red)}
.bin .who img{width:44px;height:58px;object-fit:cover;border-radius:3px}
.seq{display:flex;flex-direction:column;gap:8px;min-height:60px;padding:10px;border:2px solid #b9a37a;border-radius:4px;background:#fbf6ea;counter-reset:n}
.seq .chip{counter-increment:n;display:flex;gap:10px;align-items:flex-start}
.seq .chip:before{content:counter(n);flex:none;width:26px;height:26px;border-radius:50%;background:var(--red);color:#f3e7cf;display:grid;place-items:center;font-size:14px;margin-top:2px}
.seqEmpty{color:#a08e70;font-size:16px}
#title{position:fixed;inset:0;display:grid;place-items:center;z-index:8;background:radial-gradient(ellipse at center,rgba(243,234,214,.25),rgba(40,28,16,.35));overflow:auto;padding:16px}
#tBox{background:rgba(243,234,214,.95);padding:30px 44px 24px;text-align:center;border:1px solid #b9a37a;outline:3px double rgba(142,43,31,.4);outline-offset:-10px;box-shadow:0 20px 60px rgba(0,0,0,.35);max-width:720px;width:100%}
#tBox h1{font-size:60px;font-weight:900;margin:0;letter-spacing:6px;line-height:1.2}
#tBox .au{display:inline-block;background:var(--red);color:#f3e7cf;padding:3px 14px;font-size:16px;margin:10px 0 6px;letter-spacing:3px}
#tBox p{margin:6px 0;color:var(--ink2)}
#lvls{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0 6px}
.lv{background:#fbf6ea;border:1px solid #b9a37a;border-radius:4px;padding:14px 10px;text-align:center;color:var(--ink)}
.lv:hover{border-color:var(--red);background:#fff}
.lv b{display:block;font-size:20px;margin:4px 0}
.lv small{display:block;font-size:13px;color:var(--ink2)}
.lv .st{color:var(--gold);font-size:16px;letter-spacing:2px;margin-top:6px}
.lv .cont{font-size:12px;color:var(--red);margin-top:4px}
#tBox .cr{font-size:13px;margin-top:14px}
#joy{position:fixed;left:28px;bottom:28px;width:130px;height:130px;border-radius:50%;background:rgba(32,24,18,.35);border:2px solid rgba(243,234,214,.6);touch-action:none}
#knob{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:rgba(243,234,214,.85)}
#toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);background:rgba(32,24,18,.85);color:#f3e7cf;padding:10px 22px;border-radius:4px;font-size:17px;transition:opacity .4s;pointer-events:none}
#fade{position:fixed;inset:0;background:#1d150e;opacity:0;pointer-events:none;transition:opacity .6s;z-index:7}
@media (max-width:700px){.opts,.bins,#lvls{grid-template-columns:1fr}#tBox h1{font-size:42px}#dlgPic{width:64px;height:86px}#dlgTxt{font-size:19px}#dlgNarr.big{font-size:18px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="cv"></canvas>
<div id="vig"></div>
<div id="hudL" class="hide"><div id="seal">稱</div><div><small id="lvNo"></small><b id="lvName"></b><div id="hp"><i></i></div><span id="hpN">體力 100</span></div></div>
<div id="hudR" class="hide"><small>任務</small><div id="taskT"><svg id="arrow" viewBox="0 0 24 24"><path d="M12 2l7 18-7-4-7 4z" fill="#c9a24a"/></svg><span id="taskS"></span></div></div>
<div id="side" class="hide"><button id="bHelp">說明</button><button id="bRe">重來</button><button id="bHome">選關</button></div>
<div id="fps"></div>
<button id="prompt" class="hide"></button>
<div id="dlg" class="hide"><img id="dlgPic" alt=""><div style="flex:1"><div id="dlgWho"></div><div id="dlgNarr"></div><p id="dlgTxt"></p><div id="dlgPost"></div></div><span id="dlgNext">▼ 點一下或按空白鍵</span></div>
<div id="panel" class="hide"><div id="pBox"></div></div>
<div id="joy" class="hide"><div id="knob"></div></div>
<div id="toast" style="opacity:0"></div>
<div id="fade"></div>

<div id="title"><div id="tBox">
  <h1>一桿「稱仔」</h1>
  <div class="au">賴　和</div>
  <p>邊讀邊玩・第一人稱課文探索</p>
  <div id="lvls"></div>
  <p style="font-size:13px">課讀到哪一段，就玩到哪一關。每關過完自動存檔。</p>
  <p class="cr">花蓮高工 柯貞伊・花蓮高商 賴士鈞</p>
</div></div>

<script type="module">
import * as THREE from 'three';
import {mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';

const TXT={"1": "鎮南威麗村裡，住的人家，大都是勤儉、耐苦、平和、從順的農民。村中除了包辦官業的幾家勢豪，從事公職的幾家下級官吏，其餘都是窮苦的占多數。", "3": "村中，秦得參的一家，尤其是窮困的慘痛，當他生下的時候，他父親早就死了。他在世，雖曾贌得幾畝田地耕作，他死了後，只剩下可憐的妻兒。若能得到業主的恩恤，田地繼續租給他們，雇用工人替她們種作，猶可得稍少利頭，以維持生計。但是富家人，誰肯讓他們的利益，給人家享。若然就不能成其富戶了。所以業主多得幾斗租穀，就轉租給別人。他父親在世，汗血換來的錢，亦被他帶到地下去。他母子倆的生路，怕要絕望了。", "5": "鄰右看她母子倆的孤苦，多為之傷心，有些上了年紀的人，就替他們設法，因為餓死已經不是小事了。結局因鄰人的做媒，他母親就招贅一個夫婿進來。本來做後父的人，很少能體恤前夫的兒子。他後父，把他母親亦只視作一種機器，所以得參，不僅不能得到幸福，又多挨些打罵，他母親因此和後夫就不十分和睦。", "7": "幸他母親，耐勞苦、會打算，自己織草鞋、蓄雞鴨、養豚，辛辛苦苦，始能度那近於似人的生活。好容易，到得參九歲的那一年，他母就遣他，去替人家看牛，做長工。這時候，他後父已不大顧到家內，雖然他們母子倆，自己的勞力，經已可免凍餒的威脅。", "9": "得參十六歲的時候，他母親教他辭去了長工，回家裡來，想贌幾畝田耕作，可是這時候，贌田就不容易了。因為製糖會社，糖的利益大，雖農民們受過會社刻虧、剝奪，不願意種蔗，會社就加上租聲向業主爭贌，業主們若自己有利益，那管到農民的痛苦，田地就多被會社贌去了。有幾家說是有良心的業主，肯贌給農民，亦要同會社一樣的租聲，得參就租不到田地。若做會社的勞工呢，有同牛馬一樣，他母親又不肯，只在家裡，等著做些散工。因他的氣力大，做事勤敏，就每天有人喚他工作，比較他做長工的時候，勞力輕省，得錢又多。又得他母親的刻儉，漸積下些錢來。光陰似矢，容易地又過了三年。到得參十八歲的時候，他母親唯一未了的心事，就是為得參娶妻。經她艱難勤苦積下的錢，已夠娶妻之用，就在村中，娶了一個種田的女兒。幸得過門以後，和得參還協力，到田裡工作，不讓一個男人。又值年成好，他一家的生計，暫不覺得困難。", "11": "得參的母親，在他二十一歲那年，得了一個男孫子，以後臉上已見時現著笑容，可是亦已衰老了。她心裡的欣慰，使她責任心亦漸放下，因為做母親的義務，經已克盡了。但二十年來的勞苦，使她有限的肉體，再不能支持。亦因責任觀念已弛，精神失了緊張，病魔遂乘虛侵入，病臥幾天，她面上現著十分滿足、快樂的樣子歸到天國去了。這時得參的後父，和他只存了名義上的關係，況他母已死，就各不相干了。", "13": "可憐的得參，他的幸福，已和他慈愛的母親，一併失去。", "15": "翌年，他又生下一女孩子。家裡頭因失去了母親，須他妻子自己照管，並且有了兒子的拖累，不能和他出外工作，進款就減少一半，所以得參自己不能不加倍工作，這樣辛苦著，過有四年，他的身體，就因過勞，伏下病根。在早季收穫的時候，他患著瘧疾，病了四、五天，才診過一次西醫，花去兩塊多錢，雖則輕快些，腳手尚覺乏力，在這煩忙的時候，而又是勤勉的得參，就不敢閒著在家裡，亦即耐苦到田裡去。到晚上回家，就覺得有點不好過，睡到夜半，寒熱再發起來，翌天已不能離床，這回他不敢再請西醫診治了。他心裡想，三天的工作，還不夠吃一服藥，那得那麼些錢花？但亦不能放他病著，就煎些不用錢的青草，或不多花錢的漢藥服食。雖未全都無效，總隔兩三天，發一回寒熱，經過有好幾個月，纔不再發作。但腹已很脹滿。有人說，他是吃過多的青草致來的，有人說，那就叫脾腫，是吃過西藥所致。在得參總不介意，只礙不能工作，是他最煩惱的所在。", "17": "當得參病的時候，他妻子不能不出門去工作，只有讓孩子們在家裡啼哭，和得參呻吟聲相和著。一天或兩餐或一餐，雖不至餓死，一家人多陷入營養不良，猶其是孩子們，猶幸他妻子不再生育。……", "19": "一直到年末。得參自己，才能做些輕的工作，看看尾衙到了，尚找不到相應的工作，若一至新春，萬事停辦了，更沒有做工的機會，所以須積蓄些新春半個月的食糧，得參的心裡，因此就分外煩惱而恐惶了。", "21": "末了，聽說鎮上生菜的販路很好。他就想做這項生意，無奈缺少本錢，又因心地坦白，不敢向人家告借，沒有法子，只得教他妻到外家走一遭。", "23": "一個小農民的妻子，那有闊的外家，得不到多大幫助，本是應該情理中的事，總難得她嫂子，待她還好，把她唯一的裝飾品──一根金花──借給她，教她去當舖裡，押幾塊錢。暫作資本，這法子，在她當得帶了幾分危險，其外又別無法子，只得從權了。", "25": "一天早上，得參買一擔生菜回來，想吃過早飯，就到鎮上去，這時候，他妻子纔覺到缺少一桿稱仔。「怎麼好？」得參想，「要買一桿，可是官廳的專利品，不是便宜的東西，那兒來得錢？」她妻子趕快到隔鄰去借一桿回來，幸鄰家的好意，把一桿尚覺新新的借來。因為巡警們，專在搜索小民的細故，來做他們的成績，犯罪的事件，發見得多，他們的高昇就快。所以無中生有的事故，含冤莫訴的人們，向來是不勝枚舉。什麼通行取締、道路規則、飲食物規則、行旅法規、度量衡規紀，舉凡日常生活中的一舉一動，通在法的干涉、取締範圍中。──她妻子為慮萬一，就把新的稱仔借來。", "27": "這一天的生意，總算不壞，到市散，亦賺到一塊多錢，他就先糴(ㄉㄧˊ)些米，預備新春的糧食。過了幾天糧食足了，他就想，「今年家運太壞，明年家裡，總要換一換氣像纔好，第一廳上奉祀的觀音畫像，要買新的，同時門聯亦要換，不可缺的金銀紙，香燭、亦要買。」再過幾天，生意屢好，他又想炊一灶年糕，就把糖米買回來。他妻子就忍不住，勸他說：「剩下的錢積積下，待贖取那金花，不是更要緊嗎？」得參回答說：「是，我亦不是把這事忘卻，不過今天才廿五，那筆錢不怕賺不來，就賺不來，本錢亦還在。當舖裡遲早，總要一個月的利息。」", "29": "一晚市散，要回家的時候，他又想到孩子們。新年不能有件新衣裳給他們，做父親的義務，有點不克盡的缺憾，雖不能使孩子們享到幸福，亦須給他們一點喜歡。他就剪了幾尺花布回去。把幾日來的利益，一總花掉。", "31": "這一天近午，一下級巡警，巡視到他擔前，目光注視到他擔上的生菜，他就殷勤地問：", "33": "「大人，要什麼不要？」", "34": "「汝的貨色比較新鮮。」巡警說。", "35": "得參接著又說：", "36": "「是，城市的人，總比鄉下人享用，不是上等東西，是不合脾胃。」", "37": "「花菜賣多少錢？」巡警問。", "38": "「大人要的，不用問價，肯要我的東西，就算運氣好。」參說。他就擇幾莖好的，用稻草貫著，恭敬地獻給他。", "39": "「不，稱稱看！」巡警幾番推辭著說。誠實的參，亦就掛上稱仔稱一稱，說：", "40": "「大人，真客氣啦！才一斤十四兩。」本來，經過秤稱過，就算買賣，就是有錢的交關，不是白要，亦不能說是贈與。", "41": "「不錯罷？」巡警說。", "42": "「不錯，本有兩斤足，因是大人要的…… 」參說。這句話是平常買賣的口吻，不是贈送的表示。", "43": "「稱仔不好罷，兩斤就兩斤，何須打扣？」巡警變色地說。", "44": "「不，還新新呢！」參泰然地回答。", "45": "「拿過來！」巡警赫怒了。", "46": "「稱花還很明瞭。」參從容地捧過去說。巡警接在手裡，約略考察一下說：", "47": "「不堪用了，拿到警署去！」", "48": "「什麼緣故？修理不可嗎？」參說。", "49": "「不去嗎？」巡警怒叱著。「不去？畜生！」撲的一聲，巡警把稱仔打斷擲棄，隨抽出胸前的小帳子，把參的名姓、住處，記下。氣憤憤地，回警署去。", "51": "參突遭這意外的羞辱，空抱著滿腹的憤恨，在擔邊失神地站著。等巡警去遠了，纔有幾個閑人，近他身邊來。一個較有年紀的說：「該死的東西，到市上來，只這規紀亦就不懂？要做什麼生意？汝說幾斤幾兩，難道他的錢汝敢拿嗎？」", "52": "「難道我們的東西，該白送給他的嗎？」參不平地回答。", "53": "「唉！汝不曉得他的厲害，汝還未嘗到他，青草膏的滋味。」那有年紀的嘲笑地說。", "54": "「什麼？做官的就可任意凌辱人民嗎？」參說。", "55": "「硬漢！」有人說。眾人議論一回、批評一回，亦就散去。", "57": "得參回到家裡，夜飯前吃不下，只悶悶地一句話不說。經他妻子殷勤的探問，才把白天所遭的事告訴給她。", "59": "「寬心罷！」妻子說，「這幾天的所得，買一桿新的還給人家，剩下的猶足贖取那金花回來。休息罷，明天亦不用出去，新春要的物件，大概準備下，但是，今年運氣太壞，怕運裡帶有官符，經這一回事，明年快就出運，亦不一定。」", "61": "參休息過一天，看看沒有什麼動靜，況明天就是除夕日，只剩得一天的生意，他就安坐不來，絕早挑上菜擔，到鎮上去。此時，天色還未大亮，在曉景朦朧中，市上人聲，早就沸騰，使人愈感到「年華垂盡，人生頃刻」的悵惘。", "63": "到天亮後，各擔各色貨，多要完了，有的人，已收起擔頭，要回去圍爐，過那團圓的除夕，償一償終年的勞苦，享受著家庭的快樂。當這時參又遇到那巡警。", "65": "「畜生，昨天跑那兒去？」巡警說。", "66": "「什麼？怎得隨便罵人？」參回說。", "67": "「畜生，到衙門去！」巡警說。", "68": "「去就去呢，什麼畜生？」參說。", "69": "巡警瞪他一眼便帶他上衙門去。", "70": "「汝秦得參嗎？」法官在座上問。", "71": "「是，小人，是。」參跪在地上回答說。", "72": "「汝曾犯過罪嗎？」法官。", "73": "「小人生來將三十歲了，曾未犯過一次法。」參。", "74": "「以前不管他，這回違犯著度量衡規則。」法官。", "75": "「唉！冤枉啊！」參。", "76": "「什麼？沒有這樣事嗎？」法官。", "77": "「這事是冤枉的啊！」參。", "78": "「但是，巡警的報告，總沒有錯啊！」法官。", "79": "「實在冤枉啊！」參。", "80": "「既然違犯了，總不能輕恕，只科罰汝三塊錢，就算是格外恩典。」官。", "81": "「可是，沒有錢，」參。", "82": "「沒有錢，就坐監三天，有沒有？」官。", "83": "「沒有錢！」參說，在他心裡的打算：新春的閒時節，監禁三天，是不關係什麼，還是三塊錢的用處大，所以他就甘心去受監禁。", "85": "參的妻子，本想洗完了衣裳，纔到當舖裡去，贖取那根金花。還未曾出門，已聽到這凶消息，她想：在這時候，有誰可央托，有誰能為她奔走？愈想愈沒有法子，愈覺傷心，只有哭的一法，可以少舒心裡的痛苦，所以，只守在家裡哭。後經鄰右的勸慰、教導，才帶著金花的價錢，到衙門去，想探探消息。", "87": "鄉下人，一見巡警的面，就怕到五分，況是進衙門裡去，又是不見世面的婦人，心裡的驚恐，就可想而知了。她剛跨進郡衙的門跟，被一巡警的「要做什麼」的一聲呼喝，已嚇得倒退到門外去，幸有一十四來歲的小使，出來查問，她就哀求他，替伊探查，難得那孩子，童心還在，不會倚勢欺人，誠懇地，替伊設法，教她拿出三塊錢，代繳進去。", "89": "「才監禁下，什麼就釋出來？」參心裡，正在懷疑地自問。出來到衙前，看著她妻子。", "90": "「為什麼到這兒來？」參對著妻子問。", "91": "「聽……說被拉進去！」她微咽著聲回答。", "92": "「不犯到什麼事，不至殺頭怕什麼。」參怏怏地說。", "93": "他們來到街上，市已經散了，處處聽到『辭年』的爆竹聲。", "94": "「金花取回未？」參問她妻子。", "95": "「還未曾出門，就聽到這消息，我趕緊到衙門去，在那兒繳去三塊，現在還不夠。」妻子回答他說。", "96": "「唔！」參恍然地發出這一聲就拿出早上賺到的三塊錢，給他妻子說：", "97": "「我挑擔子回去，當舖怕要關閉了，快一點去，取出就回來罷。」", "99": "圍過爐，孩子們因明早要絕早起來開正各已睡下，在作他們幸福的夢。參尚在室內踱來蹀去。經他妻子幾次的催促，他總沒有聽見似的，心裡只在想，總覺有一種，不明瞭的悲哀，只不住漏出幾聲的嘆息，「人不像個人，畜生，誰願意做。這是什麼世間？活著倒不若死了快樂。」他喃喃地獨語著，忽又回憶到他母親死時，快樂的容貌。他已懷抱著最後的覺悟。", "101": "元旦，參的家裡，忽譁然發生一陣叫喊、哀嗚、啼哭。隨後，又聽著說：「什麼都沒有嗎？」「只銀紙備辦在，別的什麼都沒有。」", "103": "同時，市上亦盛傳著，一個夜巡的警吏，被殺在道上。", "106": "【後記】", "107": "這一幕悲劇，看過好久，每欲描寫出來，但一經回憶，總被悲哀填滿了腦袋，不能著筆。近日看到法朗士的克拉格比，才覺這樣事，不一定在未開的國裡，凡強權行使的地上，總會發生，遂不顧文字的陋劣，就寫出和文家批判。", "109": "作於一九二五年十二月四日夜 原載於《台灣民報》九十二、九十三號", "110": "一九二六年二月十四日、二十一日"};

// ===== 聲音 =====
function snd(n,v=1,loop=false){try{const a=new Audio('../scales/audio/'+n+'.mp3');a.volume=v;a.loop=loop;a.play().catch(()=>{});return a}catch(e){}}
let amb=null,ambName=null,mus=null;
function fadeOut(a){if(!a)return;let t=a.volume;const iv=setInterval(()=>{t-=.03;if(t<=0){a.pause();clearInterval(iv)}else a.volume=t},60)}
function music(n,v=.3){fadeOut(mus);mus=n?snd(n,v,true):null}
function ambience(n){if(ambName===n)return;fadeOut(amb);ambName=n;amb=n?snd(n,.35,true):null}

const store=d=>{try{localStorage.setItem(SAVE,JSON.stringify(d))}catch(e){}};
function save(){const d=load();d.cur=d.cur||{};d.cur[LVL.id]={step,hp};store(d)}
function setHP(v){hp=clamp(v,0,100);$('#hp i').style.width=hp+'%';$('#hpN').textContent='體力 '+hp}
function toast(t){const e=$('#toast');e.textContent=t;e.style.opacity=1;clearTimeout(e._t);e._t=setTimeout(()=>e.style.opacity=0,1800)}
function hurt(){setHP(hp-10);snd('slap',.4);if(hp<=0)setTimeout(()=>{openPanel(`<span class=tag>體力耗盡</span><h3>這一關要重來一次。</h3><p class=note>回到課文再讀一遍，答案都在裡面。</p><div class=go><button class=btn id=rr>重來</button></div>`);$('#rr').onclick=()=>begin(LVL,0,100)},600)}

function getWorld(k){if(!WORLDS[k]){const w=BUILD[k]();WORLDS[k]=w;w.root.visible=false;S.add(w.root)}return WORLDS[k]}
function useWorld(k){for(const w of Object.values(WORLDS))w.root.visible=false;W=getWorld(k);W.root.visible=true}

async function applyScene(s,fast){const f=$('#fade');if(!fast){f.style.opacity=1;await wait(450)}
 useWorld(s.world);setLight(s.light);W.base&&W.base();s.setup&&s.setup(W);const st=s.start||W.start;PL.x=st.x;PL.z=st.z;PL.yaw=st.yaw||0;PL.pitch=-.03;
 if(s.world==='dark'){ambience(null);music(null)}else ambience(W.amb);
 if(!fast){await wait(150);f.style.opacity=0}}

function runStep(){
 const s=STEPS[step];if(!s)return;
 if(['goto','quiz','scale','sort','order','multi','scene'].includes(s.type))save();
 if(s.type==='goto'){
  if(mode!=='free'&&mode!=='title'){PL.x=cam.position.x;PL.z=cam.position.z;const d=cam.getWorldDirection(V3());PL.yaw=Math.atan2(-d.x,-d.z);PL.pitch=clamp(Math.asin(d.y),-.5,.3)}
  mode='free';curGoto=s;target={pos:s.at,objs:s.objs};$('#taskS').textContent=s.task;$('#prompt').textContent='▶ '+s.prompt;MARK.visible=true;if(LVL.music)music(LVL.music,.25);else music(null);if(amb)amb.volume=.35;return}
 MARK.visible=false;target=null;$('#prompt').classList.add('hide');
 if(s.type==='say')return showSay(s);

 if(s.type==='end')return finish(s);
 if(s.type==='scene'){mode='scene';applyScene(s,false).then(()=>{s.after&&s.after(W);next()});return}
}
