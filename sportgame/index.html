<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>趣味進場示意</title>
<style>
:root{--bg:#111418;--fg:#f1f3f5;--mut:#adb5bd;--acc:#ffd43b;--btn:#2b3036}
*{box-sizing:border-box}
html,body{position:fixed;inset:0;overflow:hidden}   /* 整頁不捲動，依視窗縮放 */
body{margin:0;background:var(--bg);color:var(--fg);font:600 16px/1.5 "Microsoft JhengHei","Noto Sans TC",sans-serif}
#wrap{height:100%;display:flex;flex-direction:column;padding:10px 16px;gap:8px}
#stage{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
canvas{max-width:100%;max-height:100%;width:auto;height:auto;display:block;border-radius:8px;background:#000;touch-action:manipulation}
#ctl{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
button,select{font:inherit;color:var(--fg);background:var(--btn);border:1px solid #495057;border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
#bar{flex:1 1 260px;accent-color:var(--acc)}
#tm{font-variant-numeric:tabular-nums;min-width:96px;text-align:center}
#names{display:none;position:fixed;left:50%;bottom:70px;transform:translateX(-50%);width:min(920px,calc(100% - 32px));max-height:calc(100% - 100px);overflow:auto;background:#1b1f24;border:1px solid #495057;border-radius:10px;padding:12px;box-shadow:0 8px 30px rgba(0,0,0,.6);z-index:5}
#names.on{display:block}
#names .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
#names label{display:flex;gap:6px;align-items:center}
#names small{color:var(--mut);font-size:13px;margin-left:2px}
#names input.boy{flex:none;width:18px;height:18px;margin:0 0 0 4px;accent-color:#1971c2}
#names input{flex:1;min-width:0;font:inherit;padding:4px 6px;border-radius:4px;border:1px solid #495057;background:#0d0f12;color:var(--fg)}
#names p{color:var(--mut);margin:6px 0 10px;font-size:14px}
#editp{display:none;position:fixed;right:16px;bottom:70px;width:min(460px,calc(100% - 32px));background:#1b1f24;border:1px solid #495057;border-radius:10px;padding:12px;box-shadow:0 8px 30px rgba(0,0,0,.6);z-index:6}
#editp.on{display:block}
#editp p{color:var(--mut);margin:8px 0;font-size:14px}
#editp .seg,#editp .btns{display:flex;flex-wrap:wrap;gap:6px}
#editp .seg button.cur{background:#ffd43b;color:#212529;border-color:#ffd43b}
#emsg{color:var(--acc)!important}
body.render #ctl,body.render #names,body.render #editp{display:none}
body.render #wrap{padding:0}
body.render canvas{border-radius:0}
</style>
</head>
<body>
<div id="wrap">
<div id="stage"><canvas id="cv" width="1920" height="1080"></canvas></div>
<div id="ctl">
  <button id="play">▶ 播放</button>
  <button id="prev" title="上一步">⏮</button>
  <button id="next" title="下一步">⏭</button>
  <input id="bar" type="range" min="0" max="118" step="0.05" value="0">
  <span id="tm">0:00</span>
  <select id="spd" title="速度"><option value="1">1 倍速</option><option value="0.75">0.75 倍速</option><option value="0.5">0.5 倍速</option></select>
  <select id="me" title="看自己的位置"><option value="-1">看自己的位置…</option></select>
  <button id="mute" title="只關口令聲，音樂照常（鍵盤 M）">🔊 口令聲：開</button>
  <button id="ebtn">✏️ 調整隊形</button>
  <button id="nbtn">名單</button>
</div>
<div id="names">
  <p>依座號填入名字、勾選男生後按「儲存」（男生在大橢圓會排到前排），只存在這台裝置的瀏覽器，不會上傳。要做成有名字的 MP4，請把同樣的名單照順序（班牌、班旗、導師、口號，再依座號 1、3、4、8、9…13、15、16）一行一個存成 names.txt 再跑 build.py。</p>
  <div class="g" id="ng"></div>
  <div style="margin-top:10px;display:flex;gap:8px"><button id="nsave">儲存</button><button id="nclear">清除</button><button id="nclose">關閉</button></div>
</div>
</div>
<div id="editp">
  <div class="seg"><button data-f="col">起始隊形</button><button data-f="A">兩個小圓</button><button data-f="B">大橢圓</button></div>
  <p>直接拖曳畫面上的圓圈。改動自動存在這台裝置；要讓學生打開也是這個樣子，請按「下載設定檔」並把檔案交給 Claude。紅圈＝超出跑道、橘圈＝兩人靠太近。</p>
  <div class="btns"><button id="ereset">這個隊形恢復自動排</button><button id="edl">下載設定檔</button><button id="eload">載入設定檔</button><button id="edone">完成</button></div>
  <input type="file" id="efile" accept=".json,application/json" hidden>
  <p id="emsg"></p>
</div>
<video id="dv" src="assets/dance.mp4" muted playsinline preload="auto" style="display:none"></video>
<audio id="au" src="assets/music.m4a" preload="auto"></audio>   <!-- 音樂軌（主時鐘） -->
<audio id="vo" src="assets/voice.m4a" preload="auto"></audio>   <!-- 口令軌（可靜音） -->
<script>
"use strict";
/* ============ 時間軸（唯一來源；build.py 讀這裡產生語音與 MP4） ============ */
const B = 0.5;                 // 一拍 0.5 秒（每分鐘 120 步）
const T = {
  mark1: 5.0,                  // 開始原地踏步
  go1: 18.5, stop1: 46.0,      // 起步走 → 立定（動令「定」45.0 左腳，46.0 停下＝全班對準司令台中央）
  rtHead: 33.0, ftHead: 43.0,  // 向右看（班牌到右側標兵）／向前看（立定前兩步）
  turnR: 48.6,                 // 向右轉
  spread: [52.8, 57.2],          // 散開：往回跑到司令台正前方的兩個小圓
  m1: 58.0,                    // 音樂開始（原影片 0 秒）
  gap: [58.0 + 14.833, 58.0 + 17.667],  // 原影片黑畫面＝跑位成大圓
  mEnd: 58.0 + 28.033,         // 音樂結束
  gather: [90, 94.5],            // 回原隊形
  turnL: 96.1,                 // 向左轉
  mark2: 99.5,                 // 撤場踏步節奏起點（＝起步走動令）
  go2: 100.0,                  // 起步走離場（照試錄：向左轉後直接起步走）
  end: 113
};
// 拍子：原地踏步時、行進中都數（行進中「一」踩在左腳＝整數秒）
const COUNT_BLOCKS = [{t: T.mark1, reps: 3}, {t: 19.0, reps: 3, march: true}, {t: 34.0, reps: 2, march: true}, {t: 100.5, reps: 2, march: true, exit: true}];
const COUNT_OFF = [0, 1.0, 2.0, 2.5, 3.0];      // 一(左)．一(左)．一(左)二(右)一(左)．（8 拍）
const COUNT_SAY = ["一", "一", "一", "二", "一"];
const COUNT_SHOW = ["1", "1", "1", "2", "1"];

// 畫面上的步驟（say＝口號同學要喊的話，會產生語音）
// 口令＝預令(pre)＋動令(exe)：預令拉長、停頓、動令短促有力；行進間動令落在左腳（整數秒）
// t＝預令開始（畫面切換）；x＝動令時間
const STEPS = [
  {t: 0,      no: "①", title: "集合隊形",         desc: "班牌→班旗→導師→口號 站跑道中線；同學分兩排站第 3、4 道"},
  {t: 2.6,    x: 4.5,  no: "①", title: "原地踏步——走",  pre: "原地踏步", exe: "走", desc: "全體原地踏步，左腳先"},
  {t: T.mark1,no: "①", title: "1 1 121 ×3",       desc: "口號同學喊拍子，「一」都踩在左腳", count: 0},
  {t: 16.6,   x: 18.0, no: "①", title: "起步——走",      pre: "起步", exe: "走", desc: "動令落左腳，沿跑道向右前進"},
  {t: 31.6,   x: 33.0, no: "①", title: "向右——看",      pre: "向右", exe: "看", desc: "班牌到右側標兵：頭轉向司令台，旗牌轉向司令台；繼續數拍子"},
  {t: 41.5,   x: 43.0, no: "①", title: "向前——看",      pre: "向前", exe: "看", desc: "全班快到司令台中央：頭轉回正前方，旗牌復位"},
  {t: 44.0,   x: 45.0, no: "①", title: "立——定",        pre: "立", exe: "定", desc: "動令落左腳，再兩步停下：全班中間對準司令台中央"},
  {t: 47.2,   x: 48.6, no: "①", title: "向右——轉",      pre: "向右", exe: "轉", desc: "全體轉身，面向司令台"},
  {t: 50.0,   x: 52.4, no: "①", title: "呈表演隊形，散開", pre: "呈表演隊形", exe: "散開", desc: "跑到自己在小圓的位置；班旗、班牌放跑道外側"},
  {t: T.m1,   no: "②", title: "表演①：兩個小圓",   desc: "左圓 8 人、右圓 7 人，跟著音樂跳", perf: 1},
  {t: T.gap[0],no:"②", title: "跑位：圍成大橢圓",   desc: "音樂空檔，跑到大橢圓的位置（不進草地）", perf: 2},
  {t: T.gap[1],no:"②", title: "表演②：一個大橢圓", desc: "15 人在跑道上圍成大橢圓，導師在最前面正中間", perf: 3},
  {t: 87.2,   x: 89.5, no: "③", title: "呈原來隊形，集合", pre: "呈原來隊形", exe: "集合", desc: "回到進場時的位置，拿回班旗、班牌"},
  {t: 94.7,   x: 96.1, no: "③", title: "向左——轉",      pre: "向左", exe: "轉", desc: "全體轉回前進方向"},
  {t: 98.3,   x: 99.5,  no: "③", title: "起步——走",     pre: "起步", exe: "走", desc: "向右走離司令台，邊走邊數拍子"},
  {t: 108.5,  no: "③", title: "離場完成",           desc: ""}
];
const PHASE = {"①": "進場", "②": "表演", "③": "撤場"};

// 語音提示清單（給 build.py）
const CUES = [];
STEPS.forEach(s => { if (s.pre) { CUES.push({t: s.t, say: s.pre, kind: "pre", until: s.x}); CUES.push({t: s.x, say: s.exe, kind: "exe"}); } });
COUNT_BLOCKS.forEach(b => { for (let r = 0; r < b.reps; r++) COUNT_OFF.forEach((o, k) => CUES.push({t: b.t + r * 4 + o, say: COUNT_SAY[k], kind: "count"})); });
CUES.sort((a, b) => a.t - b.t);

/* ============ 場地（公尺；x 向東＝前進方向，y 向南＝司令台方向） ============ */
const LW = 1.22, LANES = 6, CL = 3 * LW;          // 中線＝第 3、4 道交界
// 行進速度 1.55 m/s（每分鐘 120 步）。向前看動令 38.0 秒時班牌到左側標兵＝全班中間過司令台中間
// 標兵（照片量測）：右側標兵在司令台中線西 13 m（跑道開始轉彎處），左側標兵在東 16 m
const MARK_R = -13, MARK_L = 16;
// 班牌 33.0 秒到右側標兵；46.0 秒停下時班牌在中線東 5.4 m（隊伍長 10.8 m 的一半）＝全班中間對準司令台中央
const XS = 5.4, V_MARCH = (XS - MARK_R) / 12.5, X0 = MARK_R - V_MARCH * 14.25;
const STAGE = {x0: -6.5, x1: 6.5, y0: 9.6, y1: 14.5};   // 司令台寬約 13 m（照片量測）
const MARKERS = [{x: MARK_R, y: LANES * LW + 0.7, label: "右側標兵"}, {x: MARK_L, y: LANES * LW + 0.7, label: "左側標兵"}];   // 以司令台的左右命名

/* ============ 人員（14 位同學＋導師） ============ */
const PEOPLE = [];
// 座號：班牌 2 號、班旗 6 號、口號 5 號；導師沒有座號
const ROLE_SEAT = {牌: 2, 旗: 6, 令: 5};
[["牌", "班牌", "#e8590c"], ["旗", "班旗", "#e03131"], ["師", "導師", "#7048e8"], ["令", "口號", "#2b8a3e"]]
  .forEach((r, i) => PEOPLE.push({mark: r[0], label: r[1], color: r[2], seat: ROLE_SEAT[r[0]] || 0, dx: -i * 1.2, y: CL}));
// 其他同學依座號由前往後排兩排：第 1、3、5…個在北側（第 3 道），第 2、4…個在南側（第 4 道）
const WITHDRAWN = [7, 14];   // 休學
const OTHER_SEATS = [...Array(16)].map((_, k) => k + 1).filter(n => !Object.values(ROLE_SEAT).includes(n) && !WITHDRAWN.includes(n));   // 1,3,4,8,9,10,11,12,13,15,16
OTHER_SEATS.forEach((seat, k) => {
  const row = Math.floor(k / 2), north = k % 2 === 0;
  PEOPLE.push({mark: String(seat), label: seat + "號", color: "#1971c2", seat, dx: -4.8 - row * 1.2, y: north ? CL - LW / 2 : CL + LW / 2});
});
const N = PEOPLE.length;
let NAMES = Array(N).fill("");

/* ============ 隊形 ============ */
const colAt = (i, L) => ({x: L + PEOPLE[i].dx, y: PEOPLE[i].y});
let COL_S = PEOPLE.map((_, i) => colAt(i, XS));
function ring(cx, cy, rx, n, ry = rx, a0 = -Math.PI / 2) {   // 沿周長等距放 n 人（橢圓也等距）；第 0 點在角度 a0
  const M = 720, pts = [], len = [0];
  for (let k = 0; k <= M; k++) { const a = a0 + k * 2 * Math.PI / M; pts.push({x: cx + rx * Math.cos(a), y: cy + ry * Math.sin(a)});
    if (k) len.push(len[k - 1] + Math.hypot(pts[k].x - pts[k - 1].x, pts[k].y - pts[k - 1].y)); }
  const L = len[M], out = []; let j = 0;
  for (let i = 0; i < n; i++) { const want = i * L / n; while (len[j + 1] < want) j++; out.push(pts[j]); }
  return out;
}
function assign(from, to, fixed = {}) {      // 交換法求最短總移動距離，減少交叉；fixed＝{人: 指定位置}
  const taken = new Set(Object.values(fixed)), free = to.map((_, j) => j).filter(j => !taken.has(j));
  const p = from.map((_, i) => i in fixed ? fixed[i] : free.shift()), d = (i, j) => (from[i].x - to[j].x) ** 2 + (from[i].y - to[j].y) ** 2;
  for (let again = true; again;) { again = false;
    for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) if (!(i in fixed) && !(j in fixed))
      if (d(i, p[j]) + d(j, p[i]) < d(i, p[i]) + d(j, p[j]) - 1e-9) { [p[i], p[j]] = [p[j], p[i]]; again = true; } }
  return from.map((_, i) => to[p[i]]);
}
const CY_PERF = CL;   // 表演隊形以跑道中線為中心，全部在跑道內（不進草地）
// 老師拖曳調整過的隊形（null＝自動排）。col：起始隊形（相對班牌的 dx、y）；A：兩個小圓；B：大橢圓
// 老師 115/11/04 調好的隊形（下載設定檔「趣味進場_隊形設定.json」）；改了再下載新的設定檔交給 Claude 替換
const LAYOUT_DEFAULT = {"version":1,"col":{"班牌":{"dx":0,"y":3.66},"班旗":{"dx":-1.2,"y":3.66},"導師":{"dx":-2.4,"y":3.66},"口號":{"dx":-3.6,"y":3.66},"1號":{"dx":-4.8,"y":3.05},"3號":{"dx":-4.8,"y":4.27},"4號":{"dx":-6.02,"y":4.3},"8號":{"dx":-6.02,"y":3.1},"9號":{"dx":-7.2,"y":3.05},"10號":{"dx":-7.2,"y":4.27},"11號":{"dx":-8.4,"y":3.05},"12號":{"dx":-8.4,"y":4.27},"13號":{"dx":-9.6,"y":3.05},"15號":{"dx":-9.6,"y":4.27},"16號":{"dx":-10.8,"y":3.05}},"B":{"班牌":{"x":3.71,"y":6.14},"班旗":{"x":2,"y":6.7},"導師":{"x":0,"y":6.82},"口號":{"x":5.3,"y":5.5},"1號":{"x":-2.2,"y":6.8},"3號":{"x":5.97,"y":3.33},"4號":{"x":4.79,"y":1.76},"8號":{"x":-3.9,"y":6.2},"9號":{"x":-5.32,"y":5.12},"10號":{"x":1.02,"y":0.55},"11號":{"x":2.98,"y":0.92},"12號":{"x":-5.96,"y":3.32},"13號":{"x":-0.99,"y":0.54},"15號":{"x":-4.78,"y":1.75},"16號":{"x":-2.95,"y":0.91}}};
let LAYOUT = {col: null, A: null, B: null};
const BASE_COL = PEOPLE.map(P => ({dx: P.dx, y: P.y}));
let FORM_A = assign(COL_S, ring(-3.7, CY_PERF, 2.15, 8).concat(ring(3.7, CY_PERF, 1.95, 7)));
// 大圓→橢圓：上下各離跑道邊緣 0.5 公尺（人的圓心），左右拉長維持約 2 公尺間距
// 大橢圓：導師（第 2 號）固定在最前面正中間＝最靠司令台那一點；
// 班牌(0)、班旗(1)、口號(3)、男生 站前排（離司令台最近的位置），其他人站後排
// 男生（座號）。「名單」可改，改過的存在該裝置
const BOY_SEATS = [1, 2, 5, 6, 8, 9];   // 2、5、6 號是班牌、口號、班旗（本來就站前排）
const DEFAULT_BOYS = PEOPLE.map((P, i) => i).filter(i => i >= 4 && BOY_SEATS.includes(PEOPLE[i].seat));
let BOYS = new Set(DEFAULT_BOYS);
function matchGroup(ppl, slots, from, pts) {   // 小組內用交換法求最短移動距離
  const s = slots.slice();
  const c = (a, b) => (from[a].x - pts[b].x) ** 2 + (from[a].y - pts[b].y) ** 2;
  for (let again = true; again;) { again = false;
    for (let i = 0; i < ppl.length; i++) for (let j = i + 1; j < ppl.length; j++)
      if (c(ppl[i], s[j]) + c(ppl[j], s[i]) < c(ppl[i], s[i]) + c(ppl[j], s[j]) - 1e-9) { [s[i], s[j]] = [s[j], s[i]]; again = true; } }
  const m = {}; ppl.forEach((q, i) => m[q] = s[i]); return m;
}
let FORM_B, FRONT_N = 0, FRONT_GAP = 0;
function buildFormB() {
  // 橢圓周長取樣：s＝從最靠司令台的正中間（導師）沿周長量的距離，正＝往東（畫面右）、負＝往西
  const RX = 6.0, RY = CL - 0.5, M = 1440, cum = [0], P0 = [];
  for (let k = 0; k <= M; k++) { const a = Math.PI / 2 - k * 2 * Math.PI / M; P0.push({x: RX * Math.cos(a), y: CY_PERF + RY * Math.sin(a)});
    if (k) cum.push(cum[k - 1] + Math.hypot(P0[k].x - P0[k - 1].x, P0[k].y - P0[k - 1].y)); }
  const L = cum[M], at = s => { s = ((s % L) + L) % L; let j = 0; while (cum[j + 1] < s) j++; return P0[j]; };
  const quarter = L / 4;   // 前半圈的一半＝導師到跑道中線
  const front = [0, 1, 3, ...[...BOYS].sort((a, b) => a - b)];   // 班牌、班旗、口號、男生
  const rest = PEOPLE.map((_, i) => i).filter(i => i !== 2 && !front.includes(i));

  ctx.strokeStyle = sel ? "#ffd43b" : "#fff"; ctx.lineWidth = sel ? 5 : 3; ctx.stroke();
  txt(P.mark, x, y + 1, 19, "#fff");
  const nm = (i < 4 && P.seat ? P.seat + "號" : "") + (NAMES[i] ? (i < 4 && P.seat ? " " : "") + NAMES[i] : "");
  if (nm) { const up = p.y < CL - .1; txt(nm, x, up ? y - r - 13 : y + r + 15, 16, "#fff", "center", "rgba(0,0,0,.8)"); }
}

function drawMinimap(t) {
  const x0 = 18, y0 = 18, w = 300, h = 186, k = 1.2, ox = x0 + 72, oy = y0 + 128, OVC = MARK_R + 42;   // OVC＝橢圓跑道中心
  ctx.fillStyle = "rgba(20,24,28,.82)"; rr(x0, y0, w, h, 10); ctx.fill();
  const R = 36.5, X = 42, Lw = LANES * LW;
  const oval = (rad) => { ctx.beginPath(); ctx.moveTo(ox + (OVC - X) * k, oy - R * k - rad * k);
    ctx.arc(ox + (OVC + X) * k, oy - R * k, rad * k, -Math.PI / 2, Math.PI / 2); ctx.arc(ox + (OVC - X) * k, oy - R * k, rad * k, Math.PI / 2, Math.PI * 1.5); ctx.closePath(); };
  oval(R + Lw); ctx.fillStyle = "#b9563b"; ctx.fill();
  oval(R); ctx.fillStyle = "#3a8f4a"; ctx.fill();
  ctx.fillStyle = "#b9563b"; ctx.fillRect(ox + (X0 - 14) * k, oy, (OVC - X - X0 + 14) * k, Lw * k);   // 西邊直道延伸（起點）
  for (const m of MARKERS) { ctx.fillStyle = "#fff"; ctx.fillRect(ox + m.x * k - 2, oy + m.y * k - 2, 4, 4); }
  ctx.fillStyle = "#ced4da"; ctx.fillRect(ox + STAGE.x0 * k, oy + STAGE.y0 * k, (STAGE.x1 - STAGE.x0) * k, (STAGE.y1 - STAGE.y0) * k);
  txt("司令台", ox, oy + 30, 13, "#fff");
  ctx.strokeStyle = "#fff"; ctx.setLineDash([3, 3]); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.ellipse(ox + (X0 - 5.4) * k, oy + CL * k, 9 * k, 5 * k, 0, 0, 7); ctx.stroke(); ctx.setLineDash([]);
  txt("起點", ox + (X0 - 5.4) * k, oy + 22, 12, "#fff");
  txt("操場", ox + OVC * k, oy - 36, 14, "rgba(255,255,255,.7)");
  // 可視範圍
  ctx.strokeStyle = "#ffd43b"; ctx.lineWidth = 2;
  ctx.strokeRect(ox + (cam - FW / 2 / S) * k, oy + (CYV - H / 2 / S) * k, FW / S * k, H / S * k);
  for (let i = 0; i < N; i++) { const p = pos(i, t); ctx.fillStyle = i === SEL ? "#ffd43b" : "#fff"; ctx.beginPath(); ctx.arc(ox + p.x * k, oy + p.y * k, i === SEL ? 3 : 1.6, 0, 7); ctx.fill(); }
  txt("全場位置", x0 + 12, y0 + 16, 14, "#adb5bd", "left");
}

function curStep(t) { let k = 0; STEPS.forEach((s, i) => { if (t >= s.t) k = i; }); return k; }
function countState(t) {
  for (const b of COUNT_BLOCKS) {
    if (t >= b.t && t < b.t + b.reps * 4) { const rel = t - b.t, rep = Math.floor(rel / 4), o = rel - rep * 4;
      let hi = -1; COUNT_OFF.forEach((c, k) => { if (o >= c && o < c + .45) hi = k; }); return {rep, reps: b.reps, hi}; }
  }
  return null;
}
const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;

function drawPanel(t, opt) {
  const X = FW, PW = W - FW;
  ctx.fillStyle = "#16191d"; ctx.fillRect(X, 0, PW, H);
  const k = curStep(t), st = STEPS[k], perf = t >= T.m1 && t < T.mEnd;
  // 階段
  txt(`${st.no} ${PHASE[st.no]}`, X + 40, 52, 30, "#adb5bd", "left");
  txt(fmt(t), W - 40, 52, 26, "#868e96", "right");
  // 目前步驟（大字口令改在左邊草地上）
  txt(st.title, X + PW / 2, 130, st.title.length > 9 ? 40 : 46, "#ffd43b");
  txt(st.desc, X + PW / 2, 196, 24, "#dee2e6");
  const cs = null;
  // 表演：影片框；其他：步驟清單
  if (perf) {
    const v = VBOX;
    ctx.fillStyle = "#000"; ctx.fillRect(v.x, v.y, v.w, v.h);
    const inGap = t >= T.gap[0] && t < T.gap[1];
    if (inGap) { txt("跑位！", v.x + v.w / 2, v.y + v.h / 2 - 30, 64, "#ffd43b"); txt("圍成大橢圓", v.x + v.w / 2, v.y + v.h / 2 + 40, 32, "#fff"); }
    else if (opt.video) opt.video(v);
    ctx.strokeStyle = "#ffd43b"; ctx.lineWidth = 4; ctx.strokeRect(v.x - 2, v.y - 2, v.w + 4, v.h + 4);
    const left = (inGap ? T.gap[1] : t < T.gap[0] ? T.gap[0] : T.mEnd) - t;
    txt(inGap ? `${left.toFixed(1)} 秒後開始第二段` : `這段還有 ${Math.ceil(left)} 秒`, X + PW / 2, v.y + v.h + 40, 26, "#adb5bd");
  } else {
    const y0 = cs ? 440 : 300, rowH = 62, from = clamp(k - 2, 0, STEPS.length - 8);
    for (let j = 0; j < 8 && from + j < STEPS.length; j++) {
      const i = from + j, s = STEPS[i], cur = i === k, done = i < k, y = y0 + j * rowH;
      if (y > 960) break;
      if (cur) { ctx.fillStyle = "#2b3036"; rr(X + 30, y - 26, PW - 60, 52, 10); ctx.fill(); }
      txt(fmt(s.t), X + 50, y, 20, done ? "#495057" : "#868e96", "left");
      txt(s.title, X + 130, y, 28, cur ? "#ffd43b" : done ? "#5c636a" : "#ced4da", "left");
      if (s.pre) txt("喊", W - 56, y, 18, cur ? "#ffd43b" : "#5c636a", "right");
    }
  }
  // 圖例
  const lg = [["牌", "#e8590c", "班牌"], ["旗", "#e03131", "班旗"], ["師", "#7048e8", "導師"], ["令", "#2b8a3e", "口號"]]
    .concat(BOYS.size ? [["1", BOY_C, "男生"], ["2", GIRL_C, "女生"]] : [["1", "#1971c2", "同學"]]);
  const gapL = lg.length > 5 ? 104 : 120;
  lg.forEach((l, i) => { const x = X + 50 + i * gapL, y = 1000;
    ctx.fillStyle = l[1]; ctx.beginPath(); ctx.arc(x, y, 15, 0, 7); ctx.fill(); txt(l[0], x, y + 1, 15, "#fff"); txt(l[2], x + 22, y, 18, "#adb5bd", "left"); });
  // 進度條
  ctx.fillStyle = "#2b3036"; ctx.fillRect(X, H - 8, PW, 8);
  ctx.fillStyle = "#ffd43b"; ctx.fillRect(X, H - 8, PW * clamp(t / T.end, 0, 1), 8);
}

const EDIT = {on: false, f: "B", t: 0, cam: 0, drag: -1};
const EDIT_NAME = {col: "起始隊形", A: "兩個小圓", B: "大橢圓"};
function editIssues(t) {   // 超出跑道、兩人太近
  const P = PEOPLE.map((_, i) => pos(i, t)), out = new Set(), near = new Set();
  if (EDIT.f !== "col") P.forEach((p, i) => { if (p.y - .42 < 0 || p.y + .42 > LANES * LW) out.add(i); });
  for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) if (Math.hypot(P[i].x - P[j].x, P[i].y - P[j].y) < .8) { near.add(i); near.add(j); }
  return {P, out, near};
}
function drawEditOverlay(t) {
  const {P, out, near} = editIssues(t);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, FW, H); ctx.clip();
  P.forEach((p, i) => { if (!out.has(i) && !near.has(i)) return;
    ctx.strokeStyle = out.has(i) ? "#ff3b3b" : "#ff922b"; ctx.lineWidth = 5; ctx.setLineDash([6, 4]);
    ctx.beginPath(); ctx.arc(sx(p.x), sy(p.y), 30, 0, 7); ctx.stroke(); ctx.setLineDash([]); });
  if (EDIT.drag >= 0) { const p = P[EDIT.drag]; txt(`離司令台中線 ${p.x >= 0 ? "東" : "西"} ${Math.abs(p.x).toFixed(1)} m・第 ${Math.min(LANES, Math.max(1, Math.ceil(p.y / LW)))} 道`, sx(p.x), sy(p.y) - 44, 18, "#fff", "center", "rgba(0,0,0,.8)"); }
  const msg = `✏️ 調整中：${EDIT_NAME[EDIT.f]}　拖曳圓圈移動` + (out.size ? `　⚠ ${out.size} 人超出跑道` : "") + (near.size ? `　⚠ ${near.size} 人靠太近` : "");
  ctx.font = `800 26px ${FONT}`; const w = ctx.measureText(msg).width + 40;
  ctx.fillStyle = "rgba(0,0,0,.75)"; rr(FW / 2 - w / 2, 216, w, 50, 25); ctx.fill(); txt(msg, FW / 2, 241, 26, out.size || near.size ? "#ffd43b" : "#fff", "center", null, 800);
  ctx.restore();
}
function render(t, opt = {}) {
  let cx = 0; for (let i = 0; i < N; i++) cx += pos(i, t).x; cam = Math.min(cx / N, 4);
  if (EDIT.on) cam = EDIT.cam;
  ctx.clearRect(0, 0, W, H);
  drawField(t); if (EDIT.on) drawEditOverlay(t); drawMinimap(t); drawPanel(t, opt);
}
window.renderFrame = (t) => render(t, {});
window.setNames = (a) => { NAMES = PEOPLE.map((_, i) => a[i] || ""); };
window.TL = {CUES, T, VBOX, END: T.end, STEPS, COUNT_BLOCKS};

/* ============ 互動 ============ */
const Q = new URLSearchParams(location.search);
if (Q.has("render")) document.body.classList.add("render");
try { const s = JSON.parse(localStorage.getItem("sportgame-names3") || "null"); if (Array.isArray(s)) setNames(s); } catch (e) {}
const au = document.getElementById("au"), vo = document.getElementById("vo"), dv = document.getElementById("dv");
const bar = document.getElementById("bar"), tm = document.getElementById("tm"), playB = document.getElementById("play");
const meSel = document.getElementById("me");
bar.max = T.end;
let clock = {t: 0, playing: false, last: 0, rate: 1}, audioOK = true;
au.addEventListener("error", () => audioOK = false);
function now() { return audioOK ? au.currentTime : clock.t; }
function seek(t) { t = clamp(t, 0, T.end); if (audioOK) { au.currentTime = t; vo.currentTime = t; } clock.t = t; }
function setPlay(on) {
  clock.playing = on; clock.last = performance.now();
  if (audioOK) { if (on) { vo.currentTime = au.currentTime; au.play().catch(() => { audioOK = false; }); vo.play().catch(() => {}); } else { au.pause(); vo.pause(); } }
  playB.textContent = on ? "⏸ 暫停" : "▶ 播放";
}
playB.onclick = () => setPlay(!clock.playing);
bar.oninput = () => seek(+bar.value);
document.getElementById("spd").onchange = e => { clock.rate = +e.target.value; au.playbackRate = vo.playbackRate = clock.rate; };
// 口令靜音：只關口令軌，音樂照常
const muteB = document.getElementById("mute");
function setMute(m) { vo.muted = m; muteB.textContent = m ? "🔇 口令聲：關" : "🔊 口令聲：開"; muteB.style.borderColor = m ? "#ff6b6b" : ""; try { localStorage.setItem("sportgame-mute", m ? "1" : "0"); } catch (e) {} }
muteB.onclick = () => setMute(!vo.muted);
try { setMute(localStorage.getItem("sportgame-mute") === "1"); } catch (e) {}
document.getElementById("prev").onclick = () => { const k = curStep(now() - .5); seek(STEPS[k].t); };
document.getElementById("next").onclick = () => { const k = curStep(now()); if (k + 1 < STEPS.length) seek(STEPS[k + 1].t); };
cv.onclick = () => { if (!EDIT.on) setPlay(!clock.playing); };
// 調整隊形
const editp = document.getElementById("editp"), emsg = document.getElementById("emsg");
const EDIT_T = () => ({col: 0.5, A: T.m1 + 1, B: T.gap[1] + 1})[EDIT.f];
try { const raw = localStorage.getItem("sportgame-layout"); if (raw) { LAYOUT = layoutFromJSON(JSON.parse(raw)); rebuildForms(); } } catch (e) {}
function saveLayout() { try { localStorage.setItem("sportgame-layout", JSON.stringify(layoutToJSON())); } catch (e) {} }
function chooseForm(f) {
  EDIT.f = f; EDIT.t = EDIT_T();
  let cx = 0; for (let i = 0; i < N; i++) cx += pos(i, EDIT.t).x; EDIT.cam = Math.min(cx / N, 4);
  editp.querySelectorAll(".seg button").forEach(b => b.classList.toggle("cur", b.dataset.f === f));
  emsg.textContent = LAYOUT[f] ? `「${EDIT_NAME[f]}」是你調整過的版本` : `「${EDIT_NAME[f]}」目前是自動排的`;
}
function setEdit(on) {
  EDIT.on = on; editp.classList.toggle("on", on); cv.style.touchAction = on ? "none" : "";
  document.getElementById("ebtn").style.borderColor = on ? "#ffd43b" : "";
  if (on) { setPlay(false); chooseForm(EDIT.f); } else seek(EDIT.t);
}
document.getElementById("ebtn").onclick = () => setEdit(!EDIT.on);
document.getElementById("edone").onclick = () => setEdit(false);
editp.querySelectorAll(".seg button").forEach(b => b.onclick = () => chooseForm(b.dataset.f));
document.getElementById("ereset").onclick = () => { LAYOUT[EDIT.f] = null; rebuildForms(); saveLayout(); chooseForm(EDIT.f); };
document.getElementById("edl").onclick = () => {
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(layoutToJSON(), null, 1)], {type: "application/json"}));
  a.download = "趣味進場_隊形設定.json"; document.body.appendChild(a); a.click(); a.remove();
  emsg.textContent = "已下載「趣味進場_隊形設定.json」（在下載資料夾），請交給 Claude 寫進網頁";
};
document.getElementById("eload").onclick = () => document.getElementById("efile").click();
document.getElementById("efile").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { LAYOUT = layoutFromJSON(JSON.parse(await f.text())); rebuildForms(); saveLayout(); chooseForm(EDIT.f); emsg.textContent = "已載入設定檔"; }
  catch (err) { emsg.textContent = "設定檔讀不懂：" + err.message; }
  e.target.value = "";
};
function canvasWorld(ev) {
  const r = cv.getBoundingClientRect(), px = (ev.clientX - r.left) * W / r.width, py = (ev.clientY - r.top) * H / r.height;
  return {px, py, x: cam + (px - FW / 2) / S, y: CYV + (py - H / 2) / S};
}
cv.addEventListener("pointerdown", ev => {
  if (!EDIT.on) return;
  const w = canvasWorld(ev); if (w.px > FW) return;
  let best = -1, bd = 1e9;
  PEOPLE.forEach((_, i) => { const p = pos(i, EDIT.t), d = Math.hypot(sx(p.x) - w.px, sy(p.y) - w.py); if (d < bd) { bd = d; best = i; } });
  if (bd > 34) return;
  EDIT.drag = best; cv.setPointerCapture(ev.pointerId); ev.preventDefault();
});
cv.addEventListener("pointermove", ev => {
  if (!EDIT.on || EDIT.drag < 0) return;
  const w = canvasWorld(ev), i = EDIT.drag, x = Math.round(w.x * 10) / 10, y = Math.round(clamp(w.y, -3, LANES * LW + 3) * 10) / 10;
  if (EDIT.f === "col") { LAYOUT.col = LAYOUT.col || PEOPLE.map(P => ({dx: P.dx, y: P.y})); LAYOUT.col[i] = {dx: +(x - leaderX(EDIT.t)).toFixed(2), y}; }
  else { LAYOUT[EDIT.f] = LAYOUT[EDIT.f] || (EDIT.f === "A" ? FORM_A : FORM_B).map(q => ({x: q.x, y: q.y})); LAYOUT[EDIT.f][i] = {x, y}; }
  rebuildForms();
});
const endDrag = () => { if (EDIT.drag >= 0) { EDIT.drag = -1; saveLayout(); chooseForm(EDIT.f); } };
cv.addEventListener("pointerup", endDrag); cv.addEventListener("pointercancel", endDrag);
window.EDITAPI = {setEdit, chooseForm, layoutToJSON};
document.addEventListener("keydown", e => { if (e.target.tagName === "INPUT") return; if (e.key === " ") { e.preventDefault(); setPlay(!clock.playing); } if (e.key === "m" || e.key === "M") setMute(!vo.muted); });
function fillMe() {
  meSel.length = 1;
  PEOPLE.forEach((P, i) => { const o = document.createElement("option"); o.value = i; o.textContent = (P.seat ? P.seat + "號 " : "") + (i < 4 ? P.label : "") + (NAMES[i] ? " " + NAMES[i] : ""); meSel.appendChild(o); });
  meSel.value = SEL;
}
meSel.onchange = () => SEL = +meSel.value;
if (Q.has("me")) SEL = clamp(+Q.get("me"), -1, N - 1);
// 名單
const ng = document.getElementById("ng");
try { const raw = localStorage.getItem("sportgame-boys3"); const b = raw === null ? null : JSON.parse(raw); if (Array.isArray(b)) setBoys(b); } catch (e) {}   // 沒存過就用預設
function setBoys(a) { BOYS = new Set(a.filter(i => i >= 4 && i < N)); buildFormB(); buildPaths(); }
window.setBoys = setBoys;
PEOPLE.forEach((P, i) => {
  const l = document.createElement("label"); l.innerHTML = `<span style="color:${P.color}">●</span>${i < 4 ? P.label + (P.seat ? `<small>${P.seat}號</small>` : "") : P.label}`;
  const inp = document.createElement("input"); inp.maxLength = 6; inp.value = NAMES[i]; inp.className = "nm"; l.appendChild(inp);
  if (i >= 4) { const cb = document.createElement("input"); cb.type = "checkbox"; cb.className = "boy"; cb.dataset.i = i; cb.checked = BOYS.has(i); cb.title = "男生";
    const t = document.createElement("span"); t.textContent = "男"; t.style.fontSize = "14px"; l.appendChild(cb); l.appendChild(t); }
  ng.appendChild(l);
});
document.getElementById("nclose").onclick = () => document.getElementById("names").classList.remove("on");
document.getElementById("nbtn").onclick = () => document.getElementById("names").classList.toggle("on");
document.getElementById("nsave").onclick = () => {
  const a = [...ng.querySelectorAll("input.nm")].map(x => x.value.trim()); setNames(a);
  const b = [...ng.querySelectorAll("input.boy")].filter(x => x.checked).map(x => +x.dataset.i); setBoys(b);
  try { localStorage.setItem("sportgame-names3", JSON.stringify(a)); localStorage.setItem("sportgame-boys3", JSON.stringify(b)); } catch (e) {} fillMe();
};
document.getElementById("nclear").onclick = () => { ng.querySelectorAll("input.nm").forEach(x => x.value = ""); ng.querySelectorAll("input.boy").forEach(x => x.checked = false); document.getElementById("nsave").onclick(); };
fillMe();

function videoDraw(v) {
  const want = now() - T.m1;
  if (Math.abs(dv.currentTime - want) > .25) dv.currentTime = want;
  if (clock.playing && dv.paused) dv.play().catch(() => {});
  if (!clock.playing && !dv.paused) dv.pause();
  dv.playbackRate = clock.rate;
  if (dv.readyState >= 2) ctx.drawImage(dv, v.x, v.y, v.w, v.h);
}
function loop(ts) {
  if (!audioOK && clock.playing) { clock.t += (ts - clock.last) / 1000 * clock.rate; }
  clock.last = ts;
  let t = EDIT.on ? EDIT.t : now();
  if (audioOK && clock.playing && Math.abs(vo.currentTime - au.currentTime) > .08) vo.currentTime = au.currentTime;   // 口令軌跟音樂軌對齊
  if (t >= T.end) { setPlay(false); t = T.end; }
  if (document.activeElement !== bar) bar.value = t;
  tm.textContent = `${fmt(t)} / ${fmt(T.end)}`;
  render(t, {video: videoDraw});
  if (!(t >= T.m1 && t < T.mEnd) && !dv.paused) dv.pause();
  requestAnimationFrame(loop);
}
if (!Q.has("render")) requestAnimationFrame(loop); else render(0);
</script>
</body>
</html>
