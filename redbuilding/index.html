<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>大觀園理家記</title>
<meta name="description" content="扮演賈探春代理榮國府家務，撐過一年不破產：〈賈探春敏慧興利〉課前引導遊戲。">
<meta property="og:title" content="大觀園理家記：你能撐過一年嗎？">
<meta property="og:description" content="王熙鳳病倒，榮國府交給三姑娘探春。亂花錢會破產，亂省錢會眾叛親離，還有趙姨娘隨時殺到。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#100b09;--panel:#1d1512;--panel2:#271c17;--ink:#f3e7d0;--muted:#b9a68a;--line:#4a3527;
  --gold:#ebbd60;--gold2:#a8742a;--red:#ec4b3e;--red2:#8f1d16;--jade:#4cc3a6;--violet:#b39af0;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:18px/1.7 var(--sans);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:
  radial-gradient(ellipse 60% 50% at 10% 0%,rgba(190,40,28,.38),transparent 70%),
  radial-gradient(ellipse 55% 45% at 100% 100%,rgba(30,120,105,.28),transparent 70%),
  radial-gradient(ellipse 40% 35% at 90% 10%,rgba(235,189,96,.14),transparent 70%),var(--bg)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.07;background:
  repeating-linear-gradient(135deg,var(--gold) 0 1px,transparent 1px 22px)}
.embers{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.embers i{position:absolute;bottom:-10px;width:4px;height:4px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px 2px rgba(235,189,96,.7);opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) translateX(0);opacity:0}10%{opacity:.9}100%{transform:translateY(-105vh) translateX(40px);opacity:0}}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--serif);margin:0;line-height:1.35}
.gild{background:linear-gradient(180deg,#fff6dc 0%,#f2c96e 48%,#b8772a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(235,189,96,.35))}
.screen{display:none;min-height:100dvh;position:relative;z-index:1}
.screen.on{display:block}
.wrap{max-width:900px;margin:0 auto;padding:32px 20px 48px}
.btn{position:relative;overflow:hidden;border:0;padding:14px 30px;min-height:56px;font-weight:800;font-size:19px;letter-spacing:2px;color:#fff;
  background:linear-gradient(135deg,#ff5a49,#a11f17);clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%);
  box-shadow:0 0 22px rgba(236,75,62,.45);text-shadow:0 1px 2px rgba(0,0,0,.4)}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:shine 3.2s infinite}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
.btn:active{transform:translateY(2px)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line);clip-path:none;border-radius:4px}
.btn.ghost::after{display:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-block;font-size:14px;padding:1px 10px;border:1px solid var(--gold2);color:var(--gold);font-weight:700;background:rgba(235,189,96,.08);border-radius:3px}
.frame{position:relative;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 0 0 1px rgba(235,189,96,.06)}
.frame::before,.frame::after{content:"";position:absolute;width:18px;height:18px;border:2px solid var(--gold);pointer-events:none;z-index:2}
.frame::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.frame::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.av{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font:900 20px/1 var(--serif);border:2px solid var(--gold2);overflow:hidden;background:#2a1d18}
.av img{width:100%;height:100%;object-fit:cover;object-position:50% 0;transform:scale(2.1);transform-origin:50% 8%}

/* 首頁 */
.hero{display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:10px;max-width:1080px;margin:0 auto;padding:4vh 24px 24px;min-height:92dvh}
.hero .art{position:relative;align-self:end;text-align:center}
.hero .art::before{content:"";position:absolute;left:50%;top:45%;width:110%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(235,189,96,.35),rgba(236,75,62,.12) 45%,transparent 70%)}
.hero .art img{position:relative;width:100%;max-width:440px;filter:drop-shadow(0 0 18px rgba(235,189,96,.35))}
.ring{position:absolute;left:50%;top:42%;width:95%;aspect-ratio:1;transform:translate(-50%,-50%);border:1px dashed rgba(235,189,96,.35);border-radius:50%;animation:spin 40s linear infinite}
.ring::after{content:"";position:absolute;inset:8%;border:1px solid rgba(235,189,96,.18);border-radius:50%}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.seal{display:inline-grid;place-items:center;width:72px;height:72px;border:3px solid var(--red);color:var(--red);font:900 26px/1 var(--serif);border-radius:8px;transform:rotate(-6deg);margin-bottom:12px;writing-mode:vertical-rl;box-shadow:0 0 16px rgba(236,75,62,.5),inset 0 0 10px rgba(236,75,62,.3)}
#home h1{font-size:clamp(46px,7vw,84px);font-weight:900;letter-spacing:6px}
.kicker{font:700 15px var(--sans);letter-spacing:6px;color:var(--gold);margin-bottom:4px}
#home .by{color:var(--gold);font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:2px;margin-top:22px;opacity:.9}
#home .sub{color:var(--muted);margin:12px 0 30px;font-size:19px}
.modes{display:grid;gap:14px;max-width:420px}
#fengBox .btn{width:100%}
.lockbox{border:1px dashed var(--line);padding:12px;color:var(--muted);font-size:16px;text-align:center}
.foot{font-size:14px;color:var(--muted);text-align:center;padding:0 20px 30px}
.foot details{margin-top:12px}
.foot summary{cursor:pointer}
#tForm{display:flex;gap:8px;justify-content:center;margin-top:10px}
#tForm input{font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);width:180px}
#tForm button{border:1px solid var(--line);background:var(--panel2);padding:8px 14px;font-size:16px}
#stats{text-align:left;margin:16px auto 0;max-width:560px}
#stats table{border-collapse:collapse;width:100%;font-size:15px}
#stats td,#stats th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
#stats td:not(:first-child),#stats th:not(:first-child){text-align:right}

/* 前情提要 */
.story{max-width:1120px;margin:0 auto;padding:3vh 20px 24px;display:flex;flex-direction:column;min-height:100dvh}
.story .pg{flex:1;display:flex;flex-direction:column;justify-content:flex-start;gap:14px;animation:fadein .5s}
@keyframes fadein{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.story .num{font:900 48px/1 var(--serif);color:transparent;-webkit-text-stroke:1px var(--gold);opacity:.7}
.story h2{font-size:clamp(32px,5vw,48px);font-weight:900}
.story p{font-size:21px;margin:0;color:#e9dcc3}
.story .nav{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:20px}
.dots{display:flex;gap:8px}
.dots i{width:22px;height:4px;background:var(--line)}
.dots i.on{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pcard{padding:14px;display:flex;gap:14px;align-items:center}
.pcard .av{width:72px;height:72px}
.pcard b{font-family:var(--serif);font-size:19px;color:var(--gold)}
.pcard small{display:block;color:var(--muted);font-size:15px;line-height:1.5}

/* 遊戲主畫面 */
.game{display:grid;grid-template-columns:1fr 290px;gap:20px;max-width:1240px;margin:0 auto;padding:18px;min-height:100dvh;align-content:start}
.side{order:2;padding:18px;display:flex;flex-direction:column;gap:14px;align-self:start;position:sticky;top:18px}
.month{font:900 28px var(--serif)}
.month small{font:600 15px var(--sans);color:var(--muted);margin-left:6px}
.stat .lab{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;color:var(--muted);font-weight:700}
.stat .val{font:900 23px var(--serif);color:var(--ink)}
.bar{height:12px;background:#0c0807;border:1px solid var(--line);margin-top:4px;transform:skewX(-20deg);overflow:hidden}
.bar>i{display:block;height:100%;transition:width .6s}
.bar.s>i{background:linear-gradient(90deg,#a8742a,#ffd57a);box-shadow:0 0 10px rgba(235,189,96,.8)}
.bar.f>i{background:linear-gradient(90deg,#1f7a68,#6ff0d0);box-shadow:0 0 10px rgba(76,195,166,.8)}
.bar.h>i{background:linear-gradient(90deg,#8f1d16,#ff6a5a);box-shadow:0 0 10px rgba(236,75,62,.8)}
.bar>i.low{animation:blink .9s infinite}
@keyframes blink{50%{opacity:.3}}
.comp{display:flex;gap:8px;align-items:center;font-size:15px;color:var(--muted);font-weight:700}
.comp i{width:16px;height:16px;transform:rotate(45deg);border:2px solid var(--red);margin:0 2px}
.comp i.on{background:var(--red);box-shadow:0 0 10px var(--red)}
.flow{font-size:15px;background:rgba(0,0,0,.3);border-left:3px solid var(--gold2);padding:8px 10px;line-height:1.6}
.flow b{font-variant-numeric:tabular-nums}
.neg{color:#ff7a6c}.pos{color:#6fe3c6}
.advs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.adv{border:1px solid var(--line);background:rgba(0,0,0,.25);padding:8px;display:flex;gap:8px;align-items:center;text-align:left;font-size:15px;min-height:48px}
.adv:hover:not(:disabled){border-color:var(--gold);box-shadow:0 0 12px rgba(235,189,96,.3)}
.adv .av{width:36px;height:36px;font-size:15px}
.adv em{font-style:normal;color:var(--muted);font-size:13px;display:block;line-height:1.2}
.adv:disabled{opacity:.35}
.adv.free{border-color:#2f6b62;box-shadow:inset 0 0 0 1px rgba(76,195,166,.35)}
.adv.free em{color:#6fe3c6}
.sidehead{font-weight:700;font-size:14px;color:var(--gold);letter-spacing:3px}

.main{display:flex;flex-direction:column;gap:14px;min-width:0}
.ev{display:grid;grid-template-columns:1fr 230px;padding:22px 0 0 24px;margin-top:40px;animation:fadein .4s}
.ev .body{padding-bottom:22px;min-width:0}
.ev .pic{position:relative;align-self:stretch;margin-top:-62px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;min-height:200px}
.ev .pic::before{content:"";position:absolute;left:50%;bottom:0;width:120%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,var(--glow,rgba(235,189,96,.35)),transparent 65%)}
.ev .pic img{position:relative;width:100%;max-height:330px;object-fit:cover;object-position:top;animation:slidein .5s ease-out}
@keyframes slidein{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.ev .pic .glyph{position:relative;font:900 140px/1 var(--serif);color:transparent;-webkit-text-stroke:2px var(--gold);opacity:.5;margin-bottom:24px}
.ev .top{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:10px}
.ev .who{font-weight:800;color:var(--gold);font-family:var(--serif);font-size:19px}
.ev h2{font-size:clamp(26px,3vw,34px);font-weight:900;margin-bottom:8px}
.ev .txt{font-size:20px;margin:0;color:#ecdfc6}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:linear-gradient(90deg,rgba(39,28,23,.95),rgba(29,21,18,.95));border:1px solid var(--line);border-left:4px solid var(--gold2);padding:14px 16px;min-height:60px;font-size:19px;line-height:1.5;transition:transform .15s,border-color .15s,box-shadow .15s;color:var(--ink)}
.opt:hover:not(:disabled){transform:translateX(6px);border-color:var(--gold);box-shadow:0 0 18px rgba(235,189,96,.25)}
.opt .k{flex:none;width:28px;height:28px;transform:rotate(45deg);border:2px solid var(--gold);display:grid;place-items:center;margin:3px 4px 0}
.opt .k b{transform:rotate(-45deg);font:900 15px var(--serif);color:var(--gold)}
.opt:disabled{opacity:.45;cursor:not-allowed}
.opt .lock{display:block;font-size:14px;color:var(--muted)}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:1px 8px;margin:6px 6px 0 0;border:1px solid}
.tag.wan{color:var(--gold);border-color:var(--gold2)}.tag.chai{color:var(--violet);border-color:#6c5ba7}
.tag.ping{color:var(--jade);border-color:#2f6b62}.tag.yu{color:#ff8a7c;border-color:var(--red2)}
.note{display:flex;gap:12px;align-items:center;background:rgba(0,0,0,.35);border-left:3px solid var(--jade);padding:10px 14px;font-size:17px}
.note .av{width:42px;height:42px}
.note b{font-family:var(--serif);color:var(--gold)}
.note.yu{border-color:var(--red)}.note.dai,.note.chai{border-color:var(--violet)}.note.wan{border-color:var(--gold)}

/* 浮層 */
.ov{position:fixed;inset:0;background:rgba(5,3,2,.72);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.ov.on{display:flex}
.box{max-width:660px;width:100%;max-height:92dvh;overflow-y:auto;overflow-x:hidden;padding:24px;animation:pop .25s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.box h3{font-size:26px;font-weight:900;margin-bottom:6px}
.deltas{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.deltas span{font-weight:800;font-size:16px;padding:3px 10px;background:rgba(0,0,0,.35);border:1px solid var(--line)}
.quote{position:relative;background:rgba(235,189,96,.07);border:1px solid rgba(235,189,96,.3);padding:14px 16px;margin:12px 0;font-family:var(--serif);font-size:18px;line-height:1.85;color:#f1e3c4}
.quote cite{display:block;font:800 14px var(--sans);color:var(--gold);font-style:normal;margin-bottom:4px;letter-spacing:2px}
.explain{font-size:17px;color:#d6c7ab;margin:8px 0 16px}
.box .btn{width:100%}
#zhao .box{display:grid;grid-template-columns:240px 1fr;gap:18px;max-width:800px;border-color:var(--red);box-shadow:0 0 40px rgba(236,75,62,.55);animation:pop .25s ease-out,pulse 1.2s infinite}
/* 選項的框（::before）在晃，文字留在原位 */
#zhao .opt{position:relative;z-index:0;background:transparent;border-color:transparent;transition:none}
#zhao .opt:hover:not(:disabled){transform:none;box-shadow:none}
#zhao .opt::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(60,24,20,.95),rgba(29,21,18,.95));border:1px solid var(--red2);border-left:4px solid var(--red);animation:jitter .16s linear infinite}
#zhao .opt:hover::before{border-color:var(--red);box-shadow:0 0 18px rgba(236,75,62,.45)}
#zhao .opt:disabled::before{animation:none}
@keyframes jitter{0%,100%{transform:translate(0,0)}25%{transform:translate(calc(var(--amp,1)*1px),calc(var(--amp,1)*-.6px)) rotate(calc(var(--amp,1)*.08deg))}50%{transform:translate(calc(var(--amp,1)*-1px),calc(var(--amp,1)*.5px))}75%{transform:translate(calc(var(--amp,1)*.6px),calc(var(--amp,1)*.9px)) rotate(calc(var(--amp,1)*-.08deg))}}
#zhao .zpic{align-self:end;position:relative}
#zhao .zpic::before{content:"";position:absolute;inset:10% -20% 0;background:radial-gradient(circle,rgba(236,75,62,.6),transparent 65%)}
#zhao .zpic img{position:relative;width:118%;margin-left:-9%;animation:slidein .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes pulse{50%{box-shadow:0 0 70px rgba(236,75,62,.8)}}
.timer{height:10px;background:#0c0807;border:1px solid var(--red2);overflow:hidden;margin:10px 0 16px;transform:skewX(-20deg)}
.timer i{display:block;height:100%;background:linear-gradient(90deg,#8f1d16,#ff6a5a);box-shadow:0 0 10px var(--red);width:100%}
.hint{outline:2px solid var(--gold);outline-offset:2px;box-shadow:0 0 20px rgba(235,189,96,.5)}
.settle table{width:100%;border-collapse:collapse;font-size:17px;margin:10px 0 16px}
.settle td{padding:6px 4px;border-bottom:1px solid var(--line)}
.settle td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:800}

/* 結局 */
#end .wrap{max-width:960px}
.endhead{display:grid;grid-template-columns:1fr 260px;align-items:end;gap:16px;padding:10px 0 0}
.endhead .kind{font-weight:800;color:var(--red);letter-spacing:6px}
.endhead.win .kind{color:var(--gold)}
.endhead h1{font-size:clamp(36px,6vw,60px);font-weight:900;margin:6px 0}
.endhead p{color:#e2d4ba;font-size:19px;margin:6px 0 20px}
.endhead img{width:100%;filter:drop-shadow(0 0 16px rgba(235,189,96,.35))}
.endhead.lose img{filter:drop-shadow(0 0 16px rgba(80,120,200,.35))}
.sec{padding:20px 22px;margin-top:16px}
.sec h2{font-size:24px;margin-bottom:10px;color:var(--gold)}
.type{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.type .big{width:96px;height:96px;display:grid;place-items:center;background:linear-gradient(135deg,#ff5a49,#8f1d16);color:#fff;font:900 42px var(--serif);transform:rotate(45deg) scale(.8);box-shadow:0 0 24px rgba(236,75,62,.6)}
.type .big span{transform:rotate(-45deg)}
.type h3{font-size:30px;font-weight:900}
.kv{display:grid;grid-template-columns:7em 1fr;gap:6px 12px;margin-top:12px;font-size:17px}
.kv dt{color:var(--muted);font-weight:700}
.kv dd{margin:0}
.cmp{width:100%;border-collapse:collapse;font-size:16px}
.cmp th,.cmp td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;vertical-align:top}
.cmp th{color:var(--muted);font-size:14px}
.cmp .ok{color:var(--jade);font-weight:800}
.cmp .q{font-family:var(--serif);color:#cbbb9e;font-size:15px;margin-top:4px}
.endbtns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:24px}
.chart text{font:13px var(--sans);fill:var(--muted)}

/* 身分註記、插話、反應、聲音、晃動 */
.opt.special{border-color:var(--gold);border-left-color:var(--jade);background:linear-gradient(90deg,rgba(76,195,166,.18),rgba(39,28,23,.95));box-shadow:0 0 18px rgba(76,195,166,.35);animation:fadein .4s}
.maxed{font-weight:800;color:#6fe3c6;text-shadow:0 0 10px rgba(76,195,166,.7);margin:4px 0 8px}
.stat.max .bar{box-shadow:0 0 14px rgba(255,255,255,.35)}
.stat.max .lab span:first-child{color:#6fe3c6}
.relwrap{padding:8px;background:rgba(0,0,0,.25)}
.relmap{width:100%;display:block}
.relmap .rn{font:900 22px var(--serif);fill:#f3e7d0;text-anchor:middle}
.relmap .rr{font:600 15px var(--sans);fill:#cdbb9c;text-anchor:middle}
.relmap .rl{font:700 15px var(--sans);fill:#ebbd60;text-anchor:middle}
.relmap .rg{font:900 28px var(--serif);fill:#ebbd60;text-anchor:middle}
.relmap .rgen{font:700 14px var(--sans);fill:#6f5f4b;writing-mode:horizontal-tb}
.box.wide{max-width:min(1200px,96vw)}
.relbtn{border:1px solid var(--gold2);background:rgba(235,189,96,.08);color:var(--gold);padding:8px;font-weight:800;letter-spacing:2px}
.relbtn:hover{box-shadow:0 0 12px rgba(235,189,96,.35)}
.defn{font-size:18px!important;background:rgba(235,189,96,.08);border-left:3px solid var(--gold);padding:10px 14px;color:#e9dcc3}
.defn b{color:var(--gold)}
.sayov{position:fixed;inset:0;z-index:12;display:none;align-items:flex-end;justify-content:center;padding:16px 16px 0;background:rgba(5,3,2,.4)}
.sayov.on{display:flex}
.saybox{display:grid;grid-template-columns:280px 1fr;gap:8px;max-width:860px;width:100%;align-items:end;padding:0 24px 0 0;animation:popin .45s cubic-bezier(.2,1.4,.4,1) both;overflow:visible}

const GLOSS_RE = new RegExp(Object.keys(GLOSS).sort((a, b) => b.length - a.length).join("|"), "g");
// 回傳加了註記的文字；skip 是事件主角（標題已經寫了身分）
function gloss(txt, skip) {
  const seen = new Set(skip ? [P[skip] ? P[skip].n : ""] : []);
  return String(txt).replace(GLOSS_RE, nm => {
    if (seen.has(nm)) return nm;
    seen.add(nm);
    return `${nm}<span class="gl">（${GLOSS[nm]}）</span>`;
  });
}
// 結果標題字大，不在標題裡插註記，改在下面列一行
function glossList(txt, skip) {
  const out = [], seen = new Set(skip ? [P[skip] ? P[skip].n : ""] : []);
  String(txt).replace(GLOSS_RE, nm => { if (!seen.has(nm)) { seen.add(nm); out.push(`<b>${nm}</b>：${GLOSS[nm]}`); } return nm; });
  return out.join("　");
}

      {t: "分班派職：誰管茶、誰管燈、誰管器皿，丟了照數賠", orig: 1, best: 1, e: {exp: -15, h: 2, f: 4, k: {open: 2}}, r: "人人各司其職，東西不丟、差事不推。", n: "這就是「責任到人」：每件事都有人負責，就沒人能推託。"},
      {t: "多撥銀子，人手不夠就再添人", e: {exp: 10, h: 4, k: {face: 1}}, r: "人是多了，事反而更亂。"},
      {t: "照舊，喪事辦完就好", e: {exp: 5, f: -4}, r: "寧府的人說：西府的奶奶也不過如此。"},
      {t: "抓幾個偷懶的重重地罰", e: {h: -6, f: 2, exp: -5}, r: "眾人怕了，怨氣也起來了。"}
    ]},
  f_temple: {who: "jing", src: "第15回", t: "饅頭庵弄權",
    x: "送殯途中住在饅頭庵，老尼淨虛求你：張財主的女兒金哥已許給守備的公子，可李衙內也看上了，張家想退親。只要你託長安節度使雲老爺寫封信壓一壓守備，張家願出三百兩。",
    o: [
      {t: "收下，叫人寫信給雲老爺", orig: 1, e: {s: 300, dirt: ["temple", "饅頭庵的三百兩"], later: ["f_temple2", 2], k: {debt: 1}}, r: "一封信，三百兩到手。王夫人連一點消息也不知道。",
        q: "鳳姐聽了這話，便發了興頭，說道：「你是素日知道我的，從來不信什麼是陰司地獄報應的，憑是什麼事，我說要行就行。你叫他拿三千銀子來，我就替他出這口氣。」", qs: "第15回", n: "這是收賄、包攬官司。錢來得快，代價還沒到。（原文是三千兩，遊戲中統一折算為三百兩）"},
      {t: "婉拒：這是官司，不是內宅該管的", best: 1, e: {f: -2, h: 2}, r: "老尼碰了個軟釘子。你少了一筆錢，也少了一樁禍。", n: "原著中鳳姐起初也說「太太再不管這樣的事」，是被老尼一激才接下。"},
      {t: "錢先收下，信卻不真的寫", e: {s: 300, f: -4, later: ["f_temple4", 2]}, r: "錢收了，信沒寫。張家遲早會發現。"},
      {t: "回王夫人，請長輩定奪", e: {en: -4, f: 2}, r: "王夫人說咱們家不管這樣的事，這件事就此作罷。"}
    ]},
  f_temple2: {who: "jing", src: "第15～16回", chain: 1, t: "金哥自縊", n: "張家父母貪圖權勢退了親，女兒金哥卻有情有義，聽說後上吊自盡；守備的兒子知道了，也投河殉情。",
    x: "雲老爺一封信，守備只得退親。誰知張金哥聽說父母退了前夫，一條麻繩上了吊；守備的公子聽說了，也投河死了。兩條人命，換來你的三百兩。",
    q: "誰知那張家父母如此愛勢貪財，卻養了一個知義多情的女兒，聞得父母退了前夫，他便一條麻繩悄悄的自縊了。那守備之子聞得金哥自縊，他也是個極多情的，遂也投河而死。", qs: "第16回",
    o: [
      {t: "再給老尼一筆錢，叫她閉嘴", e: {s: -80, en: -6, later: ["f_temple3", 3]}, r: "暫時壓住了。可兩家的仇，不會因此消失。"},
      {t: "拿出一半銀子，暗中送兩家辦後事", e: {s: -150, en: -4, h: 2}, r: "錢補不回人命，但兩家的恨意稍減，沒有再追究。"},
      {t: "把三百兩全數退回，向王夫人坦白", best: 1, e: {s: -300, c: 1, f: -8, clean: "temple"}, r: "王夫人又驚又怒，這一狀記在你頭上。但這件事總算了結了。", n: "承認錯誤要付代價，但能把把柄收回來。"},
      {t: "裝作不知道，什麼都不做", orig: 1, e: {en: -8, later: ["f_temple3", 2]}, r: "你照常過日子，膽子卻越來越大。", n: "鳳姐白得這筆錢（原文三千兩，遊戲中折算三百兩），王夫人一點也不知道。從此她膽子越來越大，類似的事就肆無忌憚地做下去。",
        q: "這裡鳳姐卻坐享了三千兩，王夫人等連一點消息也不知道。自此鳳姐膽識愈壯，以後有了這樣的事，便恣意的作為起來。", qs: "第16回"}
    ]},
  f_temple3: {who: "shou", src: "改編自第15・105回", chain: 1, t: "守備家告上衙門",
    x: "守備家死了兒子，越想越不甘心，打聽出是賈府的璉二奶奶託人寫的信，一紙狀子告上衙門。",
    o: [
      {t: "再花錢打點衙門，把案子壓下來", e: {debt: ["打點衙門的借款", 360, 3], en: -6}, r: "官司壓下來了，你卻欠了一屁股債，把柄也還在。"},
      {t: "推給旺兒，叫他頂罪", e: {h: -10, en: -6, clean: "temple"}, r: "旺兒替你頂了罪。下人們看在眼裡：跟著二奶奶，出了事就被丟出去。"},
      {t: "請娘家叔叔王子騰出面", e: {f: -8, en: -8, clean: "temple"}, r: "叔叔一句話，衙門撤了案。只是這份人情，日後要還。"},
      {t: "向王夫人坦白，退回贓銀", best: 1, e: {s: -300, c: 1, f: -6, clean: "temple"}, r: "王夫人嘆了口氣，替你收拾殘局。這一狀記在你頭上。"}
    ], n: "原著中，賈府這些仗勢弄權的事，直到第105回抄家時才一併爆發。"},
  f_temple4: {who: "jing", src: "改編自第15回", chain: 1, t: "張家來討說法",
    x: "張家等了兩個月，雲老爺那邊毫無動靜。老尼淨虛帶著張家的人找上門來討銀子。",
    o: [
      {t: "如數退回三百兩", best: 1, e: {s: -300, f: -4}, r: "錢退了，面子也丟了些，但事情了結了。"},
      {t: "這才寫信給雲老爺", orig: 1, e: {dirt: ["temple", "饅頭庵的三百兩"], later: ["f_temple2", 2]}, r: "信送出去了，守備只得退親……"},
      {t: "叫人把她們轟出去", e: {f: -10, c: 1}, r: "張家四處嚷嚷：賈府的奶奶收錢不辦事！"},
      {t: "推說信寫了，是雲老爺不肯", e: {en: -6, f: -4}, r: "張家半信半疑地走了，老尼卻不再信你。"}
    ]},
  f_bday: {who: "lian", src: "第44回", t: "生日宴上的醜事",
    x: "你的生日宴上多喝了幾杯，回房歇息，竟撞見賈璉趁你不在，把僕人鮑二的媳婦叫進房裡，兩人還在咒你早死。",
    o: [
      {t: "衝進去大鬧，連平兒一起打", orig: 1, e: {en: -10, h: -6, f: -8, rel: {ping: -3, lian: -2}, later: ["f_bao", 1]}, r: "你踢門撕打，又遷怒平兒，一路鬧到老太太跟前。",
        n: "原著中平兒無辜挨打，委屈得要尋死。把怒氣發在無辜的人身上，只會失去最忠心的幫手。"},
      {t: "不吵不鬧，去回老太太評理", e: {en: -10, f: -3, rel: {jia: 1, lian: -1}, later: ["f_bao", 1]}, r: "老太太笑著打圓場，反倒勸你別再生氣。",
        q: "賈母笑道：「什麼要緊的事！小孩子們年輕，饞嘴貓兒似的，那裡保得住不這麼著。從小兒世人都打這麼過的。」", qs: "第44回",
        n: "那個時代把丈夫偷腥當小事，連老太太都這麼說。王熙鳳連生氣，都找不到地方說理。"},
      {t: "隱忍不發，裝作沒看見", e: {en: -22, rel: {lian: 1}}, r: "你笑著回到席上。那天夜裡，你一個人坐到天亮。", n: "忍下來不代表沒事，傷害都記在心力裡。"},
      {t: "隔天冷靜地和賈璉把話說清楚", best: 1, e: {en: -12, f: 2, rel: {lian: -1}, later: ["f_bao", 1]}, r: "賈璉理虧，賠了不是。事情沒有鬧大，可你知道，這不會是最後一次。"}
    ]},
  f_bao: {who: "lin", src: "第44回", chain: 1, t: "鮑二家的上吊了",
    x: "鮑二家的羞愧難當，上吊死了。她娘家的親戚吵著要告官。",
    o: [
      {t: "「我沒一個錢！只管叫他告去」", orig: 1, e: {f: -10, c: 1, h: -6}, r: "娘家真的告了，鬧得滿城風雨。", n: "鳳姐說：我一個錢也沒有，有也不給！讓他去告，告不成反倒告他「拿死人訛詐」。強硬到底，不留餘地。",
        q: "鳳姐兒道：「我沒一個錢！有錢也不給，只管叫他告去。也不許勸他，也不用震嚇他，只管讓他告去。告不成倒問他個『以屍訛詐』！」", qs: "第44回"},
      {t: "給娘家二百兩，好好安葬", e: {s: -200, h: 4}, r: "事情平息了。原著中，是賈璉偷偷拿了二百兩去發送。"},
      {t: "請林之孝家的去勸，許他們幾個錢", best: 1, e: {s: -50, h: 2, f: -2}, r: "林之孝家的軟硬兼施，娘家答應不告了。", n: "林之孝家的說：我已經和大家一起勸過，又嚇唬了一頓、答應給些錢，他們就同意不告了。軟硬兼施，花小錢了結大事。",
        q: "林之孝家的道：「我才和眾人勸了他們，又威嚇了一陣，又許了他幾個錢，也就依了。」", qs: "第44回"},
      {t: "反告他們「以屍訛詐」", e: {f: -6, h: -10, en: -6, dirt: ["bao", "鮑二家的人命"]}, r: "官府看在賈府的面子上不收狀子，鮑家敢怒不敢言。"}
    ]},
  f_xiaoyue: {who: "ping", src: "第55回", t: "小產", n: "鳳姐小產，本該休養一個月，卻仗著身體好，躺在床上照樣盤算家事，誰勸都不聽。",
    x: "剛忙完年事，你便小產了。太醫說要靜養一個月，可府裡大小事，人人還等著你一句話。王夫人問：家務先交給誰？",
    q: "剛將年事忙過，鳳姐兒便小月了，在家一月，不能理事，天天兩三個太醫用藥。鳳姐兒自恃強壯，雖不出門，然籌畫計算，想起什麼事來，便命平兒去回王夫人，任人諫勸，他只不聽。", qs: "第55回",
    o: [
      {t: "硬撐著，躺在床上照樣籌畫", orig: 1, e: {en: -30, later: ["f_sick", 2]}, r: "你任人勸也不聽，身子一天天虧虛下去。"},
      {t: "讓探春代管，由她出頭整頓、得罪人", best: 1, e: {en: 30, h: 12, f: -3, exp: -12, set: "tanRule", later: ["f_tanBack", 2]}, r: "探春一上任就駁了你的舊例。你叫平兒「越恭敬越說駁的是」，眾人對你的怨氣，竟慢慢散了。",
        q: "鳳姐：「若按私心藏奸上論，我也太行毒了，也該抽回退步，回頭看看。再要窮追苦克，人恨極了，他們笑裡藏刀，偺們兩個，才四個眼睛兩個心，一時不防，倒弄壞了。趁著緊溜之中，他出頭一料理，眾人就把往日偺們的恨暫可解了。」", qs: "第55回",
        n: "這段正是課文〈賈探春敏慧興利〉的開端：鳳姐病了，探春才有機會改革。讓人分擔，不只是休息，也是化解積怨。探春代管期間，邢夫人不會來找碴，心力每月回復。"},
      {t: "交給大嫂李紈", e: {en: 25, h: 4, exp: 10}, r: "李紈心腸好，下人們卻趁機鬆懈，開銷又多了。", n: "原文說李紈重品德、不重才幹，難免放縱下人。好人不一定是好管理者。", q: "李紈是個尚德不尚才的，未免逞縱了下人。", qs: "第55回"},
      {t: "交給旺兒媳婦等心腹代辦", e: {en: 20, s: 80, h: -10, k: {debt: 1}}, r: "心腹們趁你不在撈了一筆，分你八十兩。下人們恨得牙癢。"}
    ]},
  f_sick: {who: "ping", src: "第55・72回", chain: 1, t: "下紅之症", n: "鳳姐本來氣血就不足，又不懂保養、凡事爭強，小產後身子虧虛，一個月後又添了婦科的病，卻不肯說出來。",
    x: "一個月後，你又添了下紅的病，面目黃瘦，卻不肯說出來。",
    q: "誰知鳳姐稟賦氣血不足，兼年幼不知保養，平生爭強鬪智，心力更虧，故雖系小月，竟著實虧虛下來，一月之後，復添了下紅之症。他雖不肯說出來，眾人看他面目黃瘦，便知失於調養。", qs: "第55回",
    o: [
      {t: "請太醫好好調養，事情暫交別人", best: 1, e: {en: 25, s: -40, h: 3}, r: "你總算肯歇下來了，氣色一天天好轉。"},
      {t: "瞞著不說，照常理事", orig: 1, e: {en: -20, f: 2}, r: "你在人前照樣說說笑笑，回房卻連坐都坐不住。", n: "第72回回目：「王熙鳳恃強羞說病」。"},
      {t: "這才讓探春代管", e: {en: 20, h: 8, set: "tanRule", later: ["f_tanBack", 2]}, r: "探春接手，府裡上下對你的怨氣，也跟著散了些。"},
      {t: "吃偏方，省得花錢請太醫", e: {en: -8, s: -5}, r: "偏方沒有用，病拖得更久。"}
    ]},
  f_tanBack: {who: "tan", src: "第55～56回", chain: 1, t: "探春交還家務",
    x: "你身子好些了。探春這幾個月蠲了重複的開銷、把大觀園包給老媽媽們管，帳目好看了不少。現在要把家務交還給你。",
    o: [
      {t: "收回大權，探春立下的新章程照樣施行", best: 1, e: {inc: 10, h: 4, unset: "tanRule"}, r: "好的制度留了下來。探春笑說：「還是二嫂子明白。」", n: "好的制度不因換人而廢，這才是真正的管理者。"},
      {t: "一切恢復我當家時的舊例", e: {exp: 12, h: -8, unset: "tanRule"}, r: "探春默默把帳交回。下人們說：又回到從前了。"},
      {t: "園子的事放手給探春，我只管大事", e: {en: 10, inc: 8, f: -4, unset: "tanRule"}, r: "你輕鬆不少，只是有人說你「權柄旁落」。"},
      {t: "挑幾件探春的錯處，重新立威", e: {h: -10, f: 3, en: -6, unset: "tanRule"}, r: "下人們又怕你了，也又恨你了。"}
    ]},
  f_er1: {who: "xinger", src: "第65～68回", t: "賈璉偷娶尤二姐",
    x: "你審問賈璉的小廝興兒，才知道：國孝家孝期間，賈璉在外頭偷偷娶了尤氏的妹妹尤二姐，在小花枝巷買了房子、置了丫頭，瞞了你半年。",
    o: [
      {t: "假意賢良把她接進府，暗中唆使她前夫張華告狀", orig: 1, e: {s: -20, en: -8, f: 4, dirt: ["er", "張華的狀子"], later: ["f_er2", 1]}, r: "你親自去接尤二姐，口口聲聲「妹妹」；另一頭，封了銀子給張華，叫他去告賈璉。", n: "鳳姐打聽清楚後，封了二十兩給旺兒，叫他把張華找來養著，再讓張華寫狀子去衙門告賈璉。表面上把人接進府，暗地裡借刀生事。",
        q: "鳳姐都一一盡知原委，便封了二十兩銀子與旺兒，悄悄命他將張華勾來養活，著他寫一張狀子，只管往有司衙門中告去。", qs: "第68回"},
      {t: "回老太太、太太，請長輩按禮處置", best: 1, e: {en: -12, f: -4, rel: {jia: 1, lian: -2}, later: ["f_er4", 2]}, r: "賈璉挨了一頓罵，尤二姐依禮接進府來安置。你吞下這口氣，至少沒有人因此送命。"},
      {t: "裝作不知道", e: {en: -25, later: ["f_er4", 2]}, r: "你每天看著賈璉找藉口出門……"},
      {t: "大鬧寧國府，逼賈珍、尤氏賠錢", e: {s: 200, f: -10, h: -4, en: -8, rel: {lian: -1}, later: ["f_er4", 2]}, r: "你衝到寧府，又哭又鬧，逼得賈珍、賈蓉賠了不是、拿出銀子。", n: "鳳姐衝進寧府，劈頭就說：「好大哥哥，帶著兄弟們幹的好事！」當面發難，逼對方理虧賠罪。",
        q: "鳳姐進來了，說：「好大哥哥，帶著兄弟們幹的好事！」", qs: "第68回"}
    ]},
  f_er2: {who: "zhang", src: "第68回", chain: 1, t: "張華的狀子",
    x: "張華真的告到都察院，說賈璉「國孝家孝之中，背旨瞞親，仗財依勢，強逼退親，停妻再娶」。衙門傳人去對詞，事情鬧大了。",
    o: [
      {t: "拿三百兩叫王信去打點察院", orig: 1, e: {s: -300, later: ["f_er3", 2]}, r: "察院收了銀子，只說張華無賴、以窮訛詐。尤二姐卻被嚇得不輕。", n: "鳳姐叫王信託察院只要虛張聲勢嚇唬一下，又拿三百兩去打點。告狀是她安排的，壓下案子的也是她。",
        q: "鳳姐……將王信喚來，告訴他此事，命他託察院只虛張聲勢警唬而已，又拿了三百銀子與他去打點。", qs: "第68回"},
      {t: "收手：給張華一筆錢，叫他撤狀回鄉", best: 1, e: {s: -100, clean: "er", later: ["f_er4", 1]}, r: "張華拿了錢走了，狀子總算收回。可尤二姐還住在府裡……"},
      {t: "順勢讓官府把尤二姐判還給張華", e: {f: -10, h: -6, en: -6, later: ["f_er3", 1]}, r: "賈璉氣得跳腳，尤二姐整天以淚洗面。"},
      {t: "把事情鬧到老太太跟前", e: {en: -10, f: -6, rel: {jia: -1}, later: ["f_er3", 2]}, r: "老太太嫌你把家醜鬧到外頭去。"}
    ]},
  f_er3: {who: "er", src: "第69回", chain: 1, t: "尤二姐病了",
    x: "尤二姐懷了身孕，卻病倒了。賈赦賞給賈璉的丫鬟秋桐仗著得寵，天天指桑罵槐。你若有心，正好「借劍殺人」。",
    o: [
      {t: "借秋桐的嘴，冷眼旁觀", orig: 1, e: {en: -6, h: -12, dirt: ["er2", "尤二姐之死"], rel: {lian: -2, ping: -1}}, r: "尤二姐受不住羞辱，吞金自盡。府裡的人表面不說，心裡都明白。",
        q: "弄小巧用借劍殺人　覺大限吞生金自逝", qs: "第69回回目", n: "原著中平兒偷偷拿錢給尤二姐弄飯吃，被秋桐告了一狀；尤二姐死後，平兒又偷出二百兩替她辦後事。"},
      {t: "請好大夫，叫平兒照看", best: 1, e: {s: -60, en: -10, h: 6, rel: {ping: 1, lian: 1}}, r: "尤二姐慢慢好起來。你很不甘心，但你守住了一條人命。"},
      {t: "約束秋桐，不許她再鬧", e: {en: -8, f: -2}, r: "秋桐收斂了些，背地裡卻罵你偏心。"},
      {t: "把尤二姐送出府另外安置", e: {s: -100, en: -6, f: -3, rel: {lian: -1}}, r: "眼不見為淨，只是又多了一份開銷。"}
    ]},
  f_er4: {who: "er", src: "第68～69回", chain: 1, t: "府裡多了兩個「二房」",
    x: "尤二姐住進了府裡，賈璉天天往她那裡去；賈赦又賞了丫鬟秋桐給賈璉。府裡一下多了兩個人，和你分丈夫、分體面。",
    o: [
      {t: "冷落她，叫下人剋扣她的飯菜", orig: 1, e: {h: -8, en: -4, later: ["f_er3", 1]}, r: "下人們看你的臉色行事，尤二姐的飯菜一天不如一天。", n: "鳳姐裝病不和尤二姐一起吃飯，叫人送去的飯菜都是難以下嚥的東西。表面客氣，暗中折磨。",
        q: "鳳姐既裝病，便不和尤二姐吃飯了。每日只命人端了菜飯到他房中去吃，那茶飯都系不堪之物。", qs: "第69回"},
      {t: "以禮相待，該給的分例一樣不少", best: 1, e: {en: -10, s: -20, h: 4}, r: "你心裡苦，面子上卻做得無可挑剔。"},
      {t: "叫賈璉自己去擺平", e: {en: -6, f: -2, rel: {lian: -1}}, r: "賈璉兩頭討好，兩頭不是人。"},
      {t: "請老太太作主", e: {en: -6, rel: {jia: 1}}, r: "老太太把規矩講清楚，大家暫時相安無事。"}
    ]},
  f_xia: {who: "eun", src: "第72回", t: "夏太監又來借錢", n: "小太監嘴上說以前借的一千二百兩年底會還，其實是一借再借，從來沒還過。",
    x: "夏太監打發小太監來說：買房子還短二百兩，先借一借。小太監還說：上兩回的一千二百兩，年底一齊送來。",
    q: "小太監道：「夏爺爺還說了，上兩回還有一千二百兩銀子沒送來，等今年年底下，自然一齊都送過來。」", qs: "第72回",
    o: [
      {t: "把自己的兩個金項圈押四百兩，一半給太監", orig: 1, e: {s: 200, f: 2, debt: ["贖回金項圈", 440, 3], k: {debt: 2}}, r: "太監拿了二百兩走了，另外二百兩挪去過中秋。三個月後，要四百四十兩才贖得回來。", n: "鳳姐叫平兒把自己兩個金項圈拿去押了四百兩，一半給太監，一半拿去過中秋。拿自己的首飾撐場面，撐得很辛苦。",
        q: "說著叫平兒，「把我那兩個金項圈拿出去，暫且押四百兩銀子。」……鳳姐命與小太監打疊起一半，那一半命人與了旺兒媳婦，命他拿去辦八月中秋的節。", qs: "第72回"},
      {t: "照借二百兩", e: {s: -200, f: 3}, r: "小太監滿意地走了，這錢大概不會回來。"},
      {t: "推說府裡沒錢", e: {f: -8, c: 1}, r: "宮裡的人不高興，有人怕得罪貴妃，告到太太那裡。"},
      {t: "借一百兩，客氣提一下舊帳", best: 1, e: {s: -100, f: -2}, r: "少借一半，也沒撕破臉。"}
    ]},
  f_xingShame: {who: "xingf", src: "第71回", t: "壽宴上，婆婆當眾給你沒臉", n: "邢夫人當著眾人「陪笑」替婆子求情：我本不該求情，但老太太大壽，連窮人都要接濟，咱們家倒先折磨起人來；不看我的面子，也看老太太的面子放了吧。表面客氣，其實是當眾說媳婦刻薄。",
    x: "老太太八十大壽，前一晚你捆了兩個對尤氏無禮的婆子。散席時，婆婆邢夫人當著眾人的面，陪笑替那兩個婆子求情。",
    q: "邢夫人直至晚間散時，當著許多人陪笑和鳳姐求情說：「……論理我不該討情，我想老太太好日子，發狠的還舍錢舍米，周貧濟老，咱們家先倒折磨起人家來了。不看我的臉，權且看老太太，竟放了他們罷。」", qs: "第71回",
    o: [
      {t: "當場笑著圓過去，回房再偷偷地哭", orig: 1, e: {en: -15, h: 2}, r: "你憋得臉紫漲，還是笑著打了圓場。回到房裡，眼淚止不住地掉。",
        n: "原文：「鳳姐聽了這話，又當著許多人，又羞又氣，一時抓尋不著頭腦，憋得臉紫漲。」"},
      {t: "當眾頂回去：這是寧府的事，與太太無關", e: {f: -12, c: 1, xg: 2}, r: "滿屋子的人都愣住了。媳婦頂撞婆婆，有人立刻告到王夫人那裡。"},
      {t: "順勢放了兩個婆子，人情做給婆婆", best: 1, e: {en: -6, h: 4, xg: -1}, r: "邢夫人找不到話說，下人們都說二奶奶有肚量。", n: "把對方的「刁難」變成自己的「人情」，是化解衝突的一招。"},
      {t: "事後去老太太跟前訴委屈", e: {en: -8, rel: {jia: 1}, xg: 1}, r: "老太太心疼你，可邢夫人更恨你了：仗著老太太撐腰！"}
    ]},
  f_yuanyang: {who: "yuan", src: "第72回", t: "銀子不湊手",
    x: "年下要用錢的地方一大堆，帳上卻挪不出來。賈璉想託老太太的大丫鬟鴛鴦，把老太太用不著的金銀器皿偷運出來，先當幾百兩銀子使。",
    o: [
      {t: "照辦，託鴛鴦偷運出來當", orig: 1, e: {s: 300, f: -4, debt: ["贖回老太太的東西", 380, 2], dirt: ["yuan", "偷當老太太的東西"], k: {debt: 3}}, r: "三百兩到手。可萬一老太太問起那箱東西……",
        n: "第72回，賈璉託鴛鴦偷運賈母的東西去當，鳳姐還趁機向賈璉討好處。拆東牆補西牆，牆總有拆完的一天。"},
      {t: "當掉自己的嫁妝首飾", e: {s: 150, en: -6, debt: ["贖回嫁妝首飾", 180, 3], k: {debt: 1}}, r: "自己的東西自己當，至少不連累別人。"},
      {t: "各房用度一律裁減兩成", e: {exp: -15, h: -12, k: {tight: 2}}, r: "帳是省下來了，各房的怨氣全衝著你來。"},
      {t: "向王夫人據實稟明虧空", best: 1, e: {f: -6, h: 2, s: 100}, r: "王夫人沉默半晌，拿出自己的體己一百兩，叫你往後再想法子。", n: "把真實的帳攤開，雖然丟臉，卻能換來幫助，也不會越陷越深。"}
    ]},
  f_leak: {who: "lian", src: "第16回（改編）", chain: 1, t: "利錢露了餡",
    x: "旺兒媳婦偏偏挑賈璉在家的時候送利錢來，被賈璉撞個正著：「什麼利錢？」",
    o: [
      {t: "叫平兒撒個謊遮過去", orig: 1, e: {en: -5, rel: {ping: -1}, relaunch: 2}, r: "平兒急中生智，說是薛姨媽打發香菱來了。混過去了，可下次呢？", n: "平兒說：還好是我在堂屋撞見；要是二爺問起利錢，奶奶又不肯瞞他，就得照實說了。我們二爺連油鍋裡的錢都要撈出來花。",
        q: "平兒悄悄的說道：「……幸虧我在堂屋裡撞見，不然時走了來回奶奶，二爺倘或問奶奶是什麼利錢，奶奶自然不肯瞞二爺的，少不得照實告訴二爺。我們二爺那脾氣，油鍋裡的錢還要找出來花呢。」", qs: "第16回"},
      {t: "就此收手，把借券燒了", best: 1, e: {unset: "usury", clean: "usury", h: 4}, r: "少了一筆進帳，卻也少了一個把柄。"},
      {t: "分賈璉一份，堵他的嘴", e: {s: -60, rel: {lian: 1}, relaunch: 3}, r: "賈璉拿了錢，什麼也不問了。知道的人，又多了一個。"},
      {t: "不但不收，還要加碼多放", e: {s: 80, en: -4, relaunch: 1}, r: "利錢更多了，風聲也更緊了。"}
    ]},
  f_harvest: {who: "wu2", src: "第53回", t: "年終：田莊交租", n: "莊頭說：九月一場像碗那麼大的冰雹，方圓一千多里，人、房子、牲口、糧食都被打壞了。",
    x: "莊頭烏進孝來交租，報說今年九月一場碗大的雹子，莊稼打壞了，租子比預期少了一百五十兩。",
    pre: {s: -150},
    q: "九月裡一場碗大的雹子，方近一千三百里地，連人帶房並牲口糧食，打傷了上千上萬的。", qs: "第53回（烏進孝）",
    o: [
      {t: "動用存下的庫銀，照常過年", best: 1, e: {k: {open: 1}}, r: "還好平時有存下錢，這一關撐過去了。", n: "收入本來就會有起落，這就是要存預備金的原因。"},
      {t: "年節照樣辦得熱熱鬧鬧", orig: 1, e: {s: -100, f: 8, k: {face: 3}}, r: "外人只看到賈府風光依舊。", n: "鳳姐自己說過：「多儉省了，外人又笑話，老太太、太太也受委屈。」面子，是最難省的一筆錢。"},
      {t: "叫旺兒媳婦去外頭放一筆急帳，年後收回", e: {s: 120, dirt: ["usury", "放利錢的借券"], k: {debt: 3}}, r: "年前就收回一筆利錢。只是借券上，又多了你的名字。"},
      {t: "年節從簡，各房的賞減半", e: {s: 60, h: -8, f: -5, k: {tight: 2}}, r: "下人們過了個冷清的年。"}
    ]},
  // ----- 王熙鳳模式的隨機事件 -----
  f_yun: {who: "yun", src: "第24回", t: "賈芸求差事",
    x: "族中子侄賈芸提了冰片、麝香來孝敬，想求一份園中種樹的差事。",
    o: [
      {t: "收下禮，差事派給他", orig: 1, e: {s: 30, h: -2}, r: "禮折了三十兩。旁人說：想在二奶奶這裡辦事，先得送禮。", n: "原著中賈芸向舅舅賒香料不成，借了錢買冰片麝香送鳳姐，才換到種樹的差事。"},
      {t: "退回禮物，先看他能不能辦事", best: 1, e: {h: 3, f: 2}, r: "賈芸把樹種得極好。下人們說：二奶奶看的是本事。"},
      {t: "差事派給出價更高的人", e: {s: 60, h: -6, k: {debt: 1}}, r: "錢更多了，樹卻種得七零八落。"},
      {t: "立規矩：一律不准送禮，差事公開挑人", e: {h: 5, en: -3}, r: "求差事的人少了送禮的門路，多了公平的機會。"}
    ]},
  f_hong: {who: "hong", src: "第27回", t: "伶俐的小丫頭",
    x: "你在園中差遣寶玉房裡的小丫頭紅玉傳話，她口齒伶俐，一大串話傳得一字不差。",
    o: [
      {t: "要來自己身邊栽培", orig: 1, best: 1, e: {en: 6, h: 2}, r: "多了一個得力的幫手，你也輕鬆了些。",
        q: "紅玉笑道：「願意不願意，我們也不敢說。只是跟著奶奶，我們也學些眉眼高低，出入上下，大小的事也得見識見識。」", qs: "第27回", n: "會用人、肯培養人，管理者才不會什麼都自己扛。"},
      {t: "賞她幾錢銀子就好", e: {s: -2, h: 1}, r: "小紅謝了賞，回去了。"},
      {t: "外人信不過，只用自己的陪房", e: {en: -3}, r: "事情還是全壓在你身上。"},
      {t: "叫她去管帳房", e: {exp: 3, h: -2}, r: "小丫頭管不動老帳房，反而亂了套。"}
    ]},
  f_huan: {who: "huan", src: "第20回", t: "賈環賭錢耍賴",
    x: "賈環和丫頭們擲骰子，輸了耍賴，被說了兩句，哭著跑回去；趙姨娘又在屋裡罵個不停。",
    o: [
      {t: "隔窗喝住趙姨娘，再給賈環一吊錢叫他去玩", orig: 1, best: 1, e: {s: -1, f: 3, h: -2}, r: "趙姨娘不敢再吭聲，賈環拿了錢走了。", n: "原著中鳳姐隔窗教訓趙姨娘，又叫人給了賈環一吊錢。她管得住，也不讓小孩子太難堪。"},
      {t: "不管：那是趙姨娘屋裡的事", e: {f: -4}, r: "罵聲傳遍半個府，老太太都聽見了。"},
      {t: "罰賈環", e: {h: -3}, r: "賈環更恨你了，趙姨娘也是。"},
      {t: "叫趙姨娘自己管好兒子", e: {f: -2, h: -2}, r: "趙姨娘管不住，反而鬧得更大。"}
    ]},
  f_xiren: {who: "xiren", src: "第51回", t: "襲人回家探母",
    x: "襲人的母親病重，她要回家探望。她是寶玉房裡的大丫頭，出門的體面代表賈府。",
    o: [
      {t: "拿自己的皮褂子給她穿，車馬人手備齊", orig: 1, best: 1, e: {s: -10, f: 6, h: 4}, r: "襲人體體面面地回家，人人都說二奶奶會辦事。", n: "原著中鳳姐把自己的皮褂子給了襲人。小錢花在刀口上，換來的是體面和人心。"},

      {t: "叫她自己雇車回去", e: {s: 2, f: -6}, r: "外人說：賈府的大丫頭怎麼這樣寒酸？"},
      {t: "大張旗鼓，多派十幾個人", e: {s: -30, f: 4, k: {face: 2}}, r: "陣仗是大了，錢也花多了。"}

  f_jiaFun: {who: "jia", src: "第40回", t: "老太太要熱鬧",

      {t: "大擺宴席，再請一班戲", e: {s: -80, f: 8, k: {face: 2}}, r: "熱鬧極了，帳也難看極了。"},
      {t: "推說太忙", e: {f: -6, rel: {jia: -1}}, r: "老太太有些不高興。"},
      {t: "交給下人去辦", e: {s: -30, f: 2}, r: "辦得中規中矩，老太太說：「鳳丫頭怎麼沒來？」"}
    ]}

function planMonth() {
  const fixed = (FIXED[G.m] || []).filter(id => !EV[id].need || G.flag[EV[id].need]);
  const due = G.queue.filter(q => q.at <= G.m).map(q => q.id);
  G.queue = G.queue.filter(q => q.at > G.m);
  const cards = [...fixed];
  // 放利錢：放得越久越容易出事；推託或否認之後，下個月就抄檢大觀園
  if (G.flag.raid || G.flag.hush) { delete G.flag.raid; delete G.flag.hush; cards.push("raid"); }
  else if (G.flag.usury && G.m >= G.leakAt) { if (MODE === "feng") { cards.push("f_leak"); G.leakAt = 99; } else cards.push("leak"); }
  // 本月到期的債一定要處理（可能讓這個月多一件事）
  G.debts.filter(x => x.due === G.m && G.m <= 12).forEach(x => cards.push(dunCard(x)));
  while (cards.length < 2 && due.length) cards.push(due.shift());
  due.forEach(id => G.queue.push({id, at: G.m + 1}));
  while (cards.length < 2) cards.push(drawRandom());
  G.cards = cards.filter(Boolean);
  G.ci = 0;
}
function drawRandom() {
  const pool = RANDOM.filter(id => !G.used.has(id) && (!EV[id].need || G.flag[EV[id].need]));
  if (!pool.length) return null;
  const id = rnd(pool);
  G.used.add(id);
  return id;
}

    const r = failReason();
    if (r) return finish(r);
    if (fin) {
      G.s -= G.owe + debtSum(); G.debts = [];
      if (G.flag.usury || G.flag.raid || G.flag.hush) { G.s -= G.usuryGain || 0; G.usuryGain = 0; G.c += 1; G.f = clamp(G.f - 20); ["usury", "raid", "hush"].forEach(k => delete G.flag[k]); }

      const r2 = failReason(); if (r2) return finish(r2);
      const ok = G.s >= START.s && G.f >= 50 && G.h >= 50;
      return finish(MODE === "feng" ? (ok ? (G.taint ? "f_taint" : "f_win") : "f_meh") : ok ? (G.taint ? "taint" : "win") : "meh"); }
    G.m++; planMonth(); renderSide(); renderCard();
  };
}

// 月結：本月收支橫條（虛線是原本的帳）＋庫銀逐月長條（虛線是原始帳目）
function settleCharts(net) {
  const max = Math.max(G.inc, G.exp, BASE_INC, BASE_EXP) * 1.1, w = v => (v / max * 100).toFixed(1);
  const row = (label, v, base, cls) => `<div class="hrow"><span>${label}</span><div class="htrack"><i class="${cls}" style="width:${w(v)}%"></i><b class="mark" style="left:${w(base)}%" title="原本 ${base} 兩"></b></div><em>${v} 兩<small>原本 ${base}</small></em></div>`;
  const hi = Math.max(START.s * 1.6, ...G.trace.map(t => t.s)), H = 120;
  const bars = G.trace.map((t, i) => {
    const h = Math.max(2, Math.max(0, t.s) / hi * H), up = t.s >= START.s;
    return `<div class="vcol"><em>${t.s}</em><i class="${up ? "up" : "down"}" style="height:${h}px;animation-delay:${i * 0.05}s"></i><span>${i === 0 ? "開始" : i + "月"}</span></div>`;
  }).join("");
  return `<div class="schart"><div class="stitle">本月收支</div>${row("收入", G.inc, BASE_INC, "inc")}${row("支出", G.exp, BASE_EXP, "exp")}</div>
    <div class="schart"><div class="stitle">庫銀逐月變化<small>虛線＝原始帳目 ${START.s} 兩</small></div>
      <div class="vbars" style="height:${H + 44}px"><b class="base" style="bottom:${START.s / hi * H + 18}px"></b>${bars}</div></div>`;
}

// ===== 換算分數（滿分 100）=====
// 基本分 40（玩完一輪就有）＋每撐完一個月 2.5 分（最多 30）＋庫銀 12＋體面人心 18；
// 探春模式有污點扣 5，王熙鳳模式每個把柄扣 3（最多扣 15）。中途出局也拿得到分數；
// 撐滿一年只是 70 分起跳，帳要翻倍、體面人心都接近滿分才拿得到 100。
const DONE_KEYS = new Set(["win", "f_win", "taint", "f_taint", "meh", "f_meh"]);
function calcScore(key) {
  const months = DONE_KEYS.has(key) ? 12 : Math.max(0, G.m - 1);
  const p = {
    base: 40,
    surv: Math.round(months * 2.5),
    // 庫銀：達到起始金額 7 分，賺到起始金額的兩倍才拿滿 12 分
    money: Math.round(G.s <= 0 ? 0 : G.s < START.s ? 7 * G.s / START.s : 7 + 5 * Math.min(1, (G.s - START.s) / START.s)),
    // 體面人心：兩項平均 30 以下 0 分，平均 100 才拿滿 18 分
    fh: Math.round(18 * Math.max(0, (G.f + G.h) / 2 - 30) / 70),
    dirt: MODE === "feng" ? -Math.min(15, 3 * G.dirtLog.length) : G.taint ? -5 : 0
  };
  p.total = Math.max(0, Math.min(100, p.base + p.surv + p.money + p.fh + p.dirt));
  p.months = months;
  return p;
}

function downloadCsv() {

  const blob = new Blob(["\ufeff" + [head.map(q).join(","), ...lines].join("\r\n")], {type: "text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = `大觀園理家記成績_${twDate()}.csv`;

async function fetchStats(token) {
  const rows = [];
  let page = "";
  do {
    const r = await fetch(`${FS}${FB_DOCS}/rb?pageSize=300${page ? "&pageToken=" + page : ""}`, {headers: {Authorization: "Bearer " + token}});
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    (j.documents || []).forEach(d => rows.push({c: d.fields.c.stringValue, d: d.fields.d.stringValue, n: +d.fields.n.integerValue}));
    page = j.nextPageToken || "";
  } while (page);
  return rows;
}
function renderStats(rows) {

}

function startTour() { ti = 0; closeSay(); $("tour").classList.add("on"); tourStep(); }
function endTour() { $("tour").classList.remove("on"); try { localStorage.setItem("rb-tour", "1"); } catch (e) {} }
function tourStep() {
  const st = TOUR[ti], el = st.sel ? document.querySelector(st.sel) : null;
  if (st.sel && !el) { if (++ti < TOUR.length) return tourStep(); return endTour(); }
  if (el) el.scrollIntoView({block: "center", behavior: "instant"});
  const last = ti === TOUR.length - 1;
  $("tTip").innerHTML = `<div class="tstep">操作說明　${ti + 1}／${TOUR.length}</div><h3>${st.t}</h3><p>${st.x}</p>

  $("tSkip").onclick = endTour;
  if (ti) $("tPrev").onclick = () => { ti--; tourStep(); };
  $("tNext").onclick = () => { if (last) return endTour(); ti++; tourStep(); };
  requestAnimationFrame(() => tourPlace(el));
}
function tourPlace(el) {
  const hole = $("tHole"), tip = $("tTip"), vw = innerWidth, vh = innerHeight, pad = 8;
  if (!el) { hole.style.cssText = `left:${vw / 2}px;top:${vh / 2}px;width:0;height:0`; tip.style.cssText = `left:${Math.max(12, (vw - tip.offsetWidth) / 2)}px;top:${Math.max(12, (vh - tip.offsetHeight) / 2)}px`; return; }
  const r = el.getBoundingClientRect();
  hole.style.cssText = `left:${r.left - pad}px;top:${r.top - pad}px;width:${r.width + pad * 2}px;height:${r.height + pad * 2}px`;
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let left, top;
  if (r.left > vw / 2 && r.left - tw - 24 > 0) { left = r.left - tw - 24; top = r.top + r.height / 2 - th / 2; }      // 右側的區塊：提示放左邊
  else if (r.bottom + th + 24 < vh) { left = r.left; top = r.bottom + 20; }                                             // 放下面
  else { left = r.left; top = r.top - th - 20; }                                                                         // 放上面
  tip.style.cssText = `left:${Math.max(12, Math.min(vw - tw - 12, left))}px;top:${Math.max(12, Math.min(vh - th - 12, top))}px`;
}

  };
  // 低沉的鼓（選錯時）
  const drum = (t, vol) => {
    const o = ctx.createOscillator(), g = ctx.createGain(), lp = ctx.createBiquadFilter();
    o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.4);
    lp.type = "lowpass"; lp.frequency.value = 400;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
    o.connect(lp); lp.connect(g); g.connect(sfx); o.start(t); o.stop(t + 0.55);
  };
  // 殘響：用衰減的噪音做出廳堂的空間感
  const makeVerb = () => {
    const sr = ctx.sampleRate, len = Math.floor(sr * 2.4), ir = ctx.createBuffer(2, len, sr);
    for (let c = 0; c < 2; c++) { const a = ir.getChannelData(c); for (let i = 0; i < len; i++) a[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
    const cv = ctx.createConvolver(); cv.buffer = ir;
    const wet = ctx.createGain(); wet.gain.value = 0.35;
    cv.connect(wet); wet.connect(master);
    return cv;
  };
  const init = () => {
    if (ctx) return true;
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return false;
    ctx = new C();
    master = ctx.createGain(); master.gain.value = on ? 1 : 0; master.connect(ctx.destination);
    verb = makeVerb();
    // 背景音樂先過低通濾波再出聲，去掉刺耳的高頻
    const soft = ctx.createBiquadFilter(); soft.type = "lowpass"; soft.frequency.value = 1600; soft.Q.value = 0.5;
    soft.connect(master); soft.connect(verb);
    music = ctx.createGain(); music.gain.value = MUSIC_VOL; music.connect(soft);
    sfx = ctx.createGain(); sfx.gain.value = 0.8; sfx.connect(master); sfx.connect(verb);
    SC.forEach(f => { ks(f); ks(f / 2); ks(f / 4); ks(f * 0.75); }); SCM.forEach(f => ks(f / 2)); BASS.forEach(f => { ks(f, 3, 0.15); ks(f / 2, 3, 0.15); });
    return true;
  };
  // 依目前氣氛播放：8 小節循環，偶爾換音
  const mdrum = (t, vol) => {
    const o = ctx.createOscillator(), g = ctx.createGain(), lp = ctx.createBiquadFilter();
    o.frequency.setValueAtTime(95, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.35);
    lp.type = "lowpass"; lp.frequency.value = 300;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
    o.connect(lp); lp.connect(g); g.connect(music); o.start(t); o.stop(t + 0.5);
  };
  const tick = () => {
    const S = SETS[cur], beat = 60 / S.bpm / 2;
    while (nextT < ctx.currentTime + 0.3) {
      const bar = Math.floor(step / 8) % 8, pos = step % 8;
      if (fileOk(cur)) { step++; nextT += beat; continue; }
      let n = S.mel[bar][pos];
      if (n >= 0 && cur === "light" && Math.random() < 0.1) n = Math.max(0, Math.min(9, n + (Math.random() < 0.5 ? -1 : 1)));
      if (n >= 0) pluck(S.sc[n] / 2, nextT + Math.random() * 0.012, cur === "tense" ? 0.24 : 0.3);
      if (S.chord && n >= 0 && pos % 4 === 0) { pluck(S.sc[n] / 2 * 1.5, nextT + 0.02, 0.14); pluck(S.sc[n] / 4, nextT, 0.18, music, 3, 0.15); }
      if (pos === 0) pluck(S.bass[bar] / 2, nextT, 0.28, music, 3, 0.15);
      if (pos === 4) pluck(S.bass[bar], nextT, 0.14, music, 3, 0.15);
      if (S.wood.includes(pos)) wood(nextT, 0.025);
      if (S.drum.includes(pos)) mdrum(nextT, S.dv);
      step++; nextT += beat;
    }
  };
  const api = {
    start() {
      if (!init()) return;
      ctx.resume();
      if (!timer) { nextT = ctx.currentTime + 0.1; timer = setInterval(tick, 80); loadFiles(); }
      fadeFiles();
    },
    toggle() {
      on = !on;
      try { localStorage.setItem("rb-sound", on ? "1" : "0"); } catch (e) {}
      if (init()) { ctx.resume(); master.gain.setTargetAtTime(on ? 1 : 0, ctx.currentTime, 0.05); api.start(); }
      fadeFiles();
      return on;
    },
    isOn: () => on,
    // 換氣氛：從下一個小節開始換曲
    mood(m) { if (m === cur || !SETS[m]) return; cur = m; step = Math.ceil(step / 8) * 8 % 64; fadeFiles(); },
    good() { if (!ctx) return; const t = ctx.currentTime; [4, 7, 9].forEach((n, i) => pluck(SC[n], t + i * 0.08, 0.45, sfx)); },
    bad() { if (!ctx) return; const t = ctx.currentTime; drum(t, 0.6); pluck(SC[1] / 2, t + 0.05, 0.4, sfx, 2.2, 0.3); pluck(SC[2] / 2 * 0.944, t + 0.05, 0.3, sfx, 2.2, 0.3); },
    tick() { if (!ctx) return; pluck(SC[5], ctx.currentTime, 0.3, sfx); },
    coin() { if (!ctx) return; const t = ctx.currentTime; pluck(SC[9] * 2, t, 0.22, sfx, 1.2, 0.8); pluck(SC[7] * 2, t + 0.09, 0.2, sfx, 1.2, 0.8); },
    win() { if (!ctx) return; const t = ctx.currentTime; [0, 2, 4, 5, 7, 9].forEach((n, i) => pluck(SC[n], t + i * 0.1, 0.45, sfx)); },
    lose() { if (!ctx) return; const t = ctx.currentTime; [5, 4, 2, 0].forEach((n, i) => pluck(SC[n] / 2, t + i * 0.28, 0.45, sfx, 2.6, 0.3)); },
    // 趙姨娘：音樂壓低，播放柔和的雙音警笛（喔咿喔咿），直到處理完
    tenseStart() {
      if (!ctx) return;
      api.tenseStop();
      const t = ctx.currentTime;
      music.gain.setTargetAtTime(0.08, t, 0.08);
      duck = 0.2; fadeFiles();
      const o = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain(), lp = ctx.createBiquadFilter();
      o.type = "triangle"; o2.type = "sine";
      lp.type = "lowpass"; lp.frequency.value = 1800;
      const hi = 760, lo = 600, half = 0.42;
      for (let i = 0; i < 80; i++) {
        const f = i % 2 ? lo : hi, at = t + i * half;
        o.frequency.setTargetAtTime(f, at, 0.05); o2.frequency.setTargetAtTime(f * 2, at, 0.05);
      }
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.09, t + 0.25);
      const g2 = ctx.createGain(); g2.gain.value = 0.25;
      o.connect(lp); o2.connect(g2); g2.connect(lp); lp.connect(g); g.connect(sfx);
      o.start(t); o2.start(t);
      siren = {o, o2, g};
    },
    tenseStop() {
      if (!ctx) return;
      if (siren) { const t = ctx.currentTime; siren.g.gain.setTargetAtTime(0.0001, t, 0.1); siren.o.stop(t + 0.6); siren.o2.stop(t + 0.6); siren = null; }
      music.gain.setTargetAtTime(MUSIC_VOL, ctx.currentTime, 0.4);
      duck = 1; fadeFiles();
    }
  };
  return api;
})();
$("sayOk").onclick = closeSay;
$("say").onclick = e => { if (e.target.id === "say") closeSay(); };
const sndLabel = () => { $("snd").textContent = AU.isOn() ? "♪ 聲音：開" : "♪ 聲音：關"; };
$("snd").onclick = () => { AU.toggle(); sndLabel(); };
sndLabel();
$("startTan").onclick = () => startGame(true, "tan");
renderHome();
// 預先載入立繪；飄動的金色光點
ART.forEach(k => { const im = new Image(); im.src = `art/${k}.webp`; });
$("embers").innerHTML = Array.from({length: 18}, () =>
  `<i style="left:${Math.random() * 100}%;animation-duration:${8 + Math.random() * 10}s;animation-delay:${-Math.random() * 18}s;transform:scale(${0.5 + Math.random()})"></i>`).join("");
</script>
