<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>說話的棋局</title>
<style>
:root{
  /* 晴空配色：投影用，亮底深字，不用米白 */
  /* 淺灰底＋多彩點綴：投影用，亮底深字，不用米白 */
  --page:#f2f3f5;--card:#ffffff;--ink:#1d2433;--muted:#5a6475;--line:#dde1e7;
  --brand:#2b6fd6;--accent:#ff6b3d;--accent2:#ffc928;--green:#22a36a;--mint:#e2f7ee;--mintline:#22a36a;--dark:#2a3245;
  --gold:var(--accent);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-weight:600;overscroll-behavior:none}
body{background:var(--page)}
#app{max-width:860px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;background:var(--page)}
code{background:#e9ecf1;padding:1px 6px;border-radius:5px;color:var(--brand)}
/* 上方狀態列 */
#hud{display:flex;gap:12px;align-items:center;padding:10px 14px;background:#fff;color:var(--ink);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line);box-shadow:0 2px 8px rgba(29,36,51,.06)}
#hud .ttl{font-size:15px;white-space:nowrap;font-weight:800}
.meter{flex:1;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800}
.meter .bar{flex:1;height:14px;background:#e6e8ec;border-radius:7px;overflow:hidden;position:relative}
.meter .bar i{display:block;height:100%;width:50%;border-radius:7px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.meter.r .bar i{background:linear-gradient(90deg,#ff6b3d,#ff9b6e)}
.meter.g .bar i{background:linear-gradient(90deg,#f5b700,#ffd75a)}
.meter .d{min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
.meter .d.up{color:var(--green)}.meter .d.dn{color:#e04848}
.meter.r>span:first-child{color:#e8552a}.meter.g>span:first-child{color:#c48f00}
#hud .mode{font-size:13px;color:var(--ink);background:var(--accent2);padding:2px 9px;border-radius:6px;white-space:nowrap;font-weight:800}
body.hard #hud .mode{background:var(--accent);color:#fff}
body.hard #hud .meter{display:none}
body.hard #hud .ttl{flex:1}
/* 舞台 */
#stage{position:relative;flex:1;min-height:46vh;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;background:var(--grad)}
#stage.bgA{--grad:linear-gradient(180deg,#ffb88c 0%,#ffd9a8 45%,#9ec9ff 100%)}
#stage.bgB{--grad:linear-gradient(180deg,#9cc4ff 0%,#d9e8ff 60%,#f2f3f5 100%)}
#stage.img{background-size:cover;background-position:center 40%;flex:0 0 auto;height:min(52vh,460px);min-height:0}
#scene{position:absolute;top:10px;left:14px;right:14px;font-size:14px;color:var(--ink);background:rgba(255,255,255,.82);padding:6px 12px;border-radius:999px;line-height:1.5;z-index:2;width:fit-content;max-width:calc(100% - 28px)}
#char{width:min(56vw,300px);height:auto;margin-bottom:-6px;filter:drop-shadow(0 8px 16px rgba(19,38,74,.3));transition:transform .25s}
img#char{object-fit:contain;position:relative;z-index:1}
img#char.art{width:auto;height:94%;max-width:92%;margin-bottom:0}
#char.shake{animation:shake .4s}
@keyframes shake{0%{transform:translateX(0)}25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}100%{transform:translateX(0)}}
#char.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
/* 對話框 */
#dlg{background:var(--card);border-top:4px solid var(--accent);padding:16px 18px 12px;min-height:120px;position:relative;box-shadow:0 -4px 16px rgba(19,38,74,.12)}
#who{position:absolute;top:-18px;left:14px;background:var(--accent);color:#fff;padding:3px 16px;border-radius:8px;font-size:15px;font-weight:800;letter-spacing:.05em;box-shadow:0 2px 6px rgba(255,107,61,.35)}
#who.me{background:var(--dark)}
#say{font-size:clamp(18px,4.6vw,23px);line-height:1.55;white-space:pre-line;min-height:3.1em;margin-top:6px;color:var(--ink)}
/* 選項 */
#opts{padding:10px 14px 18px;display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--card);border:2px solid var(--line);color:var(--ink);padding:11px 13px;border-radius:12px;font:inherit;font-size:clamp(16px,4vw,19px);line-height:1.45;cursor:pointer;transition:background .15s,border-color .15s,transform .1s;box-shadow:0 2px 0 rgba(31,95,191,.08)}
.opt:hover{background:#f7f8fa;border-color:var(--dark)}.opt:active{transform:scale(.99)}
.opt b{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-size:14px;color:#fff}
.opt:nth-of-type(2) b{background:#f5b700}.opt:nth-of-type(3) b{background:var(--green)}.opt:nth-of-type(4) b{background:var(--brand)}
.opt.q{border-color:var(--accent)}
#opts .hint{font-size:15px;color:var(--accent);margin:0 2px;font-weight:800}
/* 軍師卡 */
#coach{position:fixed;inset:0;background:rgba(29,36,51,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
#coach.on{display:flex}
#coach .card{width:100%;max-width:860px;background:var(--card);color:var(--ink);border-radius:20px 20px 0 0;border-top:8px solid var(--accent);padding:18px 20px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(19,38,74,.3);animation:up .25s ease-out;max-height:82vh;overflow:auto}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#coach .tag{display:inline-block;color:#fff;padding:3px 12px;border-radius:6px;font-size:14px;margin-bottom:8px}
#coach h3{margin:4px 0 8px;font-size:22px;color:var(--ink)}
#coach p{margin:6px 0;line-height:1.65;font-size:17px}
#coach .src{background:var(--mint);border-left:5px solid var(--mintline);padding:8px 12px;border-radius:0 8px 8px 0;font-size:16px}
#coach .th{color:var(--muted);font-size:15px}
#coach .delta{display:flex;gap:14px;margin:8px 0;font-size:16px}
#coach .delta span{padding:2px 12px;border-radius:999px;background:#e6edf7}
#coach .delta .up{background:#d4f5e3;color:#13603a}#coach .delta .dn{background:#ffe0d6;color:#a3301a}
#coach button{margin-top:12px;width:100%;background:var(--dark);color:#fff;border:0;padding:13px;border-radius:12px;font:inherit;font-weight:800;font-size:18px;cursor:pointer}
/* 模式色 */
.m攻,#coach .tag.m攻{background:#e04848;color:#fff}.m讓,#coach .tag.m讓{background:#2f8fd6;color:#fff}.m避,#coach .tag.m避{background:#7a8494;color:#fff}.m合,#coach .tag.m合{background:#22a36a;color:#fff}
/* 封面與結局 */
.page{padding:22px 18px calc(24px + env(safe-area-inset-bottom));line-height:1.75;font-size:17px}
.page h1{font-size:32px;margin:8px 0 2px;color:var(--ink)}
.page h2{font-size:21px;margin:20px 0 6px;color:var(--accent)}
.page .sub{color:var(--muted);margin-bottom:14px}
.page b{color:var(--accent)}
.page .btn{display:block;width:100%;background:var(--accent);color:#fff;border:0;padding:14px;border-radius:12px;font:inherit;font-weight:800;font-size:18px;cursor:pointer;margin-top:12px;box-shadow:0 3px 0 #d94f24}
.page .btn.alt{background:var(--dark);box-shadow:0 3px 0 #161b26}
.page ul{padding-left:22px;margin:6px 0}
.page .goal{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.page .goal b{color:var(--accent)}
.seg{display:flex;gap:8px;margin:8px 0 4px}
.seg button{flex:1;background:var(--card);border:2px solid var(--line);color:var(--ink);padding:10px;border-radius:10px;font:inherit;font-weight:800;font-size:16px;cursor:pointer}
.seg button.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.note{background:var(--card);border-left:5px solid var(--accent);padding:10px 14px;border-radius:0 10px 10px 0;margin:14px 0;font-size:16px;line-height:1.75}
.scen{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.scen .st{font-size:19px;color:var(--ink);font-weight:800;padding-left:12px;border-left:6px solid var(--accent)}
.scen:nth-of-type(6n+2) .st{border-color:#f5b700}.scen:nth-of-type(6n+3) .st{border-color:var(--green)}.scen:nth-of-type(6n+4) .st{border-color:var(--brand)}.scen:nth-of-type(6n+5) .st{border-color:#9b6cf2}.scen:nth-of-type(6n) .st{border-color:#ef5da8}
.scen .sd{font-size:15px;color:var(--muted);margin:2px 0 6px}
.scen .sb .btn{margin-top:8px;padding:11px;font-size:17px}
/* 結局象限圖 */
.quad{width:min(92vw,380px);margin:14px auto 6px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 8px 8px;box-shadow:0 4px 14px rgba(29,36,51,.07)}
.quad svg{display:block;width:100%;height:auto;font-family:inherit}
.quad .qc{opacity:.75;transition:opacity .4s}.quad .qc.on{opacity:1;stroke:#1d2433;stroke-width:1.5}
.quad .ql{font-size:11.5px;font-weight:700;fill:#5a6475}.quad .ql.on{fill:#1d2433;font-size:12.5px;font-weight:800}
.quad .mid{stroke:#b8bfcb;stroke-width:1;stroke-dasharray:4 4}
.quad .axis{stroke:#1d2433;stroke-width:1.6}
.quad .at{font-size:13px;font-weight:800;fill:#1d2433}
.quad .tk{font-size:10.5px;font-weight:700;fill:#8a93a3}
.quad .path{fill:none;stroke:#ff6b3d;stroke-width:2;stroke-dasharray:5 4;stroke-linejoin:round;stroke-linecap:round;opacity:.85}
.quad .step{fill:#fff;stroke:#ff6b3d;stroke-width:2}.quad .start{fill:#fff;stroke:#5a6475;stroke-width:2}
.quad .end{fill:#ff6b3d;stroke:#fff;stroke-width:3}
.quad figcaption{text-align:center;font-size:13px;color:var(--muted);margin-top:4px}
.rev{border-left:4px solid var(--line);padding-left:12px;margin:10px 0}
.rev .t{font-size:15px;color:var(--muted)}
.rev .m{display:inline-block;font-size:13px;padding:1px 8px;border-radius:6px;margin-right:8px;vertical-align:1px}
.rev .p{font-size:15px;color:var(--ink);margin-top:2px}
.rev .s{font-size:14px;color:var(--mintline);margin-top:2px}
.who{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
.who h4{margin:12px 0 2px;font-size:14px;color:var(--muted);font-weight:800}
.who .try b{color:#a87800}
.who .k{font-size:14px;color:var(--muted)}
.who h3{margin:2px 0 8px;font-size:24px;color:var(--ink)}
.who p{margin:6px 0;font-size:16px;line-height:1.65}
.who p b{color:var(--accent)}
.who .try{background:#fff6d9;border-left:5px solid #f5b700;padding:8px 12px;border-radius:0 8px 8px 0;margin-top:10px;font-size:17px}
.end-tag{display:inline-block;font-size:15px;padding:4px 12px;border-radius:999px;background:var(--dark);color:#fff;margin-bottom:6px}
/* 擬真聊天畫面（群組、私訊、深夜訊息） */
#stage.chat{height:min(64vh,560px);align-items:center;background-size:cover;background-position:center}
#stage.chat:before{content:"";position:absolute;inset:0;backdrop-filter:blur(3px);background:rgba(10,20,40,.25)}
.phone{position:relative;z-index:1;width:min(92%,390px);height:94%;background:#111;border-radius:34px;padding:9px;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.phone .scr{width:100%;height:100%;border-radius:26px;overflow:hidden;display:flex;flex-direction:column;background:#8eabd6;font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;font-weight:500}
.phone .sb{display:flex;justify-content:space-between;align-items:center;padding:6px 20px 2px;font-size:13px;color:#fff;background:#2f3e57;font-weight:700}
.phone .sb .ic{display:flex;gap:5px;align-items:center}
.phone .sb .sig{display:inline-flex;gap:1px;align-items:flex-end;height:10px}.phone .sb .sig i{width:3px;background:#fff;border-radius:1px}
.phone .sb .bat{width:22px;height:11px;border:1.5px solid #fff;border-radius:3px;position:relative}.phone .sb .bat:after{content:"";position:absolute;left:1px;top:1px;bottom:1px;width:62%;background:#fff;border-radius:1px}
.phone .hd{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#2f3e57;color:#fff;font-size:16px;font-weight:700}
.phone .hd .bk{font-size:22px;line-height:1;opacity:.9}
.phone .hd .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phone .hd .mn{font-size:18px;letter-spacing:2px;opacity:.85}
.phone .ms{flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:7px;padding:10px 10px 12px}
.phone .dt{align-self:center;background:rgba(0,0,0,.18);color:#fff;font-size:12px;padding:2px 10px;border-radius:999px}
.phone .sys{align-self:center;background:rgba(0,0,0,.18);color:#fff;font-size:13px;padding:3px 12px;border-radius:12px;max-width:88%;text-align:center;line-height:1.45}
.phone .row{display:flex;gap:7px;align-items:flex-start;max-width:100%}
.phone .row.me{justify-content:flex-end}
.phone .av{flex:0 0 34px;height:34px;border-radius:50%;background:#7a8aa8;color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;background-size:300%;background-position:50% 4%;font-weight:700}
.phone .col{display:flex;flex-direction:column;max-width:76%}
.phone .who2{font-size:12px;color:#1d2a44;margin:0 0 2px 2px}
.phone .bw{display:flex;align-items:flex-end;gap:4px}
.phone .row.me .bw{flex-direction:row-reverse}
.phone .bb{background:#fff;color:#111;font-size:15.5px;line-height:1.45;padding:7px 11px;border-radius:16px;border-top-left-radius:4px;word-break:break-word}
.phone .row.me .bb{background:#86e37a;border-radius:16px;border-top-right-radius:4px}
.phone .tm{font-size:10.5px;color:#1d2a44;white-space:nowrap;line-height:1.25;text-align:right}
.phone .row:not(.me) .tm{text-align:left}
.phone .in{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#fff;border-top:1px solid #dde3ec}
.phone .in span{flex:1;background:#eef1f5;border-radius:999px;padding:6px 12px;font-size:13px;color:#8892a3}
.phone .in b{color:#2f3e57;font-size:18px}
.phone .new{animation:pop2 .3s ease-out}
@keyframes pop2{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
#stage.chat~#dlg{display:none}
@media (min-width:700px){#stage{min-height:300px;flex:0 0 auto}#char{width:220px}}
@media (max-width:480px){#hud .ttl{display:none}#hud{gap:8px}#stage{min-height:38vh}#stage.img{height:46vh}#stage.chat{height:62vh}}
#stage.chat #scene{display:none}
/* ---------- 標題、說明、選關 ---------- */
body.menu #hud{display:none}
.big{display:block;background:var(--accent);color:#fff;border:0;padding:15px 34px;border-radius:999px;font:inherit;font-weight:800;font-size:20px;cursor:pointer;box-shadow:0 4px 0 #d94f24,0 8px 24px rgba(255,107,61,.35);letter-spacing:.08em;transition:transform .1s}
.big:active{transform:translateY(2px);box-shadow:0 2px 0 #d94f24}
.big.wide{width:100%;margin-top:18px}
.ghost{display:block;background:rgba(255,255,255,.92);color:var(--ink);border:0;padding:12px 30px;border-radius:999px;font:inherit;font-weight:800;font-size:17px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.ttlpage{position:relative;min-height:100vh;min-height:100dvh;overflow:hidden;display:flex;flex-direction:column;align-items:center}
.ttlbg{position:absolute;inset:0;background-size:cover;background-position:center 35%;transform:scale(1.04);animation:drift 24s ease-in-out infinite alternate}
@keyframes drift{from{transform:scale(1.04) translateX(-1%)}to{transform:scale(1.08) translateX(1%)}}
.ttlpage:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0) 40%,rgba(255,255,255,.25) 70%,rgba(242,243,245,.9) 100%);pointer-events:none}
.gear{position:absolute;top:14px;right:14px;z-index:3;background:rgba(255,255,255,.85);border:0;border-radius:999px;padding:7px 14px;font:inherit;font-weight:800;font-size:14px;color:var(--ink);cursor:pointer}
.logo{position:relative;z-index:2;text-align:center;margin-top:clamp(40px,10vh,110px);padding:0 16px}
.logo .kick{display:inline-block;background:rgba(29,36,51,.75);color:#fff;font-size:clamp(13px,3.4vw,16px);padding:5px 16px;border-radius:999px;letter-spacing:.15em}
.logo h1{margin:12px 0 6px;font-size:clamp(52px,13vw,104px);line-height:1.05;color:#fff;letter-spacing:.1em;font-weight:900;
 text-shadow:0 3px 0 #ff6b3d,0 6px 0 #d94f24,0 12px 26px rgba(80,30,10,.45)}
.logo .tag{color:#fff;font-size:clamp(16px,4vw,21px);font-weight:800;text-shadow:0 2px 8px rgba(0,0,0,.45)}
.cast{position:absolute;z-index:1;bottom:0;left:0;right:0;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.cast .side{display:flex;align-items:flex-end}
.cast .gap{flex:0 0 clamp(150px,26vw,300px)}
.cast img{height:min(52vh,470px);margin:0 -3.5vw;filter:drop-shadow(0 8px 16px rgba(0,0,0,.3));animation:rise .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*.09s)}
.cast .l img:first-child,.cast .r img:last-child{height:min(46vh,420px)}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.menu-btns{position:absolute;z-index:3;bottom:clamp(24px,7vh,64px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:12px}
.menu-btns .big{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.04)}}
.modebadge{position:absolute;z-index:3;left:14px;top:16px;background:var(--accent2);color:var(--ink);font-size:13px;font-weight:800;padding:3px 10px;border-radius:6px}
.mhead{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.mhead h2{margin:0;font-size:24px;color:var(--ink);flex:1}
.back{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font:inherit;font-weight:800;color:var(--ink);cursor:pointer}
.howto,.sel{padding:18px 16px calc(28px + env(safe-area-inset-bottom))}
.hcard{background:#fff;border-radius:16px;padding:14px 18px;margin:12px 0;border-top:6px solid var(--accent);box-shadow:0 4px 14px rgba(29,36,51,.06)}
.hcard.c2{border-color:#f5b700}.hcard.c3{border-color:var(--green)}.hcard.c4{border-color:var(--brand)}
.hcard h3{margin:2px 0 6px;font-size:20px}
.hcard p{margin:6px 0;line-height:1.75;font-size:17px}
.hcard p b{color:var(--accent)}
.demo{display:flex;align-items:center;gap:8px;margin:6px 0 8px;font-weight:800;font-size:14px}
.demo i{flex:1;height:12px;background:#e6e8ec;border-radius:6px;overflow:hidden}.demo i b{display:block;height:100%;border-radius:6px}
.demo .br b{background:linear-gradient(90deg,#ff6b3d,#ff9b6e)}.demo .bg b{background:linear-gradient(90deg,#f5b700,#ffd75a)}
.demo .r{color:#e8552a}.demo .g{color:#c48f00}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.lv{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 14px rgba(29,36,51,.08);border-bottom:5px solid var(--hue)}
.thumb{position:relative;height:120px;background-size:cover;background-position:center}
.thumb:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.35))}
.thumb .no{position:absolute;z-index:1;left:10px;top:10px;width:34px;height:34px;border-radius:50%;background:var(--hue);color:#fff;font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.faces{position:absolute;z-index:1;right:10px;bottom:-22px;display:flex}
.faces span{width:54px;height:54px;border-radius:50%;border:3px solid #fff;background-color:#e6ebf3;background-size:230%;background-position:50% 1%;margin-left:-12px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.lvbody{padding:12px 14px 14px}

const TIER={0:'easy',1:'easy',2:'easy',3:'hard',4:'hard',5:'bonus'};
const NEED={easy:2,hard:1};
const tierOfCh=ch=>{const i=SCEN.findIndex(s=>s.ch.includes(ch));return TIER[i]||'easy';};
const modeOfCh=ch=>tierOfCh(ch)==='easy'?'easy':'hard';
function scenDone(sc,done){return sc.ch.some(ch=>done[ch]);}
function calcProg(done){const c={easy:0,hard:0,bonus:0,both:0};
 SCEN.forEach((sc,i)=>{if(sc.ch.some(ch=>done[ch]))c[TIER[i]]++;if(TIER[i]==='easy'&&sc.ch.every(ch=>done[ch]))c.both++;});
 c.easyMet=c.easy>=NEED.easy&&c.both>=1;c.met=c.easyMet&&c.hard>=NEED.hard;return c;}
function progress(){return calcProg(getDone());}

async function postRec(rec){
 const str=v=>({stringValue:String(v)}),int=v=>({integerValue:String(Math.round(v))});
 const f={cls:str(rec.cls),no:int(rec.no),ch:str(rec.ch),refl:str(rec.refl),d:str(rec.d)};

async function sendRec(rec){

}

function startCh(ch){

 SCREEN='game';menuMode(false);
 MODE=modeOfCh(ch);document.body.classList.toggle('hard',MODE==='hard');
 S={ch,node:null,R:5,G:5,mood:0,log:[],turn:0,flag:null,end:null,prev,threads:{},clock:null,chatT:null};

/* ===================== 圖片 =====================
   背景 img/<bg>.jpg；立繪 img/<角色>_<表情>.webp（tools/gen_talk.py 產圖、tools/talk_post.py 切圖）
   缺圖時自動退回 CSS 漸層與 SVG 臉，可以分批補圖。 */
const ART={
 A:{bg:'bg_club',chars:{'小鄭':'zheng'}},
 B:{bg:'bg_club',chars:{'阿武':'wu'}},
 C:{bg:'bg_shop_night',chars:{'小芸':'yun'}},
 D:{bg:'bg_shop_day',chars:{'鄭姐':'boss'}},
 E:{bg:'bg_class',chars:{'阿翔':'xiang'}},
 F:{bg:'bg_class',chars:{'小棠':'tang'}},
 G:{bg:'bg_home',chars:{'媽媽':'mom'}},
 H:{bg:'bg_home',chars:{'小安':'an'}},
 I:{bg:'bg_phone',chars:{'小萱':'xuan'}},
 J:{bg:'bg_field',chars:{'小晴':'qing'}},
 K:{bg:'bg_field',chars:{'小傑':'jie'}}
};
// 個別節點換場景（隔天、深夜看手機）
const NODEBG={'J.j3':'bg_phone','J.j3_pretend':'bg_class','J.j4':'bg_class','K.k4':'bg_phone','K.k5':'bg_class'};
// 不畫人物的說話者
const NOCHAR=['對話框','群組'];
// 立繪只畫四種表情，其他對應過去
const EXMAP={neutral:'neutral',happy:'happy',angry:'angry',cold:'angry',troubled:'troubled',tired:'troubled',surprised:'troubled'};
function bgOf(ch,id){const k=NODEBG[ch+'.'+id]||(ART[ch]&&ART[ch].bg);return k?`img/${k}.jpg`:null;}
function charSrc(ch,who,ex){const a=ART[ch];const n=a&&a.chars[who];return n?`img/${n}_${EXMAP[ex]||'neutral'}.webp`:null;}
function preloadCh(ch){const a=ART[ch];if(!a)return;const L=[`img/${a.bg}.jpg`];
 Object.entries(NODEBG).filter(([k])=>k.startsWith(ch+'.')).forEach(([,v])=>L.push(`img/${v}.jpg`));
 Object.values(a.chars).forEach(n=>['neutral','happy','angry','troubled'].forEach(e=>L.push(`img/${n}_${e}.webp`)));
 L.forEach(u=>{const i=new Image();i.src=u;});}
/* ===================== 擬真聊天畫面 ===================== */
const CHAT={I:n=>n.who==='小萱'?'小萱':'好朋友（6）','J.j3':'小晴','K.k4':'小傑'};
const CLOCK={I:22*60+3,J:23*60+1,K:23*60+2};
function chatOf(ch,id,n){const f=CHAT[ch+'.'+id]||CHAT[ch];return typeof f==='function'?f(n):(f||null);}
const hhmm=m=>{m=((m%1440)+1440)%1440;const h=Math.floor(m/60),mm=m%60;return (h<12?'上午 ':'下午 ')+((h%12)||12)+':'+String(mm).padStart(2,'0');};
const clk=m=>String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const AVC=['#ff8a65','#4fb3ff','#ffb300','#7c6cf2','#26b37a','#ef5da8'];
function avHTML(name){for(const k in ART){const f=ART[k].chars[name];if(f)return `<div class="av" style="background-image:url('img/${f}_neutral.webp');background-color:#c9d6ea"></div>`;}
 let h=0;for(const c of name)h=(h*31+c.charCodeAt(0))%997;return `<div class="av" style="background:${AVC[h%AVC.length]}">${name.slice(-1)}</div>`;}
function parseSay(say,title){return say.split('\n').map(x=>x.trim()).filter(Boolean).map(x=>{
 let m=x.match(/^（(.*)）$/);if(m)return {sys:m[1]};
 m=x.match(/^([^：\s]{1,4})：(.+)$/);if(m)return {from:m[1],text:m[2]};
 return {from:title,text:x};});}
function addMsgs(title,list){S.threads=S.threads||{};const T=S.threads[title]=S.threads[title]||[];
 list.forEach(m=>{if(!m.sys){S.clock+=Math.random()<.5?1:0;}m.t=S.clock;T.push(m);});}
function msgsHTML(title,fresh){const T=(S.threads&&S.threads[title])||[];const group=title.includes('（');const L=T.slice(-10);
 return `<div class="dt">今天</div>`+L.map((m,i)=>{const nw=i>=L.length-fresh?' new':'';
  if(m.sys)return `<div class="sys${nw}">${m.sys}</div>`;
  if(m.me)return `<div class="row me${nw}"><div class="col"><div class="bw"><div class="bb">${m.text}</div><div class="tm">${group?'已讀 4':'已讀'}<br>${hhmm(m.t)}</div></div></div></div>`;
  return `<div class="row${nw}">${avHTML(m.from)}<div class="col">${group?`<div class="who2">${m.from}</div>`:''}<div class="bw"><div class="bb">${m.text}</div><div class="tm">${hhmm(m.t)}</div></div></div></div>`;}).join('');}
function phoneHTML(title,fresh){
 return `<div class="phone"><div class="scr"><div class="sb"><span>${clk(S.clock)}</span><span class="ic"><span class="sig"><i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:10px"></i></span>5G<span class="bat"></span></span></div>
 <div class="hd"><span class="bk">‹</span><span class="nm">${title}</span><span class="mn">⋯</span></div>
 <div class="ms" id="pms">${msgsHTML(title,fresh)}</div>
 <div class="in"><b>＋</b><span>輸入訊息</span><b>Aa</b></div></div></div>`;}
function myMsg(t){let m=t.match(/^（(.*)）$/);if(m)return {sys:m[1]};m=t.match(/^「(.*)」$/);return {me:true,text:m?m[1]:t};}

function charHTML(c,ex,who){
 if(NOCHAR.includes(who))return '';
 const color=c.bg==='bgA'?'#4a6fa5':'#a5584a';
 const src=charSrc(S.ch,who,ex);
 if(src)return `<img id="char" class="art" src="${src}" alt="" onerror="this.outerHTML=faceSVG('${ex}','${color}')">`;
 return faceSVG(ex,color);
}

function go(id){
 if(id==='END')return ending();
 const c=C[S.ch],n=c.nodes[id];
 S.node=id;S.turn++;
 S.perm=n.opts.map((_,i)=>i).sort(()=>Math.random()-.5);
 const ex=n.ex||'neutral';
 const who=n.who||c.npc;
 const bgu=bgOf(S.ch,id);
 const bgStyle=bgu?` style="background-image:url('${bgu}'),var(--grad)"`:'';
 const chatT=chatOf(S.ch,id,n);S.chatT=chatT;
 let inner;
 if(chatT){if(S.clock==null)S.clock=CLOCK[S.ch]||22*60;const L=parseSay(n.say,chatT);addMsgs(chatT,L);inner=phoneHTML(chatT,L.length);}
 else inner=`<div id="scene">${c.scene}　｜　第 ${S.turn} 回合</div>${charHTML(c,ex,who)}`;
 $('#view').innerHTML=`
  <div id="stage" class="${c.bg}${bgu?' img':''}${chatT?' chat':''}"${bgStyle}>${inner}</div>
  <div id="dlg"><div id="who">${who}</div><div id="say">${n.say}</div></div>
  <div id="opts">${n.q?`<div class="hint">${n.q}</div>`:''}${S.perm.map((j,i)=>`<button class="opt${n.q?' q':''}" onclick="pick(${j})"><b>${i+1}</b><span>${n.opts[j].t}</span></button>`).join('')}</div>`;
 hud();
 window.scrollTo(0,0);
}

function pick(i){
 const c=C[S.ch],n=c.nodes[S.node],o=n.opts[i];
 const r0=S.R,g0=S.G;
 S.R=clamp(S.R+o.r,0,10);S.G=clamp(S.G+o.g,0,10);S.mood=clamp(S.mood+o.mood,-3,3);
 if(o.end)S.end=o.end;
 if(o.flag)S.flag=o.flag;
 S.log.push({turn:S.turn,npc:n.say.split('\n')[0],t:o.t,m:o.m,k:o.tip.k,p:o.tip.p,s:o.tip.s,r:o.r,g:o.g});
 if(S.chatT){S.clock+=1;addMsgs(S.chatT,[myMsg(o.t)]);const ms=$('#pms');if(ms)ms.innerHTML=msgsHTML(S.chatT,1);}
 $('#who').textContent=c.me;$('#who').className='me';
 $('#say').textContent=o.t;
 $('#opts').innerHTML='';
 const ch=$('#char');
 if(ch){if(o.mood<0)ch.classList.add('shake');else if(o.mood>0)ch.classList.add('pop');}
 hud(S.R-r0,S.G-g0);
 if(MODE==='hard'){setTimeout(()=>go(o.next),1100);}else setTimeout(()=>coach(o),420);
}

function coach(o){
 const t=o.tip;const L=labelsOf(C[S.ch]);
 const d=(v,l)=>`<span class="${v>0?'up':v<0?'dn':''}">${l} ${v>0?'+'+v:v}</span>`;
 $('#coachCard').innerHTML=`
  <span class="tag m${o.m}">${MODENAME[o.m]}</span>
  <h3>${t.k||'　'}</h3>

  ${t.s?`<div class="src">課文：${t.s}</div>`:''}
  ${t.th?`<p class="th">學理：${t.th}</p>`:''}
  <button onclick="closeCoach('${o.next}')">繼續</button>`;
 $('#coach').classList.add('on');
}
function closeCoach(next){$('#coach').classList.remove('on');go(next);}

function quadSVG(c,L,key){
 const Q=c.quads||{WW:'雙贏',RL:'關係好・事沒成',GL:'事成・關係傷',LL:'雙輸'};
 const X=v=>48+v*25.6, Y=v=>270-v*25.6, T=5.5;   // 0..10 映到 48..304 / 270..14；6 分以上算「好」
 // 重建每一回合的位置
 let r=5,g=5;const P=[[g,r]];S.log.forEach(l=>{r=clamp(r+l.r,0,10);g=clamp(g+l.g,0,10);P.push([g,r]);});
 const pts=P.map(([g,r])=>`${X(g).toFixed(1)},${Y(r).toFixed(1)}`).join(' ');
 const on=k=>(!S.end&&k===key)?' on':'';
 const cell=(k,x,y,w,h,fill)=>`<rect class="qc${on(k)}" x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}"/>`;
 const lab=(k,x,y,anchor)=>`<text class="ql${on(k)}" x="${x}" y="${y}" text-anchor="${anchor}">${Q[k]}</text>`;
 const xm=X(T),ym=Y(T);
 return `<figure class="quad"><svg viewBox="0 0 320 312" role="img" aria-label="${L[0]}與${L[1]}的落點">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d2433"/></marker>
  <radialGradient id="glow"><stop offset="0" stop-color="#ff6b3d" stop-opacity=".45"/><stop offset="1" stop-color="#ff6b3d" stop-opacity="0"/></radialGradient></defs>
  ${cell('RL',48,14,xm-48,ym-14,'#fff4cc')}${cell('WW',xm,14,304-xm,ym-14,'#d9f5e6')}
  ${cell('LL',48,ym,xm-48,270-ym,'#eceef2')}${cell('GL',xm,ym,304-xm,270-ym,'#ffe3d8')}
  <line x1="${xm}" y1="14" x2="${xm}" y2="270" class="mid"/><line x1="48" y1="${ym}" x2="304" y2="${ym}" class="mid"/>
  ${lab('RL',56,32,'start')}${lab('WW',296,32,'end')}${lab('LL',56,262,'start')}${lab('GL',296,262,'end')}
  <line x1="48" y1="270" x2="312" y2="270" class="axis" marker-end="url(#ar)"/><line x1="48" y1="270" x2="48" y2="6" class="axis" marker-end="url(#ar)"/>
  <text class="at" x="176" y="296" text-anchor="middle">${L[1]}</text>
  <text class="at" x="22" y="142" text-anchor="middle" writing-mode="tb" glyph-orientation-vertical="0">${L[0]}</text>
  <text class="tk" x="48" y="288" text-anchor="middle">0</text><text class="tk" x="304" y="288" text-anchor="middle">10</text>
  <polyline points="${pts}" class="path"/>
  ${P.slice(0,-1).map(([g,r],i)=>`<circle cx="${X(g)}" cy="${Y(r)}" r="${i?3.5:5}" class="${i?'step':'start'}"/>`).join('')}
  <text class="tk" x="${X(5)-8}" y="${Y(5)-9}" text-anchor="end">起點</text>
  <circle cx="${X(P.at(-1)[0])}" cy="${Y(P.at(-1)[1])}" r="20" fill="url(#glow)"/>
  <circle cx="${X(P.at(-1)[0])}" cy="${Y(P.at(-1)[1])}" r="8" class="end"/>
 </svg><figcaption>${S.end?'這是特別結局，不看象限，看的是你最後有沒有停下來。虛線是你每一回合的移動。':'虛線是你每一回合的移動，橘點是結局落點。'}</figcaption></figure>`;
}
function ending(){
 const c=C[S.ch];const L=labelsOf(c);const dflt=!c.labels;
 const q=(S.R>=6?'W':'L')+(S.G>=6?'W':'L');
 const key={WW:'WW',WL:'RL',LW:'GL',LL:'LL'}[q];
 let name=dflt?{WW:'雙贏：事情談成，關係還在',RL:'關係還在，但事情沒談成',GL:'事情談成，但關係傷了',LL:'雙輸：事情沒成，關係也沒了'}[key]
  :{WW:'兩邊都保住了',RL:'關係還在，但目標沒達到',GL:'目標達到，但關係傷了',LL:'兩邊都沒了'}[key];
 if(c.titles&&c.titles[key])name=c.titles[key];
 let story=c.endings[key];
 const sp=c.special||{};
 if(S.end==='RESPECT'){name=(sp.RESPECT&&sp.RESPECT.n)||'停在該停的地方';story=(sp.RESPECT&&sp.RESPECT.s)||story;}
 if(S.end==='HARASS'){name=(sp.HARASS&&sp.HARASS.n)||'越線了';story=(sp.HARASS&&sp.HARASS.s)||story;}
 const modes=S.log.reduce((a,l)=>(a[l.m]=(a[l.m]||0)+1,a),{});
 const main=Object.entries(modes).sort((a,b)=>b[1]-a[1])[0];
 S.endName=name;
 PREV={ch:S.ch,flag:S.flag||'none',R:S.R,G:S.G,end:S.end};
 const sc=scenOf(S.ch);
 const sib=sc?sc.ch.find(x=>x!==S.ch):null;
 const nextBtn=c.next?`<button class="btn alt" onclick="startCh('${c.next}')">下一關：${C[c.next].title}</button>`
  :(sib?`<button class="btn alt" onclick="startCh('${sib}')">換個視角：${C[sib].title}</button>`:'');
 $('#view').innerHTML=`<div class="page">
  <span class="end-tag">${c.title}　結局</span>
  <h1>${name}</h1>
  ${quadSVG(c,L,key)}
  <p>${story}</p>
  ${profileHTML(key,modes)}
  <p class="sub">你這場最常用的模式：<span class="m m${main[0]}" style="padding:1px 8px;border-radius:6px;margin:0 6px">${MODENAME[main[0]]}</span> 共 ${S.turn} 回合</p>
  <h2>回顧</h2>
  ${S.log.map(l=>`<div class="rev"><div class="t">第 ${l.turn} 回合　${l.npc}</div><div><span class="m m${l.m}">${MODENAME[l.m]}</span> ${l.t}</div><div class="t">${l.k||''}　${L[0]} ${l.r>0?'+':''}${l.r}　${L[1]} ${l.g>0?'+':''}${l.g}</div>${MODE==='hard'?`<div class="p">${l.p}</div>${l.s?`<div class="s">課文：${l.s}</div>`:''}`:''}</div>`).join('')}
  <div class="note">這場的結局是遊戲算的。現實裡同一句話可能沒用，也可能比這裡更好，因為真人會給你第二次機會，程式不會。燭之武那天把話講到最好，兩年後秦國還是來了。說話改變的是機會，不是結果。但有講，機會就在；沒講，什麼都不會變。</div>
  <h2>想一想</h2>
  <ul>
   <li>哪一回合是轉折？如果那一句換一種講法，後面會不會不一樣？</li>
   <li>有沒有哪一句「婉轉」的話，對方其實沒聽懂？那時候該不該直接講？</li>
   <li>對方哪一句是「再看看」，哪一句是「不要」？你分得出來嗎？分出來之後，你做的事有不一樣嗎？</li>
   <li>你有沒有挑過「最長、看起來最周到」的那個選項？它是對的嗎？講得多和講得對是兩件事。</li>
  </ul>
  ${afterHTML()}
  <p class="sub" style="text-align:center;margin-top:18px"><a href="#" onclick="startCh('${S.ch}');return false">不送出，重玩這一場</a>　｜　<a href="#" onclick="select();return false">不送出，回到選關</a></p>
 </div>`;
 hud();window.scrollTo(0,0);
}

function profileHTML(key,modes){
 const ov=C[S.ch].prof||{};const P=k=>ov[k]||PROFILES[k];
 let p;
 if(S.end==='HARASS')p=P('HARASS');
 else if(S.end==='RESPECT')p=P('RESPECT');
 else{
  const firstY=S.log.findIndex(l=>l.m==='讓'),lastA=S.log.map(l=>l.m).lastIndexOf('攻');
  const top=Object.entries(modes).sort((a,b)=>b[1]-a[1])[0][0];
  if((modes['讓']||0)>=2&&lastA>firstY&&firstY>=0)p=P('burst');
  else if(top==='合')p=key==='WW'?P('合W'):P('合L');
  else p=P(top);
 }
 S.profName=p.n;
 return `<div class="who"><div class="k">${C[S.ch].prof?'這一場的你':'這場你是哪一種溝通者'}</div><h3>${p.n}</h3><p><b>${p.k}</b></p><h4>別人眼中的你</h4><p>${p.a}</p><h4>你自己的感覺</h4><p>${p.b}</p>${p.w?`<h4>課文裡像誰</h4><p>${p.w}</p>`:''}<div class="try"><b>下次試試看</b><br>${p.t}</div></div>`;
}

 const k=parseInt(e.key);if(k>=1&&k<=4){const b=document.querySelectorAll('.opt')[k-1];if(b)b.click();}
});
cover();
